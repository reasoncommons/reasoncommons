# Test the ltp skill helpers. The collaboration YAML moved to the private
# reasoncommons/product repo on 2026-10-21, so PR reasoning and receipts are no longer
# checked here.
name: Tree check
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions:
  contents: read
jobs:
  tree-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Test reasoning and approval helpers
        run: python3 -m unittest discover -s skills/ltp/tests
