# FICTIONAL EXAMPLE. Willow Lane Primary, its people and their reports are invented.
# This is a working file in the reason-commons skill's conversational format (schema version 1),
# written to show what a published commons can hold. Nothing in it is accepted: only the Reason Commons
# commons records acceptance. Do not copy its claims into real work.
schema_version: 1
project: A safer walk to Willow Lane Primary
driver: amara
participants:
  amara: Amara
  grace: Grace
  tomasz: Tomasz
  dev: Dev
  ruth: Ruth
active_tree: future_reality
trees:
  goal:
    nodes:
    - id: wl-g-goal
      kind: goal
      text: Every child at Willow Lane Primary can walk, scoot or cycle to school safely.
      status: proposed
      contributions:
      - {by: amara, attribution: explicit, mode: text}
    - id: wl-g-calm-gate
      kind: critical_success_factor
      text: Traffic outside the school gate is slow and light at drop-off and pick-up.
      status: proposed
      contributions:
      - {by: grace, attribution: explicit, mode: text}
    - id: wl-g-safe-routes
      kind: critical_success_factor
      text: The routes children use feel safe enough that parents let them walk.
      status: proposed
      contributions:
      - {by: amara, attribution: explicit, mode: voice}
    - id: wl-g-far-families
      kind: critical_success_factor
      text: Families who live too far to walk can still finish the journey on foot.
      status: proposed
      contributions:
      - {by: assistant, attribution: assistant, mode: text}
    - id: wl-g-shops
      kind: critical_success_factor
      text: The shops on Willow Lane keep the customers they rely on.
      status: proposed
      contributions:
      - {by: tomasz, attribution: explicit, mode: text}
    - id: wl-g-crossing
      kind: necessary_condition
      text: Children can cross Mill Road with help from a crossing patrol at both school times.
      label: Children can cross Mill Road with a crossing patrol at both school times.
      status: proposed
      contributions:
      - {by: ruth, attribution: explicit, mode: text}
    links:
    - id: wl-g-rel-gate
      from: [wl-g-calm-gate]
      to: wl-g-goal
      relation: necessary_for
      status: proposed
      contributions:
      - {by: grace, attribution: explicit, mode: text}
    - id: wl-g-rel-routes
      from: [wl-g-safe-routes]
      to: wl-g-goal
      relation: necessary_for
      status: proposed
      contributions:
      - {by: amara, attribution: explicit, mode: text}
    - id: wl-g-rel-far
      from: [wl-g-far-families]
      to: wl-g-goal
      relation: necessary_for
      status: proposed
      contributions:
      - {by: assistant, attribution: assistant, mode: text}
    - id: wl-g-rel-shops
      from: [wl-g-shops]
      to: wl-g-goal
      relation: necessary_for
      status: proposed
      contributions:
      - {by: tomasz, attribution: explicit, mode: text}
    - id: wl-g-rel-crossing
      from: [wl-g-crossing]
      to: wl-g-safe-routes
      relation: necessary_for
      status: proposed
      contributions:
      - {by: ruth, attribution: explicit, mode: text}
    backlog:
    - ref: wl-g-far-families
      work: connect_or_explain
      label: Agree with families how far is too far to walk.
      note: Grace suggests half a mile. Families on the estate beyond the ring road live about a mile and a half away.
  current_reality:
    nodes:
    - id: wl-r-queue
      kind: undesirable_effect
      text: Cars queue and double-park outside the school gate between 8:30 and 8:50.
      label: Cars queue and double-park outside the gate at drop-off.
      status: proposed
      contributions:
      - {by: amara, attribution: explicit, mode: text}
    - id: wl-r-hidden
      kind: undesirable_effect
      text: Children step out between parked cars where drivers cannot see them.
      status: proposed
      contributions:
      - {by: grace, attribution: explicit, mode: text}
    - id: wl-r-fewer-walk
      kind: undesirable_effect
      text: Fewer children walk to school than five years ago, according to the school's travel survey.
      label: Fewer children walk to school than five years ago.
      status: proposed
      contributions:
      - {by: grace, attribution: explicit, mode: text}
    - id: wl-r-bakery-jams
      kind: undesirable_effect
      text: Morning customers give up on Tomasz's bakery when the street is jammed.
      status: proposed
      contributions:
      - {by: tomasz, attribution: explicit, mode: text}
    - id: wl-r-on-the-way
      kind: cause
      text: Many parents drop their children off by car on the way to work.
      status: proposed
      contributions:
      - {by: dev, attribution: explicit, mode: text}
    - id: wl-r-nowhere-to-stop
      kind: cause
      text: There is nowhere near the gate for drivers to stop briefly.
      status: proposed
      contributions:
      - {by: dev, attribution: explicit, mode: text}
    - id: wl-r-feels-unsafe
      kind: cause
      text: Parents feel the walk is unsafe, so more of them drive.
      status: proposed
      contributions:
      - {by: amara, attribution: explicit, mode: text}
    - id: wl-r-through-traffic
      kind: cause
      text: Most cars on Willow Lane at 8:30 are driving through to the industrial estate, not dropping children off.
      label: Most cars at 8:30 are driving through, not dropping children off.
      status: proposed
      contributions:
      - {by: tomasz, attribution: explicit, mode: text}
      challenges:
      - text: The council's June count found that two in three cars stopping near the gate at 8:30 were dropping children off.
        by: dev
    - id: wl-r-narrow-pavement
      kind: cause
      text: The pavement outside the bakery is too narrow for two buggies to pass.
      status: proposed
      contributions:
      - {by: ruth, attribution: explicit, mode: text}
    links:
    - id: wl-r-rel-queue
      from: [wl-r-on-the-way, wl-r-nowhere-to-stop]
      to: wl-r-queue
      relation: contributes_to
      status: proposed
      contributions:
      - {by: assistant, attribution: assistant, mode: text}
      assumptions:
      - text: Most of these drivers would stop somewhere else if there were somewhere to stop.
        by: dev
    - id: wl-r-rel-hidden
      from: [wl-r-queue]
      to: wl-r-hidden
      relation: contributes_to
      status: proposed
      contributions:
      - {by: grace, attribution: explicit, mode: text}
    - id: wl-r-rel-bakery
      from: [wl-r-queue]
      to: wl-r-bakery-jams
      relation: contributes_to
      status: proposed
      contributions:
      - {by: tomasz, attribution: explicit, mode: text}
    - id: wl-r-rel-unsafe
      from: [wl-r-hidden]
      to: wl-r-feels-unsafe
      relation: contributes_to
      status: proposed
      contributions:
      - {by: amara, attribution: explicit, mode: text}
    - id: wl-r-rel-fewer
      from: [wl-r-feels-unsafe]
      to: wl-r-fewer-walk
      relation: contributes_to
      status: proposed
      contributions:
      - {by: grace, attribution: explicit, mode: text}
      assumptions:
      - text: The travel survey reflects how families really travel, not only the families who answered it.
        by: grace
    - id: wl-r-rel-through
      from: [wl-r-through-traffic]
      to: wl-r-queue
      relation: contributes_to
      status: proposed
      contributions:
      - {by: tomasz, attribution: explicit, mode: text}
    - id: wl-r-rel-pavement
      from: [wl-r-narrow-pavement]
      to: wl-r-feels-unsafe
      relation: contributes_to
      status: proposed
      contributions:
      - {by: ruth, attribution: explicit, mode: text}
    backlog:
    - ref: wl-r-through-traffic
      work: resolve_challenge
      label: Repeat the traffic count to settle how many cars are passing through.
      note: Tomasz and Dev disagree. Dev's June count found two in three cars stopping near the gate were drop-offs.
    - ref: wl-r-feels-unsafe
      work: connect_or_explain
      label: Check whether more driving makes the walk feel even less safe.
  conflict:
    nodes:
    - id: wl-c-objective
      kind: objective
      text: Willow Lane works for the children walking to school and for the shops.
      status: proposed
      contributions:
      - {by: grace, attribution: explicit, mode: text}
    - id: wl-c-need-safe
      kind: need
      text: Children are safe at the gate at drop-off and pick-up.
      status: proposed
      contributions:
      - {by: amara, attribution: explicit, mode: text}
    - id: wl-c-close
      kind: prerequisite
      text: Close Willow Lane to cars at school times.
      status: proposed
      contributions:
      - {by: amara, attribution: explicit, mode: text}
    - id: wl-c-need-trade
      kind: need
      text: The bakery and the other shops keep their morning trade.
      status: proposed
      contributions:
      - {by: tomasz, attribution: explicit, mode: text}
    - id: wl-c-keep-open
      kind: prerequisite
      text: Keep Willow Lane open to cars all day.
      status: proposed
      contributions:
      - {by: tomasz, attribution: explicit, mode: text}
    links:
    - id: wl-c-rel-safe
      from: [wl-c-need-safe]
      to: wl-c-objective
      relation: necessary_for
      status: proposed
      contributions:
      - {by: assistant, attribution: assistant, mode: text}
    - id: wl-c-rel-trade
      from: [wl-c-need-trade]
      to: wl-c-objective
      relation: necessary_for
      status: proposed
      contributions:
      - {by: assistant, attribution: assistant, mode: text}
    - id: wl-c-rel-close
      from: [wl-c-close]
      to: wl-c-need-safe
      relation: necessary_for
      status: proposed
      contributions:
      - {by: amara, attribution: explicit, mode: text}
      assumptions:
      - text: Nothing short of closing the street will stop drivers stopping at the gate.
        by: amara
    - id: wl-c-rel-open
      from: [wl-c-keep-open]
      to: wl-c-need-trade
      relation: necessary_for
      status: proposed
      contributions:
      - {by: tomasz, attribution: explicit, mode: text}
      assumptions:
      - text: Most of the bakery's morning customers arrive by car.
        by: tomasz
      challenges:
      - text: I stood outside the bakery for a week before the summer holidays. Most customers before nine came on foot or by bike.
        by: amara
    - id: wl-c-rel-clash
      from: [wl-c-close]
      to: wl-c-keep-open
      relation: conflicts_with
      status: proposed
      contributions:
      - {by: assistant, attribution: assistant, mode: text}
      assumptions:
      - text: A closure has to cover the whole street, for everyone, for as long as it applies.
        by: assistant
    backlog:
    - ref: wl-c-rel-open
      work: examine_assumption
      label: Count how the bakery's customers arrive before nine.
      note: Tomasz assumes most come by car. Amara's week outside the shop suggests most walk.
  future_reality:
    nodes:
    - id: wl-f-closure
      kind: injection
      text: Willow Lane closes to through traffic from 8:20 to 9:00 and from 2:50 to 3:30 on school days, with deliveries, residents and blue badge holders exempt.
      label: Willow Lane closes to through traffic at school times, with deliveries exempt.
      status: proposed
      contributions:
      - {by: amara, attribution: explicit, mode: text}
      - {by: tomasz, attribution: explicit, mode: text}
      addresses: [wl-r-queue, wl-r-hidden]
      derived_from: [wl-c-close, wl-c-keep-open]
    - id: wl-f-park-stride
      kind: injection
      text: Families who drive can park at the leisure centre and walk the last five minutes.
      status: proposed
      contributions:
      - {by: dev, attribution: explicit, mode: text}
      addresses: [wl-r-nowhere-to-stop]
    - id: wl-f-hatch
      kind: injection
      text: Tomasz opens a walk-up hatch selling coffee to parents on foot.
      status: proposed
      contributions:
      - {by: tomasz, attribution: explicit, mode: text}
      addresses: [wl-r-bakery-jams]
    - id: wl-f-fewer-cars
      kind: predicted_effect
      text: Far fewer cars stop outside the gate at school times.
      status: proposed
      contributions:
      - {by: amara, attribution: explicit, mode: text}
    - id: wl-f-mill-lane
      kind: undesirable_effect
      text: Some traffic moves onto Mill Lane while Willow Lane is closed.
      status: proposed
      contributions:
      - {by: ruth, attribution: explicit, mode: text}
    - id: wl-f-foot-trade
      kind: predicted_effect
      text: Parents on foot stop at the bakery on their way home.
      status: proposed
      contributions:
      - {by: tomasz, attribution: explicit, mode: text}
    - id: wl-f-clear-view
      kind: predicted_effect
      text: Children cross where drivers can see them.
      status: proposed
      contributions:
      - {by: grace, attribution: explicit, mode: text}
    - id: wl-f-trade-kept
      kind: desirable_effect
      text: The bakery keeps its morning trade.
      status: proposed
      contributions:
      - {by: tomasz, attribution: explicit, mode: text}
    - id: wl-f-more-walk
      kind: desirable_effect
      text: More children walk, scoot or cycle to school.
      status: proposed
      contributions:
      - {by: grace, attribution: explicit, mode: text}
    links:
    - id: wl-f-rel-fewer
      from: [wl-f-closure, wl-f-park-stride]
      to: wl-f-fewer-cars
      relation: contributes_to
      status: proposed
      contributions:
      - {by: assistant, attribution: assistant, mode: text}
      assumptions:
      - text: Parents who drive will use the leisure centre rather than stop on nearby streets.
        by: dev
    - id: wl-f-rel-mill
      from: [wl-f-closure]
      to: wl-f-mill-lane
      relation: contributes_to
      status: proposed
      contributions:
      - {by: ruth, attribution: explicit, mode: text}
    - id: wl-f-rel-trade
      from: [wl-f-closure, wl-f-hatch]
      to: wl-f-foot-trade
      relation: contributes_to
      status: proposed
      contributions:
      - {by: tomasz, attribution: explicit, mode: text}
    - id: wl-f-rel-view
      from: [wl-f-fewer-cars]
      to: wl-f-clear-view
      relation: contributes_to
      status: proposed
      contributions:
      - {by: grace, attribution: explicit, mode: text}
    - id: wl-f-rel-kept
      from: [wl-f-foot-trade]
      to: wl-f-trade-kept
      relation: contributes_to
      status: proposed
      contributions:
      - {by: tomasz, attribution: explicit, mode: text}
    - id: wl-f-rel-walk
      from: [wl-f-clear-view]
      to: wl-f-more-walk
      relation: contributes_to
      status: proposed
      contributions:
      - {by: amara, attribution: explicit, mode: text}
      assumptions:
      - text: Parents decide mainly on how safe the gate feels, more than on distance or weather.
        by: grace
    backlog:
    - ref: wl-f-mill-lane
      work: review_feedback
      label: Decide whether Mill Lane needs a 20 mph limit during the trial.
      note: Ruth reported queues at the Mill Lane junction in the first week of the trial.
    - ref: wl-f-hatch
      work: test_causality
      label: Try the hatch for a month and see who stops.
  prerequisite:
    nodes:
    - id: wl-p-objective
      kind: objective
      text: Willow Lane closes at school times from the first day of the autumn term.
      status: proposed
      contributions:
      - {by: amara, attribution: explicit, mode: text}
      implements: [wl-f-closure]
    - id: wl-p-io-order
      kind: intermediate_objective
      text: An experimental traffic order allows a six-month trial.
      status: proposed
      contributions:
      - {by: dev, attribution: explicit, mode: text}
    - id: wl-p-io-rota
      kind: intermediate_objective
      text: A rota of trained volunteer marshals covers every school day.
      status: proposed
      contributions:
      - {by: amara, attribution: explicit, mode: text}
    - id: wl-p-io-permits
      kind: intermediate_objective
      text: Residents have permits and know how the exemption works.
      status: proposed
      contributions:
      - {by: assistant, attribution: assistant, mode: text}
    - id: wl-p-io-spaces
      kind: intermediate_objective
      text: The leisure centre sets aside forty morning spaces for parents.
      status: proposed
      contributions:
      - {by: amara, attribution: explicit, mode: text}
    - id: wl-p-obs-order
      kind: obstacle
      text: The street cannot close without a council traffic order.
      status: proposed
      contributions:
      - {by: dev, attribution: explicit, mode: text}
    - id: wl-p-obs-barriers
      kind: obstacle
      text: Someone has to put the barriers out and take them in twice a day.
      status: proposed
      contributions:
      - {by: grace, attribution: explicit, mode: text}
    - id: wl-p-obs-residents
      kind: obstacle
      text: People who live on Willow Lane worry they will be shut in at school times.
      status: proposed
      contributions:
      - {by: dev, attribution: explicit, mode: text}
    - id: wl-p-obs-parking
      kind: obstacle
      text: The leisure centre has not agreed to let parents park in the mornings.
      status: proposed
      contributions:
      - {by: amara, attribution: explicit, mode: text}
    links:
    - id: wl-p-rel-order
      from: [wl-p-io-order]
      to: wl-p-objective
      relation: necessary_for
      status: proposed
      contributions:
      - {by: dev, attribution: explicit, mode: text}
    - id: wl-p-rel-rota
      from: [wl-p-io-rota]
      to: wl-p-objective
      relation: necessary_for
      status: proposed
      contributions:
      - {by: amara, attribution: explicit, mode: text}
    - id: wl-p-rel-permits
      from: [wl-p-io-permits]
      to: wl-p-objective
      relation: necessary_for
      status: proposed
      contributions:
      - {by: assistant, attribution: assistant, mode: text}
    - id: wl-p-rel-spaces
      from: [wl-p-io-spaces]
      to: wl-p-objective
      relation: necessary_for
      status: proposed
      contributions:
      - {by: amara, attribution: explicit, mode: text}
    - id: wl-p-rel-over-order
      from: [wl-p-io-order]
      to: wl-p-obs-order
      relation: overcomes
      status: proposed
      contributions:
      - {by: dev, attribution: explicit, mode: text}
    - id: wl-p-rel-over-barriers
      from: [wl-p-io-rota]
      to: wl-p-obs-barriers
      relation: overcomes
      status: proposed
      contributions:
      - {by: amara, attribution: explicit, mode: text}
    - id: wl-p-rel-over-residents
      from: [wl-p-io-permits]
      to: wl-p-obs-residents
      relation: overcomes
      status: proposed
      contributions:
      - {by: assistant, attribution: assistant, mode: text}
    - id: wl-p-rel-over-parking
      from: [wl-p-io-spaces]
      to: wl-p-obs-parking
      relation: overcomes
      status: proposed
      contributions:
      - {by: amara, attribution: explicit, mode: text}
    backlog:
    - ref: wl-p-io-spaces
      work: connect_or_explain
      label: No one has asked the leisure centre yet.
  transition:
    nodes:
    - id: wl-t-draft-order
      kind: action
      text: Dev drafts the experimental traffic order, with permits for residents, and opens the consultation.
      status: proposed
      contributions:
      - {by: dev, attribution: explicit, mode: text}
      implements: [wl-p-io-order, wl-p-io-permits]
    - id: wl-t-letter
      kind: action
      text: Grace writes to every family explaining the closure and the park-and-stride spot.
      status: proposed
      contributions:
      - {by: grace, attribution: explicit, mode: text}
    - id: wl-t-recruit
      kind: action
      text: Amara recruits marshals at the PTA meeting and sets up the rota.
      status: proposed
      contributions:
      - {by: amara, attribution: explicit, mode: text}
      implements: [wl-p-io-rota]
    - id: wl-t-count
      kind: action
      text: Dev counts traffic on Mill Lane for a week before the trial and a week into it.
      status: proposed
      contributions:
      - {by: ruth, attribution: explicit, mode: text}
    - id: wl-t-ee-order
      kind: expected_effect
      text: The traffic order and residents' permits are in place before the first day.
      status: proposed
      contributions:
      - {by: dev, attribution: explicit, mode: text}
    - id: wl-t-ee-families
      kind: expected_effect
      text: Every family knows how the closure works before it starts.
      status: proposed
      contributions:
      - {by: grace, attribution: explicit, mode: text}
    - id: wl-t-ee-rota
      kind: expected_effect
      text: Two trained marshals are on duty every school day.
      status: proposed
      contributions:
      - {by: amara, attribution: explicit, mode: text}
    - id: wl-t-ee-mill
      kind: expected_effect
      text: We can see whether traffic moved onto Mill Lane.
      status: proposed
      contributions:
      - {by: ruth, attribution: explicit, mode: text}
    links:
    - id: wl-t-rel-order
      from: [wl-t-draft-order]
      to: wl-t-ee-order
      relation: produces
      status: proposed
      contributions:
      - {by: dev, attribution: explicit, mode: text}
    - id: wl-t-rel-letter
      from: [wl-t-letter]
      to: wl-t-ee-families
      relation: produces
      status: proposed
      contributions:
      - {by: grace, attribution: explicit, mode: text}
    - id: wl-t-rel-rota
      from: [wl-t-recruit]
      to: wl-t-ee-rota
      relation: produces
      status: proposed
      contributions:
      - {by: amara, attribution: explicit, mode: text}
    - id: wl-t-rel-count
      from: [wl-t-count]
      to: wl-t-ee-mill
      relation: produces
      status: proposed
      contributions:
      - {by: ruth, attribution: explicit, mode: text}
    - id: wl-t-rel-then
      from: [wl-t-draft-order]
      to: wl-t-letter
      relation: precedes
      status: proposed
      contributions:
      - {by: grace, attribution: explicit, mode: text}
    backlog: []
feedback_requests:
- id: wl-school-street-trial
  revision: 1
  created_by: amara
  recorded_at: '2026-09-01T17:30:00Z'
  about: {ref: wl-f-closure, tree: future_reality, kind: injection, standing: proposed, text: 'Willow Lane closes to through traffic from 8:20 to 9:00 and from 2:50 to 3:30 on school days, with deliveries, residents and blue badge holders exempt.'}
  feedback_from: [grace, ruth, tomasz, amara]
  ready_when: After the first weeks of the trial, which starts on 7 September.
  benefits:
  - {ref: wl-f-fewer-cars, tree: future_reality, kind: predicted_effect, standing: proposed, text: Far fewer cars stop outside the gate at school times.}
  - {ref: wl-f-more-walk, tree: future_reality, kind: desirable_effect, standing: proposed, text: 'More children walk, scoot or cycle to school.'}
  reservations:
  - {ref: wl-f-mill-lane, tree: future_reality, kind: undesirable_effect, standing: proposed, text: Some traffic moves onto Mill Lane while Willow Lane is closed.}
  reports:
  - id: wl-report-grace-1
    by: grace
    recorded_at: '2026-09-25T15:40:00Z'
    readiness: experienced
    text: The gate has been calm for three weeks. Our morning count of cars stopping outside fell from about forty to six. More children are arriving on scooters, but it has been dry and warm, so I can't say yet whether that will last.
    evidence_type: self_report
    outcomes:
    - {ref: wl-f-fewer-cars, verdict: observed, note: Our gate count fell from about forty cars to six by the third week.}
    - {ref: wl-f-more-walk, verdict: unclear, note: 'The hands-up survey shows a rise, but the weather has been unusually good.'}
    - {ref: wl-f-mill-lane, verdict: not_assessed, note: I haven't been on Mill Lane at drop-off.}
  - id: wl-report-ruth-1
    by: ruth
    recorded_at: '2026-10-02T08:55:00Z'
    readiness: experienced
    text: In the first week there was a queue at the Mill Lane junction most mornings. It has eased since, but a few drivers still cut through fast at about twenty past eight.
    evidence_type: self_report
