<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>TDI — Cybernetic Futures · Reason Commons</title>
<style>
/* Layout: a question rail, one reading column, and an inspector that stays beside it. On a phone the inspector becomes a sheet. */
:root {
  --bg: #eef1ee; --surface: #fbfcfa; --sunk: #e3e8e4; --ink: #17231f; --muted: #53625c; --line: #c6cfc9; --line-strong: #8d9a93;
  --accent: #0b5d6b; --accent-ink: #ffffff; --accent-soft: #d9eaec;
  --aim: #1f4e79; --problem: #a23b2a; --change: #2c6e49; --predict: #3d6f78; --risk: #a23b2a; --step: #7d5a0b; --action: #6b3f7c; --need: #4a5568; --now: #3a4742;
  --aim-bg: #e3ecf5; --problem-bg: #f6e6e2; --change-bg: #e1efe6; --step-bg: #f3ead2; --action-bg: #eee3f2;
  --warn-bg: #fbf1d5; --warn-ink: #5b4300;
  --serif: "Literata", "Iowan Old Style", Georgia, serif; --sans: "Instrument Sans", "Helvetica Neue", Arial, sans-serif; --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --hh: 3.5rem;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111917; --surface: #18221f; --sunk: #0c1311; --ink: #e6ece8; --muted: #9fada6; --line: #2e3b37; --line-strong: #5d6e67;
  --accent: #5cc0cf; --accent-ink: #06262b; --accent-soft: #163a40;
  --aim: #8db8e8; --problem: #ec9482; --change: #7fc79a; --predict: #8cc5cf; --risk: #ec9482; --step: #d9b45a; --action: #cba0dc; --need: #aab6c6; --now: #b5c2bc;
  --aim-bg: #16283a; --problem-bg: #3a1d17; --change-bg: #15301f; --step-bg: #33290d; --action-bg: #2c1d33;
  --warn-bg: #33290d; --warn-ink: #f0d58a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111917; --surface: #18221f; --sunk: #0c1311; --ink: #e6ece8; --muted: #9fada6; --line: #2e3b37; --line-strong: #5d6e67;
  --accent: #5cc0cf; --accent-ink: #06262b; --accent-soft: #163a40;
  --aim: #8db8e8; --problem: #ec9482; --change: #7fc79a; --predict: #8cc5cf; --risk: #ec9482; --step: #d9b45a; --action: #cba0dc; --need: #aab6c6; --now: #b5c2bc;
  --aim-bg: #16283a; --problem-bg: #3a1d17; --change-bg: #15301f; --step-bg: #33290d; --action-bg: #2c1d33;
  --warn-bg: #33290d; --warn-ink: #f0d58a; color-scheme: dark }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
img { max-width: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 0.9375rem/1.5 var(--sans); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
a { color: var(--accent); text-underline-offset: 0.15em; }
button, select, textarea, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1:focus { outline: none; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
.mono { font-family: var(--mono); font-size: 0.8125rem; }
.vh-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.skip { position: absolute; left: -999px; } .skip:focus { left: 1rem; top: 1rem; z-index: 50; background: var(--surface); padding: 0.5rem 0.75rem; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 1rem; min-height: var(--hh); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 92rem; margin: 0 auto; }
.brand { font: 600 1.0625rem/1 var(--serif); color: var(--ink); text-decoration: none; white-space: nowrap; }
.brand small { font: 500 0.6875rem var(--sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-left: 0.5rem; }
.search { position: relative; margin-left: auto; flex: 0 1 22rem; min-width: 0; }
.search input { width: 100%; padding: 0.45rem 0.7rem; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--bg); }
#q-res { position: absolute; right: 0; left: 0; top: calc(100% + 4px); margin: 0; padding: 0.25rem; list-style: none; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px; box-shadow: 0 12px 30px rgba(0,0,0,0.18); max-height: 70vh; overflow: auto; }
#q-res a { display: block; padding: 0.5rem 0.6rem; border-radius: 6px; color: var(--ink); text-decoration: none; font-family: var(--serif); }
#q-res a:hover, #q-res a:focus-visible { background: var(--accent-soft); }
#q-res .empty { padding: 0.6rem; }
.standing-line { background: var(--warn-bg); color: var(--warn-ink); border-bottom: 1px solid var(--line); font-size: 0.8125rem; }
.standing-line a { color: inherit; }
.standing-line p { max-width: 92rem; margin: 0 auto; padding-block: 0.4rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.shell { display: grid; grid-template-columns: 15rem minmax(0, 1fr) 24rem; gap: 0; max-width: 92rem; margin: 0 auto; align-items: start; }
#rail { position: sticky; top: calc(var(--hh) + env(safe-area-inset-top, 0px)); max-height: calc(100dvh - var(--hh)); overflow: auto; padding: 1.25rem 0.75rem 2rem max(16px, env(safe-area-inset-left, 0px)); }
#rail ul, #rail ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
#rail a { display: flex; justify-content: space-between; gap: 0.5rem; padding: 0.45rem 0.6rem; border-radius: 6px; color: var(--ink); text-decoration: none; line-height: 1.3; }
#rail a:hover { background: var(--sunk); }
#rail a[aria-current] { background: var(--ink); color: var(--bg); }
#rail .n { font-family: var(--mono); font-size: 0.75rem; opacity: 0.7; font-variant-numeric: tabular-nums; }
.rail-h { font-size: 0.6875rem; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); margin: 1.25rem 0 0.4rem 0.6rem; }
#main { min-width: 0; padding: 2rem clamp(1rem, 3vw, 3rem) 5rem; border-left: 1px solid var(--line); border-right: 1px solid var(--line); min-height: calc(100dvh - var(--hh)); background: var(--surface); }
#main > * { max-width: 44rem; margin-left: auto; margin-right: auto; }
#main > section, #main > aside { margin-top: 2.75rem; }
#insp { position: sticky; top: calc(var(--hh) + env(safe-area-inset-top, 0px)); max-height: calc(100dvh - var(--hh)); overflow: auto; padding: 1.25rem max(16px, env(safe-area-inset-right, 0px)) 3rem 1.25rem; }

.eyebrow { font-size: 0.6875rem; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.eyebrow a { color: inherit; }
h1 { font: 500 clamp(1.75rem, 3.2vw, 2.5rem)/1.12 var(--serif); letter-spacing: -0.01em; margin-top: 0.4rem; }
h1.h-quiet { font-size: 1.25rem; color: var(--muted); }
h2 { font: 600 1.25rem/1.25 var(--serif); }
h3 { font: 600 0.75rem/1.3 var(--sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.lede { margin-top: 0.75rem; font-size: 1.0625rem; color: var(--muted); max-width: 38rem; }
.sub { color: var(--muted); margin-top: 0.3rem; }
.empty { color: var(--muted); font-style: italic; padding: 0.4rem 0; }

/* statement cards: the edge carries standing, the glyph and label carry the kind */
.st { display: grid; gap: 0.3rem; width: 100%; text-align: left; background: var(--surface); border: 1.5px dashed var(--line-strong); border-radius: 8px; padding: 0.7rem 0.85rem; cursor: pointer; transition: background 0.15s, border-color 0.15s; }
.st.is-accepted { border-style: solid; } .st.is-disputed { border-style: double; border-width: 4px; }
.st:hover { background: var(--bg); border-color: var(--ink); }
.st.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); border-style: solid; }
.st-kind { font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; display: flex; flex-wrap: wrap; gap: 0.2rem 0.5rem; align-items: baseline; }
.st-text { font: 400 1rem/1.4 var(--serif); color: var(--ink); }
.st-big .st-text { font-size: 1.3125rem; line-height: 1.32; }
.st-big { padding: 1rem 1.1rem; }
.st-small { padding: 0.5rem 0.65rem; } .st-small .st-text { font-size: 0.9375rem; }
.st-open, .st-tag, .st-standing { font-weight: 500; letter-spacing: 0.02em; text-transform: none; color: var(--warn-ink); background: var(--warn-bg); padding: 0 0.4rem; border-radius: 99px; font-size: 0.6875rem; }
.st-who { font-size: 0.8125rem; color: var(--muted); }
.gl { margin-right: 0.35rem; font-size: 0.8em; }
.st-aim .st-kind, .gl-aim { color: var(--aim); } .st-problem .st-kind, .gl-problem { color: var(--problem); } .st-change .st-kind, .gl-change { color: var(--change); }
.st-predict .st-kind, .gl-predict { color: var(--predict); } .st-risk .st-kind, .gl-risk { color: var(--risk); } .st-step .st-kind, .gl-step { color: var(--step); }
.st-action .st-kind, .gl-action { color: var(--action); } .st-need .st-kind, .gl-need { color: var(--need); } .st-now .st-kind, .gl-now { color: var(--now); }
.st-big.st-aim { background: var(--aim-bg); } .st-big.st-problem { background: var(--problem-bg); } .st-big.st-change { background: var(--change-bg); } .st-big.st-step { background: var(--step-bg); } .st-big.st-action { background: var(--action-bg); }

/* connections */
.rel { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.15rem 0.6rem; width: 100%; text-align: left; background: none; border: 0; border-left: 2px solid var(--line-strong); margin: 0.15rem 0 0.15rem 1.1rem; padding: 0.45rem 0.6rem; cursor: pointer; color: var(--ink); width: calc(100% - 1.1rem); }
.rel:hover { background: var(--bg); } .rel.sel { background: var(--accent-soft); border-left-color: var(--accent); }
.rel-arrow { font-size: 1.1rem; line-height: 1; } .rel-word { font-weight: 600; }
.rel-marks { font-size: 0.75rem; color: var(--warn-ink); background: var(--warn-bg); padding: 0 0.45rem; border-radius: 99px; }
.rel-inspect { font-size: 0.75rem; color: var(--accent); margin-left: auto; text-decoration: underline; }
.rel-loop { border-left-style: dotted; } .rel-prevents { border-left-style: double; border-left-width: 4px; }
.grps { list-style: none; margin: 1rem 0 0; padding: 0; display: grid; gap: 1.1rem; }
.grp-joint > .grp-nodes, .grp-joint > .with { border-left: 3px solid var(--ink); padding-left: 0.75rem; }
.grp-nodes, .with, .minis, .list { display: grid; gap: 0.5rem; }
.joint-note { font-size: 0.8125rem; color: var(--ink); background: var(--sunk); border-radius: 6px; padding: 0.35rem 0.6rem; margin-bottom: 0.5rem; }
.with-h { font-size: 0.6875rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.why { background: none; border: 0; padding: 0.3rem 0; cursor: pointer; color: var(--accent); font-weight: 600; text-align: left; }
.why-n { font-weight: 400; color: var(--muted); }
.nest { margin: 0.25rem 0 0.5rem 0.9rem; padding-left: 0.9rem; border-left: 1px solid var(--line); }
.nest .grps { margin-top: 0.4rem; gap: 0.8rem; }
.loop-note, .root-note { font-size: 0.8125rem; color: var(--muted); padding: 0.2rem 0; }
.focus-card { margin-top: 1.5rem !important; }
.focus-card .st { border-width: 2px; }
.claim-type { font-size: 0.8125rem; color: var(--muted); margin-top: 0.5rem; }
.dir h2 { font-size: 1.0625rem; }
.trail { display: flex; flex-wrap: wrap; gap: 0.3rem 0.6rem; font-size: 0.8125rem; color: var(--muted); margin-top: 0.6rem; }
.trail ol { list-style: none; display: flex; flex-wrap: wrap; gap: 0.2rem 0.6rem; margin: 0; padding: 0; }
.trail li + li::before { content: "›"; margin-right: 0.6rem; }
.xgroup { margin-top: 1rem; }
.sub-h { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.4rem; }
summary.sub-h { cursor: pointer; margin-bottom: 0; padding: 0.3rem 0; }
.sub-note { font-size: 0.8125rem; color: var(--muted); margin: 0.3rem 0; }

/* the path */
.stops { list-style: none; margin: 2rem auto 0; padding: 0; }
.stop-q { font: 600 0.9375rem var(--sans); margin-bottom: 0.6rem; display: flex; align-items: center; gap: 0.6rem; }
.num { display: inline-grid; place-items: center; width: 1.6rem; height: 1.6rem; border-radius: 50%; background: var(--ink); color: var(--bg); font: 500 0.8125rem var(--mono); }
.stop-more { margin-top: 0.6rem; color: var(--muted); font-size: 0.875rem; }
.sub-block { margin-top: 0.9rem; padding-left: 0.9rem; border-left: 1px solid var(--line); }
.stop { padding: 0.4rem 0; }
.join { display: grid; grid-template-columns: 1.6rem minmax(0, 1fr); gap: 0.6rem; padding: 0.9rem 0; color: var(--muted); font-size: 0.875rem; }
.join-line { justify-self: center; width: 2px; min-height: 3.2rem; background: var(--line-strong); }
.join-gap .join-line { background: none; border-left: 2px dotted var(--line-strong); width: 0; }
.join p { align-self: center; } .join strong { color: var(--ink); }
.join-kind { display: block; font-size: 0.75rem; }
.swap { margin-top: 0.5rem; } .swap summary { cursor: pointer; color: var(--muted); font-size: 0.875rem; padding: 0.25rem 0; }
.swap-cta { color: var(--accent); font-weight: 600; text-decoration: underline; margin-left: 0.3rem; }
.swap-none, .swap-note { color: var(--muted); font-size: 0.875rem; margin-top: 0.5rem; }
.opts { list-style: none; margin: 0.5rem 0 0; padding: 0; display: grid; gap: 0.35rem; }
.opt { display: flex; flex-wrap: wrap; gap: 0.25rem 0.5rem; width: 100%; text-align: left; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 0.5rem 0.7rem; cursor: pointer; }
.opt:hover { border-color: var(--ink); } .opt.on { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.opt-t { flex: 1 1 100%; font-family: var(--serif); }
.cmp { font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.cmp + .cmp::before { content: "· "; }
.route, .risks { list-style: none; margin: 0.4rem 0 0; padding: 0; display: grid; gap: 0.6rem; }
.remedy { margin: 0.4rem 0 0 1.1rem; }
.who { margin-top: 0.9rem; background: var(--warn-bg); color: var(--warn-ink); border-radius: 8px; padding: 0.75rem 0.9rem; }
.who-h { font-size: 0.6875rem; letter-spacing: 0.08em; text-transform: uppercase; } .who-v { font: 600 1.25rem var(--serif); } .who-n { font-size: 0.875rem; margin-top: 0.2rem; }
.next { background: var(--bg); border-radius: 10px; padding: 1.1rem 1.25rem; } .next ul { margin: 0.5rem 0 0; padding-left: 1.1rem; display: grid; gap: 0.3rem; }
.oq-mini { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.6rem; }
.oq-mini li { display: grid; gap: 0.15rem; }
.oq-w { font-size: 0.6875rem; letter-spacing: 0.07em; text-transform: uppercase; color: var(--warn-ink); font-weight: 600; }
.oq-n { color: var(--muted); font-size: 0.875rem; }

/* start */
.goal-block { margin-top: 1.75rem !important; }
.goal-block .st { margin-top: 0.5rem; }
.facts { margin: 0.9rem 0 0; display: grid; gap: 0.75rem; }
.facts div { display: grid; grid-template-columns: 11rem minmax(0, 1fr); gap: 0.2rem 1rem; padding-top: 0.75rem; border-top: 1px solid var(--line); }
.facts dt { font-weight: 600; } .facts dd { margin: 0; color: var(--muted); }
.facts-tight div { grid-template-columns: 6.5rem minmax(0, 1fr); padding-top: 0.45rem; } .facts-tight { gap: 0.45rem; }
.teaser { list-style: none; margin: 1rem 0; padding: 0; display: grid; }
.tz { display: grid; grid-template-columns: 7.5rem minmax(0, 1fr); gap: 0.2rem 1rem; padding: 0.6rem 0; border-top: 1px solid var(--line); }
.tz-k { font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; padding-top: 0.2rem; }
.tz-aim .tz-k { color: var(--aim); } .tz-problem .tz-k { color: var(--problem); } .tz-change .tz-k { color: var(--change); } .tz-step .tz-k { color: var(--step); } .tz-action .tz-k { color: var(--action); }
.tz-t { font-family: var(--serif); }
.btn { display: inline-block; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 6px; padding: 0.4rem 0.8rem; cursor: pointer; text-decoration: none; color: var(--ink); font-weight: 500; }
.btn:hover { border-color: var(--ink); } .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); } .btn-quiet { border-color: transparent; color: var(--muted); }
.ways { display: grid; grid-template-columns: repeat(auto-fit, minmax(12.5rem, 1fr)); gap: 0.75rem; margin-top: 0.9rem; }
.way { display: grid; gap: 0.3rem; align-content: start; padding: 0.9rem 1rem; border: 1px solid var(--line-strong); border-radius: 8px; text-decoration: none; color: var(--ink); }
.way:hover { border-color: var(--accent); background: var(--bg); }
.way-k { font-size: 0.6875rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); } .way-t { font: 600 1.0625rem/1.25 var(--serif); } .way-d { font-size: 0.875rem; color: var(--muted); }
.six { margin: 0.9rem 0 0; padding: 0; list-style: none; counter-reset: six; }
.six li { counter-increment: six; border-top: 1px solid var(--line); }
.six a { display: grid; grid-template-columns: 1.6rem minmax(0, 1fr) auto; gap: 0.2rem 0.75rem; padding: 0.65rem 0; text-decoration: none; color: var(--ink); align-items: baseline; }
.six a::before { content: counter(six); font: 500 0.8125rem var(--mono); color: var(--muted); }
.six a:hover .six-q { text-decoration: underline; } .six-q { font: 500 1.0625rem var(--serif); } .six-n { font-size: 0.8125rem; color: var(--muted); }
.sources, .hist { list-style: none; margin: 0.9rem 0 0; padding: 0; display: grid; gap: 0.9rem; }
.sources li, .hist li { display: grid; gap: 0.15rem; } .src-d, .hist span:last-child { color: var(--muted); font-size: 0.875rem; }

/* question pages */
.part { padding-top: 0.25rem; } .part h2 { margin-top: 0.25rem; } .part .list, .part .cloud { margin-top: 0.9rem; }
.outline { list-style: none; margin: 0.5rem 0 0; padding: 0 0 0 1rem; border-left: 1px solid var(--line); display: grid; gap: 0.5rem; }
.outline-roots, .outline-members, .outline-references, .sequence, .sequence-stage > ul {
  list-style: none; margin: 0; padding: 0; display: grid; gap: 0.6rem;
}
.outline-roots { gap: 1.25rem; }
.outline-group > .outline-members { padding-top: 0.35rem; }
.outline-group > .joint-note { margin-top: 0.35rem; }
.outline-sides { grid-template-columns: repeat(auto-fit, minmax(min(100%, 15rem), 1fr)); }
.outline-references { margin-top: 0.75rem; }
.outline-references li { display: grid; gap: 0.25rem; }
.sequence { gap: 1.5rem; }
.sequence-stage > ul { gap: 0.85rem; margin-top: 0.6rem; }
.sequence-step { display: grid; gap: 0.4rem; border-left: 2px solid var(--line-strong); padding-left: 0.65rem; }
.sequence-step > .joint-note { margin: 0; }
@media (max-width: 600px) {
  .outline-roots .outline { padding-left: 0.55rem; }
  .outline-roots .outline .outline .outline .outline { padding-left: 0.2rem; }
}
.cloud-sides { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: 1rem; margin-top: 0.9rem; }
.cloud-side { display: grid; gap: 0.2rem; align-content: start; }
.cloud-clash { margin-top: 0.8rem; background: var(--warn-bg); color: var(--warn-ink); padding: 0.5rem 0.75rem; border-radius: 6px; font-size: 0.875rem; }
.linklike { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; cursor: pointer; text-align: left; }

/* open questions and notes */
.filters { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 1rem !important; }
.chip { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 99px; padding: 0.25rem 0.75rem; cursor: pointer; font-size: 0.8125rem; }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.oq { list-style: none; margin: 1.5rem auto 0; padding: 0; display: grid; }
.oq > li { display: grid; gap: 0.3rem; padding: 1rem 0; border-top: 1px solid var(--line); }
.oq-l, .note-t { font: 500 1.0625rem/1.35 var(--serif); } .oq-on { font-size: 0.875rem; color: var(--muted); } .oq-a { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.3rem; }

g to respond to the polycrisis.", "status": "proposed", "accepted_by": [], "contributors": ["Margeret Heath", "Krishan Mathis"], "label": "Relevant expertise and responses are fragmented."}, {"id": "tdi-missed-interactions", "kind": "cause", "text": "An inquiry confined to one domain may omit feedback and spillovers that materially change the assessment of a response.", "status": "proposed", "accepted_by": [], "contributors": ["AI assistant"], "label": "A narrow inquiry may miss effects across domains."}, {"id": "tdi-response-gap", "kind": "undesirable_effect", "text": "The draft argues that existing responses are fragmented relative to the interconnected problems they address.", "status": "proposed", "accepted_by": [], "contributors": ["Margeret Heath"], "label": "Responses fail to address parts of interconnected problems."}, {"id": "tdi-conference-gap", "kind": "undesirable_effect", "text": "The invitation raises the experience of leaving a conference wishing the discussion could turn into something. The draft supplies no named instance or frequency.", "status": "proposed", "accepted_by": [], "contributors": ["Margeret Heath"], "label": "Some conference conversations do not lead to follow-through."}, {"id": "tdi-method-demand", "kind": "observation", "text": "The draft says communities and mission-driven groups want methods that help them shape their futures together. It gives no named case of unmet demand.", "status": "proposed", "accepted_by": [], "contributors": ["Margeret Heath"], "label": "The draft reports demand for collective methods."}, {"id": "tdi-practice-gap", "kind": "undesirable_effect", "text": "The impulse argues that systems societies leave futuring work undone and futurists leave collective-intelligence work undone. It supplies no comparison of specific organisations.", "status": "proposed", "accepted_by": [], "contributors": ["Krishan Mathis"], "label": "Systems inquiry and futures work seldom happen together."}], "links": [{"id": "tdi-missed-pa nce could revise or disconfirm them before extending the protocol to other systems theories.", "status": "proposed", "accepted_by": [], "contributors": ["Margeret Heath", "Krishan Mathis"], "label": "Use the Viable System Model as a worked case."}, {"id": "tdi-ecologies", "kind": "injection", "text": "Study interactions among people, AI agents, algorithms, robots, digital institutions and hybrid collectives to develop ways to protect human agency and support democratic viability.", "status": "proposed", "accepted_by": [], "contributors": ["Margeret Heath", "Krishan Mathis"], "label": "Study how human and synthetic actors co-evolve."}, {"id": "tdi-observatories", "kind": "injection", "text": "Develop distributed cybernetic observatories that detect weak signals and changing patterns across domains.", "status": "proposed", "accepted_by": [], "contributors": ["Margeret Heath"], "label": "Sense emerging change across domains."}, {"id": "tdi-mapping", "kind": "predicted_effect", "text": "A murmuration can reveal relevant needs, assumptions and perspectives that the inquiry would otherwise omit.", "status": "proposed", "accepted_by": [], "contributors": ["AI assistant"], "label": "A gathering surfaces perspectives that affect the inquiry.", "addresses": ["tdi-missed-interactions"]}, {"id": "tdi-shared-output", "kind": "predicted_effect", "text": "A swarm can use the map to agree priorities and make an output suited to a real local decision or test.", "status": "proposed", "accepted_by": [], "contributors": ["AI assistant"], "label": "A swarm produces an output a group can try.", "addresses": ["tdi-conference-gap"]}, {"id": "tdi-use-input", "kind": "existing_condition", "text": "People who would use or be affected by the output have ways to explain their context, challenge assumptions and shape the output.", "status": "proposed", "accepted_by": [], "contributors": ["AI assistant"], "label": "Intended users contribute their needs and constraints."}, {"id": "tdi-revision", " s choose.", "status": "proposed", "accepted_by": [], "contributors": ["Krishan Mathis"], "label": "Run four online sessions a year with a floor of three.", "derived_from": ["tdi-cycle"]}, {"id": "tdi-protocol-revision", "kind": "predicted_effect", "text": "The proposed April–June cycle revises the method based on breakdowns in the first cycle.", "status": "proposed", "accepted_by": [], "contributors": ["Krishan Mathis"], "label": "The second cycle can test a protocol revised after the first."}, {"id": "tdi-regional-loop", "kind": "injection", "text": "The longer-term vision uses the metaphor of an antenna array. Regional groups tune in together, return to local work, and reconvene six months later.", "status": "proposed", "accepted_by": [], "contributors": ["Krishan Mathis"], "label": "Regional groups share signals, act locally and reconvene.", "derived_from": ["tdi-network-bridges", "tdi-cycle"]}], "links": [{"id": "tdi-ai-risk-path", "from": ["tdi-imaginarium"], "to": "tdi-ai-risk", "relation": "contributes_to", "status": "proposed", "accepted_by": [], "contributors": ["AI assistant"], "assumptions": [{"text": "This risk depends on how prominently the AI frames the inquiry and how easily participants can add, challenge or reject its suggestions.", "by": "AI assistant"}]}, {"id": "tdi-cycle-map", "from": ["tdi-cycle", "tdi-use-input"], "to": "tdi-mapping", "relation": "contributes_to", "status": "proposed", "accepted_by": [], "contributors": ["AI assistant"], "assumptions": [{"text": "The people who matter have access and channels that make differences in perspective visible.", "by": "AI assistant"}]}, {"id": "tdi-map-output", "from": ["tdi-mapping", "tdi-cycle"], "to": "tdi-shared-output", "relation": "contributes_to", "status": "proposed", "accepted_by": [], "contributors": ["AI assistant"], "assumptions": [{"text": "The swarm can translate mapped needs into a clear priority and has scope to make something usable.", "by": "AI assistant"}]}, {"id": "tdi-output-use l decision or inquiry that it could inform.", "by": "AI assistant"}]}, {"id": "tdi-bicci-benefit-path", "from": ["tdi-imaginarium", "tdi-bicci-control"], "to": "tdi-bicci-benefit", "relation": "contributes_to", "status": "proposed", "accepted_by": [], "contributors": ["AI assistant"], "assumptions": [{"text": "The group can turn AI suggestions into inspectable alternatives and retains discretion over which to pursue.", "by": "AI assistant"}]}, {"id": "tdi-authority-path", "from": ["tdi-authority-trial"], "to": "tdi-authority-effect", "relation": "contributes_to", "status": "proposed", "accepted_by": [], "contributors": ["AI assistant"], "assumptions": [{"text": "Authority is clear enough to coordinate work and decisions about shared priorities are visible and challengeable.", "by": "AI assistant"}]}, {"id": "tdi-spread-path", "from": ["tdi-network-bridges", "tdi-revision"], "to": "tdi-spread", "relation": "contributes_to", "status": "proposed", "accepted_by": [], "contributors": ["AI assistant"], "assumptions": [{"text": "The practice shows enough utility to warrant adoption, and the bridges reach groups that can adapt it.", "by": "AI assistant"}]}, {"id": "tdi-protocol-revision-path", "from": ["tdi-cadence", "tdi-revision"], "to": "tdi-protocol-revision", "relation": "contributes_to", "status": "proposed", "accepted_by": [], "contributors": ["AI assistant"], "assumptions": [{"text": "Participants document what broke and can carry those lessons into the next cycle.", "by": "AI assistant"}]}], "backlog": [{"ref": "tdi-output-use", "work": "specify_first_trial", "note": "Choose a first topic, a real local setting, a feedback provider and an observation opportunity. Check whether a publishable output in about two months can also be used in practice."}, {"ref": "tdi-ai-risk-path", "work": "test_negative_branch", "note": "If the first experiment uses BICCI, ask the same participants about useful alternatives it surfaced and any alternatives they stopped considering. Agree who can judge both outcomes."}, {"ref": "tdi-agency-lab", "work": "compare_founding_projects", "note": "Compare the three founding projects and the seed inquiries on access to a real case, capacity to produce something usable, and ability to learn within the first cycle."}, {"ref": "tdi-observatories", "work": "specify_use_of_signals", "note": "Identify who would act on a signal, what decision it would inform, and how the network would distinguish a useful signal from noise."}, {"ref": "tdi-spread-path", "work": "test_diffusion", "note": "Trace actual adoption through a bridge before treating diffusion or a positive tipping point as an outcome."}, {"ref": "tdi-authority-path", "work": "test_governance", "note": "Compare evidence of delivery, participant influence and local discretion under an explicit allocation of rights."}, {"ref": "tdi-scenarios-stress", "work": "evaluate_scenario_guidance", "note": "Find a decision-maker who can assess whether the scenarios reveal a relevant option or trade-off."}, {"ref": "tdi-imaginarium", "work": "specify_ai_use", "note": "Translate the call for intensive AI use in slide 6 into a specific facilitation practice. Check it against the slide 12 aim of helping groups think and the risk of narrowing participant choices."}, {"ref": "tdi-regional-loop", "work": "test_regional_cycle", "note": "Define what regions exchange, who acts locally, and what six-month follow-up would show. A university-hosted symposium is conditional on critical mass."}]}, "prerequisite": {"nodes": [{"id": "tdi-first-output", "kind": "objective", "text": "Choose and investigate a first topic collaboratively and publish an output within about two months.", "status": "proposed", "accepted_by": [], "contributors": ["Margeret Heath"], "label": "Publish a first collaborative output in about two months.", "derived_from": ["tdi-action"]}, {"id": "tdi-topic-open", "kind": "obstacle", "text": "The discussion draft leaves the first topic for founding participants to decide.", "status": "proposed", "accepted_by": [], "contributors": ["Margeret Heath"], "label": "The first topic is still open in the draft."}, {"id": "tdi-topic-choice", "kind": "intermediate_objective", "text": "Founding participants choose a question a defined group can use and that TDI can investigate within the first cycle.", "status": "proposed", "accepted_by": [], "contributors": ["AI assistant"], "label": "Choose a first topic with a tractable question.", "implements": ["tdi-cycle"]}, {"id": "tdi-cap-map-gap", "kind": "obstacle", "text": "The draft calls for contributor presentations and capability mapping. The skills and time available for a particular first topic remain to be established.", "status": "proposed", "accepted_by": [], "contributors": ["AI assistant"], "label": "The capabilities available for a first topic are unclear."}, {"id": "tdi-cap-map", "kind": "intermediate_objective", "text": "Hear contributor presentations and map capabilities relevant to possible first inquiries.", "status": "proposed", "accepted_by": [], "contributors": ["Margeret Heath", "Krishan Mathis"], "label": "Map who can contribute and what they can take on."}, {"id": "tdi-responsibility", "kind": "intermediate_objective", "text": "Identify who is responsible for convening, preparing the output, challenging its claims and approving it for publication.", "status": "proposed", "accepted_by": [], "contributors": ["AI assistant"], "label": "Assign responsibility for delivery and review."}, {"id": "tdi-access", "kind": "intermediate_objective", "text": "Identify a publication route that makes the first output accessible and preserves authorship where appropriate.", "status": "proposed", "accepted_by": [], "contributors": ["AI assistant"], "label": "Find a place to publish the output with attribution.", "derived_from": ["tdi-attribution"]}, {"id": "tdi-method", "kind": "intermediate_objective", "text": "Select methods suited to the question and identify what evidence and perspectives the inquiry needs.", "status": "proposed", "accepted_by": [], "contributors": ["Margeret Heath"], "label": "Agree how to investigate the chosen question."}, {"id": "tdi-protocol", "kind": "intermediate_objective", "text": "The impulse proposes writing protocol v0.1 in December around the chosen question, before the January–February cycle.", "status": "proposed", "accepted_by": [], "contributors": ["Krishan Mathis"], "label": "Write protocol v0.1 against the selected topic.", "implements": ["tdi-cycle"]}, {"id": "tdi-offers", "kind": "intermediate_objective", "text": "Identify the question each person wants answered and what they would actually do. Relevant offers include methods, a host, funding routes, technical help, and teaching materials.", "status": "proposed", "accepted_by": [], "contributors": ["Krishan Mathis"], "label": "Identify a first-cycle team and concrete offers.", "implements": ["tdi-cycle"]}], "links": [{"id": "tdi-topic-overcome", "from": ["tdi-topic-choice"], "to": "tdi-topic-open", "relation": "overcomes", "status": "proposed", "accepted_by": [], "contributors": ["AI assistant"], "assumptions": [{"text": "Selecting a topic resolves the open first-topic decision.", "by": "AI assistant"}]}, {"id": "tdi-cap-overcome", "from": ["tdi-cap-map"], "to": "tdi-cap-map-gap", "relation": "overcomes", "status": "proposed", "accepted_by": [], "contributors": ["AI assistant"], "assumptions": [{"text": "Describe actual capability and availability, including limits.", "by": "AI assistant"}]}, {"id": "tdi-topic-prereq", "from": ["tdi-topic-choice"], "to": "tdi-first-output", "relation": "necessary_for", "status": "proposed", "accepted_by": [], "contributors": ["AI assistant"], "assumptions": [{"text": "A topic determines what the group investigates and publishes.", "by": "AI assistant"}]}, {"id": "tdi-method-prereq", "from": ["tdi-method"], "to": "tdi-first-output", "relation": "necessary_for", "status": "proposed", "accepted_by": [], "contributors": ["AI assistant"], "assumptions": [{"text": "An investigated output needs a method for gathering and assessing its material.", "by": "AI assistant"}]}, {"id": "tdi-owner-prereq", "from": ["tdi-responsibility"], "to": "tdi-first-output", "relation": "necessary_for", "status": "proposed", "accepted_by": [], "contributors": ["AI assistant"], "assumptions": [{"text": "Some participants must own delivery and review, even when decision rights are distributed.", "by": "AI assistant"}]}, {"id": "tdi-access-prereq", "from": ["tdi-access"], "to": "tdi-first-output", "relation": "necessary_for", "status": "proposed", "accepted_by": [], "contributors": ["AI assistant"], "assumptions": [{"text": "Publication requires an accessible route and permission to share the material.", "by": "AI assistant"}]}, {"id": "tdi-topic-protocol", "from": ["tdi-topic-choice"], "to": "tdi-protocol", "relation": "necessary_for", "status": "proposed", "accepted_by": [], "contributors": ["AI assistant"], "assumptions": [{"text": "A protocol written against a question depends on having specified that question.", "by": "AI assistant"}]}, {"id": "tdi-offers-delivery", "from": ["tdi-offers"], "to": "tdi-responsibility", "relation": "necessary_for", "status": "proposed", "accepted_by": [], "contributors": ["AI assistant"], "assumptions": [{"text": "First-cycle delivery depends on knowing which contributors are available and what they can take on.", "by": "AI assistant"}]}], "backlog": [{"ref": "tdi-topic-choice", "work": "prioritize_candidates", "note": "Compare the founding projects and seed inquiries against available contributors, a real user or decision, and a two-month scope. The draft’s seeds include space-sector questions, climate learning, local parallel economies, AI-supported collective-intelligence research and testing a viable system in practice."}, {"ref": "tdi-cap-map", "work": "test_dependency", "note": "Check whether capability mapping is needed before the first topic can be chosen or whether a committed group can start while the wider map develops."}, {"ref": "tdi-offers", "work": "scope_dependencies", "note": "Check which offers are needed for this inquiry. The impulse leaves legal form, name, membership, money and formal role appointments outside the open session’s decision scope."}, {"ref": "tdi-first-output", "work": "reconcile_output_dates", "note": "The Nov 13 draft calls for a published output in about two months. The Nov 14 impulse calls for a December topic producing something in February and lists March publication as proposed. Clarify what must exist in February and what review or release work March allows."}]}, "transition": {"nodes": [{"id": "tdi-start", "kind": "existing_condition", "text": "Founding participants have a discussion draft, three founding projects and seed inquiries. The first collaborative topic remains open in the draft.", "status": "proposed", "accepted_by": [], "contributors": ["Margeret Heath"], "label": "Founders have a draft and several candidate inquiries."}, {"id": "tdi-start-need", "kind": "need", "text": "The group needs a focused inquiry it can assign, investigate and put to use within the intended time.", "status": "proposed", "accepted_by": [], "contributors": ["AI assistant"], "label": "The first cycle needs a scope people can deliver."}, {"id": "tdi-frame", "kind": "action", "text": "Use contributor presentations and an exploratory gathering to map people, needs and questions. Compare topics against the first-cycle scope. Invite each participant to bring a question and one concrete offer.", "status": "proposed", "accepted_by": [], "contributors": ["AI assistant"], "label": "Map capabilities and compare candidate inquiries.", "implements": ["tdi-cap-map", "tdi-topic-choice"]}, {"id": "tdi-framed", "kind": "expected_effect", "text": "The group can point to a first inquiry, intended audience, scope, available contributors and a decision about what to produce.", "status": "proposed", "accepted_by": [], "contributors": ["A ssistant"], "label": "The group can review attributed experience of local use."}, {"id": "tdi-protocol-action", "kind": "action", "text": "Write protocol v0.1 against the chosen topic, drawing on concrete offers from participants. Specify how the group will gather, analyse and produce its first output.", "status": "proposed", "accepted_by": [], "contributors": ["Krishan Mathis"], "label": "Write a first protocol with the chosen topic and team.", "implements": ["tdi-protocol", "tdi-offers"]}, {"id": "tdi-protocol-ready", "kind": "expected_effect", "text": "The group can begin the January–February cycle with a usable protocol tied to its December topic.", "status": "proposed", "accepted_by": [], "contributors": ["AI assistant"], "label": "The team has a protocol for the first full cycle."}, {"id": "tdi-produced", "kind": "expected_effect", "text": "The slide calls for the December topic to produce something in February. It lists public release separately in March.", "status": "proposed", "accepted_by": [], "contributors": ["Krishan Mathis"], "label": "The first cycle produces something by February."}, {"id": "tdi-release", "kind": "action", "text": "Work through review, attribution and release permissions for the first output, with March as the proposed publication month.", "status": "proposed", "accepted_by": [], "contributors": ["AI assistant"], "label": "Review the first output and prepare it for publication.", "implements": ["tdi-access"]}], "links": [{"id": "tdi-frame-result", "from": ["tdi-start", "tdi-start-need", "tdi-frame"], "to": "tdi-framed", "relation": "produces", "status": "proposed", "accepted_by": [], "contributors": ["AI assistant"], "assumptions": [{"text": "Participants can make a topic decision and at least one inquiry fits the available capacity.", "by": "AI assistant"}]}, {"id": "tdi-make-result", "from": ["tdi-protocol-ready", "tdi-make-need", "tdi-make"], "to": "tdi-produced", "relation": "produces", "status": "proposed", "accepted_by": [], "c
