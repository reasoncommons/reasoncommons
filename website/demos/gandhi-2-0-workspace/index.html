<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gandhi 2.0 workspace · Reason Commons</title>
<meta name="description" content="A prototype reader for the Gandhi 2.0 commons: follow one path from the goal to a first action, trace any statement, and check its wording, sources and standing.">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&display=swap">
<style>
/* Layout: a question rail, one reading column, and an inspector that stays beside it. On a phone the inspector becomes a sheet. */
:root {
  --bg: #eef1ee; --surface: #fbfcfa; --sunk: #e3e8e4; --ink: #17231f; --muted: #53625c; --line: #c6cfc9; --line-strong: #8d9a93;
  --accent: #0b5d6b; --accent-ink: #ffffff; --accent-soft: #d9eaec;
  --aim: #1f4e79; --problem: #a23b2a; --change: #2c6e49; --predict: #3d6f78; --risk: #a23b2a; --step: #7d5a0b; --action: #6b3f7c; --need: #4a5568; --now: #3a4742;
  --aim-bg: #e3ecf5; --problem-bg: #f6e6e2; --change-bg: #e1efe6; --step-bg: #f3ead2; --action-bg: #eee3f2;
  --warn-bg: #fbf1d5; --warn-ink: #5b4300;
  --serif: "Literata", "Iowan Old Style", Georgia, serif; --sans: "Instrument Sans", "Helvetica Neue", Arial, sans-serif; --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --hh: 3.5rem;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111917; --surface: #18221f; --sunk: #0c1311; --ink: #e6ece8; --muted: #9fada6; --line: #2e3b37; --line-strong: #5d6e67;
  --accent: #5cc0cf; --accent-ink: #06262b; --accent-soft: #163a40;
  --aim: #8db8e8; --problem: #ec9482; --change: #7fc79a; --predict: #8cc5cf; --risk: #ec9482; --step: #d9b45a; --action: #cba0dc; --need: #aab6c6; --now: #b5c2bc;
  --aim-bg: #16283a; --problem-bg: #3a1d17; --change-bg: #15301f; --step-bg: #33290d; --action-bg: #2c1d33;
  --warn-bg: #33290d; --warn-ink: #f0d58a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111917; --surface: #18221f; --sunk: #0c1311; --ink: #e6ece8; --muted: #9fada6; --line: #2e3b37; --line-strong: #5d6e67;
  --accent: #5cc0cf; --accent-ink: #06262b; --accent-soft: #163a40;
  --aim: #8db8e8; --problem: #ec9482; --change: #7fc79a; --predict: #8cc5cf; --risk: #ec9482; --step: #d9b45a; --action: #cba0dc; --need: #aab6c6; --now: #b5c2bc;
  --aim-bg: #16283a; --problem-bg: #3a1d17; --change-bg: #15301f; --step-bg: #33290d; --action-bg: #2c1d33;
  --warn-bg: #33290d; --warn-ink: #f0d58a; color-scheme: dark }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
img { max-width: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 0.9375rem/1.5 var(--sans); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
a { color: var(--accent); text-underline-offset: 0.15em; }
button, select, textarea, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1:focus { outline: none; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
.mono { font-family: var(--mono); font-size: 0.8125rem; }
.vh-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.skip { position: absolute; left: -999px; } .skip:focus { left: 1rem; top: 1rem; z-index: 50; background: var(--surface); padding: 0.5rem 0.75rem; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 1rem; min-height: var(--hh); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 92rem; margin: 0 auto; }
.brand { font: 600 1.0625rem/1 var(--serif); color: var(--ink); text-decoration: none; white-space: nowrap; }
.brand small { font: 500 0.6875rem var(--sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-left: 0.5rem; }
.search { position: relative; margin-left: auto; flex: 0 1 22rem; min-width: 0; }
.search input { width: 100%; padding: 0.45rem 0.7rem; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--bg); }
#q-res { position: absolute; right: 0; left: 0; top: calc(100% + 4px); margin: 0; padding: 0.25rem; list-style: none; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px; box-shadow: 0 12px 30px rgba(0,0,0,0.18); max-height: 70vh; overflow: auto; }
#q-res a { display: block; padding: 0.5rem 0.6rem; border-radius: 6px; color: var(--ink); text-decoration: none; font-family: var(--serif); }
#q-res a:hover, #q-res a:focus-visible { background: var(--accent-soft); }
#q-res .empty { padding: 0.6rem; }
.standing-line { background: var(--warn-bg); color: var(--warn-ink); border-bottom: 1px solid var(--line); font-size: 0.8125rem; }
.standing-line a { color: inherit; }
.standing-line p { max-width: 92rem; margin: 0 auto; padding-block: 0.4rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.shell { display: grid; grid-template-columns: 15rem minmax(0, 1fr) 24rem; gap: 0; max-width: 92rem; margin: 0 auto; align-items: start; }
#rail { position: sticky; top: calc(var(--hh) + env(safe-area-inset-top, 0px)); max-height: calc(100dvh - var(--hh)); overflow: auto; padding: 1.25rem 0.75rem 2rem max(16px, env(safe-area-inset-left, 0px)); }
#rail ul, #rail ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
#rail a { display: flex; justify-content: space-between; gap: 0.5rem; padding: 0.45rem 0.6rem; border-radius: 6px; color: var(--ink); text-decoration: none; line-height: 1.3; }
#rail a:hover { background: var(--sunk); }
#rail a[aria-current] { background: var(--ink); color: var(--bg); }
#rail .n { font-family: var(--mono); font-size: 0.75rem; opacity: 0.7; font-variant-numeric: tabular-nums; }
.rail-h { font-size: 0.6875rem; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); margin: 1.25rem 0 0.4rem 0.6rem; }
#main { min-width: 0; padding: 2rem clamp(1rem, 3vw, 3rem) 5rem; border-left: 1px solid var(--line); border-right: 1px solid var(--line); min-height: calc(100dvh - var(--hh)); background: var(--surface); }
#main > * { max-width: 44rem; margin-left: auto; margin-right: auto; }
#main > section, #main > aside { margin-top: 2.75rem; }
#insp { position: sticky; top: calc(var(--hh) + env(safe-area-inset-top, 0px)); max-height: calc(100dvh - var(--hh)); overflow: auto; padding: 1.25rem max(16px, env(safe-area-inset-right, 0px)) 3rem 1.25rem; }

.eyebrow { font-size: 0.6875rem; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.eyebrow a { color: inherit; }
h1 { font: 500 clamp(1.75rem, 3.2vw, 2.5rem)/1.12 var(--serif); letter-spacing: -0.01em; margin-top: 0.4rem; }
h1.h-quiet { font-size: 1.25rem; color: var(--muted); }
h2 { font: 600 1.25rem/1.25 var(--serif); }
h3 { font: 600 0.75rem/1.3 var(--sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.lede { margin-top: 0.75rem; font-size: 1.0625rem; color: var(--muted); max-width: 38rem; }
.sub { color: var(--muted); margin-top: 0.3rem; }
.empty { color: var(--muted); font-style: italic; padding: 0.4rem 0; }

/* statement cards: the edge carries standing, the glyph and label carry the kind */
.st { display: grid; gap: 0.3rem; width: 100%; text-align: left; background: var(--surface); border: 1.5px dashed var(--line-strong); border-radius: 8px; padding: 0.7rem 0.85rem; cursor: pointer; transition: background 0.15s, border-color 0.15s; }
.st.is-accepted { border-style: solid; } .st.is-disputed { border-style: double; border-width: 4px; }
.st:hover { background: var(--bg); border-color: var(--ink); }
.st.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); border-style: solid; }
.st-kind { font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; display: flex; flex-wrap: wrap; gap: 0.2rem 0.5rem; align-items: baseline; }
.st-text { font: 400 1rem/1.4 var(--serif); color: var(--ink); }
.st-big .st-text { font-size: 1.3125rem; line-height: 1.32; }
.st-big { padding: 1rem 1.1rem; }
.st-small { padding: 0.5rem 0.65rem; } .st-small .st-text { font-size: 0.9375rem; }
.st-open, .st-tag, .st-standing { font-weight: 500; letter-spacing: 0.02em; text-transform: none; color: var(--warn-ink); background: var(--warn-bg); padding: 0 0.4rem; border-radius: 99px; font-size: 0.6875rem; }
.st-who { font-size: 0.8125rem; color: var(--muted); }
.gl { margin-right: 0.35rem; font-size: 0.8em; }
.st-aim .st-kind, .gl-aim { color: var(--aim); } .st-problem .st-kind, .gl-problem { color: var(--problem); } .st-change .st-kind, .gl-change { color: var(--change); }
.st-predict .st-kind, .gl-predict { color: var(--predict); } .st-risk .st-kind, .gl-risk { color: var(--risk); } .st-step .st-kind, .gl-step { color: var(--step); }
.st-action .st-kind, .gl-action { color: var(--action); } .st-need .st-kind, .gl-need { color: var(--need); } .st-now .st-kind, .gl-now { color: var(--now); }
.st-big.st-aim { background: var(--aim-bg); } .st-big.st-problem { background: var(--problem-bg); } .st-big.st-change { background: var(--change-bg); } .st-big.st-step { background: var(--step-bg); } .st-big.st-action { background: var(--action-bg); }

/* connections */
.rel { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.15rem 0.6rem; width: 100%; text-align: left; background: none; border: 0; border-left: 2px solid var(--line-strong); margin: 0.15rem 0 0.15rem 1.1rem; padding: 0.45rem 0.6rem; cursor: pointer; color: var(--ink); width: calc(100% - 1.1rem); }
.rel:hover { background: var(--bg); } .rel.sel { background: var(--accent-soft); border-left-color: var(--accent); }
.rel-arrow { font-size: 1.1rem; line-height: 1; } .rel-word { font-weight: 600; }
.rel-marks { font-size: 0.75rem; color: var(--warn-ink); background: var(--warn-bg); padding: 0 0.45rem; border-radius: 99px; }
.rel-inspect { font-size: 0.75rem; color: var(--accent); margin-left: auto; text-decoration: underline; }
.rel-loop { border-left-style: dotted; } .rel-prevents { border-left-style: double; border-left-width: 4px; }
.grps { list-style: none; margin: 1rem 0 0; padding: 0; display: grid; gap: 1.1rem; }
.grp-joint > .grp-nodes, .grp-joint > .with { border-left: 3px solid var(--ink); padding-left: 0.75rem; }
.grp-nodes, .with, .minis, .list { display: grid; gap: 0.5rem; }
.joint-note { font-size: 0.8125rem; color: var(--ink); background: var(--sunk); border-radius: 6px; padding: 0.35rem 0.6rem; margin-bottom: 0.5rem; }
.with-h { font-size: 0.6875rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.why { background: none; border: 0; padding: 0.3rem 0; cursor: pointer; color: var(--accent); font-weight: 600; text-align: left; }
.why-n { font-weight: 400; color: var(--muted); }
.nest { margin: 0.25rem 0 0.5rem 0.9rem; padding-left: 0.9rem; border-left: 1px solid var(--line); }
.nest .grps { margin-top: 0.4rem; gap: 0.8rem; }
.loop-note, .root-note { font-size: 0.8125rem; color: var(--muted); padding: 0.2rem 0; }
.focus-card { margin-top: 1.5rem !important; }
.focus-card .st { border-width: 2px; }
.claim-type { font-size: 0.8125rem; color: var(--muted); margin-top: 0.5rem; }
.dir h2 { font-size: 1.0625rem; }
.trail { display: flex; flex-wrap: wrap; gap: 0.3rem 0.6rem; font-size: 0.8125rem; color: var(--muted); margin-top: 0.6rem; }
.trail ol { list-style: none; display: flex; flex-wrap: wrap; gap: 0.2rem 0.6rem; margin: 0; padding: 0; }
.trail li + li::before { content: "›"; margin-right: 0.6rem; }
.xgroup { margin-top: 1rem; }
.sub-h { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.4rem; }
summary.sub-h { cursor: pointer; margin-bottom: 0; padding: 0.3rem 0; }
.sub-note { font-size: 0.8125rem; color: var(--muted); margin: 0.3rem 0; }

/* the path */
.stops { list-style: none; margin: 2rem auto 0; padding: 0; }
.stop-q { font: 600 0.9375rem var(--sans); margin-bottom: 0.6rem; display: flex; align-items: center; gap: 0.6rem; }
.num { display: inline-grid; place-items: center; width: 1.6rem; height: 1.6rem; border-radius: 50%; background: var(--ink); color: var(--bg); font: 500 0.8125rem var(--mono); }
.stop-more { margin-top: 0.6rem; color: var(--muted); font-size: 0.875rem; }
.sub-block { margin-top: 0.9rem; padding-left: 0.9rem; border-left: 1px solid var(--line); }
.stop { padding: 0.4rem 0; }
.join { display: grid; grid-template-columns: 1.6rem minmax(0, 1fr); gap: 0.6rem; padding: 0.9rem 0; color: var(--muted); font-size: 0.875rem; }
.join-line { justify-self: center; width: 2px; min-height: 3.2rem; background: var(--line-strong); }
.join-gap .join-line { background: none; border-left: 2px dotted var(--line-strong); width: 0; }
.join p { align-self: center; } .join strong { color: var(--ink); }
.join-kind { display: block; font-size: 0.75rem; }
.swap { margin-top: 0.5rem; } .swap summary { cursor: pointer; color: var(--muted); font-size: 0.875rem; padding: 0.25rem 0; }
.swap-cta { color: var(--accent); font-weight: 600; text-decoration: underline; margin-left: 0.3rem; }
.swap-none, .swap-note { color: var(--muted); font-size: 0.875rem; margin-top: 0.5rem; }
.opts { list-style: none; margin: 0.5rem 0 0; padding: 0; display: grid; gap: 0.35rem; }
.opt { display: flex; flex-wrap: wrap; gap: 0.25rem 0.5rem; width: 100%; text-align: left; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 0.5rem 0.7rem; cursor: pointer; }
.opt:hover { border-color: var(--ink); } .opt.on { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.opt-t { flex: 1 1 100%; font-family: var(--serif); }
.cmp { font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.cmp + .cmp::before { content: "· "; }
.route, .risks { list-style: none; margin: 0.4rem 0 0; padding: 0; display: grid; gap: 0.6rem; }
.remedy { margin: 0.4rem 0 0 1.1rem; }
.who { margin-top: 0.9rem; background: var(--warn-bg); color: var(--warn-ink); border-radius: 8px; padding: 0.75rem 0.9rem; }
.who-h { font-size: 0.6875rem; letter-spacing: 0.08em; text-transform: uppercase; } .who-v { font: 600 1.25rem var(--serif); } .who-n { font-size: 0.875rem; margin-top: 0.2rem; }
.next { background: var(--bg); border-radius: 10px; padding: 1.1rem 1.25rem; } .next ul { margin: 0.5rem 0 0; padding-left: 1.1rem; display: grid; gap: 0.3rem; }
.oq-mini { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.6rem; }
.oq-mini li { display: grid; gap: 0.15rem; }
.oq-w { font-size: 0.6875rem; letter-spacing: 0.07em; text-transform: uppercase; color: var(--warn-ink); font-weight: 600; }
.oq-n { color: var(--muted); font-size: 0.875rem; }

/* start */
.goal-block { margin-top: 1.75rem !important; }
.goal-block .st { margin-top: 0.5rem; }
.facts { margin: 0.9rem 0 0; display: grid; gap: 0.75rem; }
.facts div { display: grid; grid-template-columns: 11rem minmax(0, 1fr); gap: 0.2rem 1rem; padding-top: 0.75rem; border-top: 1px solid var(--line); }
.facts dt { font-weight: 600; } .facts dd { margin: 0; color: var(--muted); }
.facts-tight div { grid-template-columns: 6.5rem minmax(0, 1fr); padding-top: 0.45rem; } .facts-tight { gap: 0.45rem; }
.teaser { list-style: none; margin: 1rem 0; padding: 0; display: grid; }
.tz { display: grid; grid-template-columns: 7.5rem minmax(0, 1fr); gap: 0.2rem 1rem; padding: 0.6rem 0; border-top: 1px solid var(--line); }
.tz-k { font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; padding-top: 0.2rem; }
.tz-aim .tz-k { color: var(--aim); } .tz-problem .tz-k { color: var(--problem); } .tz-change .tz-k { color: var(--change); } .tz-step .tz-k { color: var(--step); } .tz-action .tz-k { color: var(--action); }
.tz-t { font-family: var(--serif); }
.btn { display: inline-block; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 6px; padding: 0.4rem 0.8rem; cursor: pointer; text-decoration: none; color: var(--ink); font-weight: 500; }
.btn:hover { border-color: var(--ink); } .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); } .btn-quiet { border-color: transparent; color: var(--muted); }
.ways { display: grid; grid-template-columns: repeat(auto-fit, minmax(12.5rem, 1fr)); gap: 0.75rem; margin-top: 0.9rem; }
.way { display: grid; gap: 0.3rem; align-content: start; padding: 0.9rem 1rem; border: 1px solid var(--line-strong); border-radius: 8px; text-decoration: none; color: var(--ink); }
.way:hover { border-color: var(--accent); background: var(--bg); }
.way-k { font-size: 0.6875rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); } .way-t { font: 600 1.0625rem/1.25 var(--serif); } .way-d { font-size: 0.875rem; color: var(--muted); }
.six { margin: 0.9rem 0 0; padding: 0; list-style: none; counter-reset: six; }
.six li { counter-increment: six; border-top: 1px solid var(--line); }
.six a { display: grid; grid-template-columns: 1.6rem minmax(0, 1fr) auto; gap: 0.2rem 0.75rem; padding: 0.65rem 0; text-decoration: none; color: var(--ink); align-items: baseline; }
.six a::before { content: counter(six); font: 500 0.8125rem var(--mono); color: var(--muted); }
.six a:hover .six-q { text-decoration: underline; } .six-q { font: 500 1.0625rem var(--serif); } .six-n { font-size: 0.8125rem; color: var(--muted); }
.sources, .hist { list-style: none; margin: 0.9rem 0 0; padding: 0; display: grid; gap: 0.9rem; }
.sources li, .hist li { display: grid; gap: 0.15rem; } .src-d, .hist span:last-child { color: var(--muted); font-size: 0.875rem; }

/* question pages */
.part { padding-top: 0.25rem; } .part h2 { margin-top: 0.25rem; } .part .list, .part .cloud { margin-top: 0.9rem; }
.outline { list-style: none; margin: 0.5rem 0 0; padding: 0 0 0 1rem; border-left: 1px solid var(--line); display: grid; gap: 0.5rem; }
.cloud-sides { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: 1rem; margin-top: 0.9rem; }
.cloud-side { display: grid; gap: 0.2rem; align-content: start; }
.cloud-clash { margin-top: 0.8rem; background: var(--warn-bg); color: var(--warn-ink); padding: 0.5rem 0.75rem; border-radius: 6px; font-size: 0.875rem; }
.linklike { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; cursor: pointer; text-align: left; }

/* open questions and notes */
.filters { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 1rem !important; }
.chip { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 99px; padding: 0.25rem 0.75rem; cursor: pointer; font-size: 0.8125rem; }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.oq { list-style: none; margin: 1.5rem auto 0; padding: 0; display: grid; }
.oq > li { display: grid; gap: 0.3rem; padding: 1rem 0; border-top: 1px solid var(--line); }
.oq-l, .note-t { font: 500 1.0625rem/1.35 var(--serif); } .oq-on { font-size: 0.875rem; color: var(--muted); } .oq-a { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.3rem; }
.oq-tight { margin-top: 0.5rem; } .oq-tight > li { padding: 0.6rem 0; }

/* inspector */
#insp section { margin-top: 1.4rem; display: grid; gap: 0.5rem; }
.insp-head { display: flex; justify-content: space-between; gap: 0.5rem; align-items: start; }
.close { display: none; }
.insp-empty h2 { margin-bottom: 0.5rem; } .insp-empty p { color: var(--muted); }
.key { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0.4rem 0.7rem; margin: 1.25rem 0 0; font-size: 0.875rem; align-items: center; }
.key dd { margin: 0; color: var(--muted); } .key dt { font-weight: 500; display: flex; align-items: center; gap: 0.5rem; }

s, priorities and sense of what is possible.","by":"AI assistant"}],"source_refs":[{"source_id":"forum","post":38,"author":"leif","basis":"paraphrase"},{"source_id":"forum","post":29,"author":"leif","basis":"related"},{"source_id":"paradox","locator":"sections 1–6 and 10","basis":"cited"},{"source_id":"analysis-v2","locator":"p. 7, C14–C17; p. 8, U03","basis":"inference"}]},{"id":"g2-c-k6-rel-conflict","status":"proposed","accepted_by":[],"contributors":[{"name":"AI assistant","role":"assistant"}],"from":["g2-c-k6-adapt"],"to":"g2-c-k6-own","relation":"conflicts_with","assumptions":[{"text":"The selection pressures are fixed: what wins between institutions does not reward what sustains emancipatory practice within them.","by":"AI assistant"}],"source_refs":[{"source_id":"forum","post":38,"author":"leif","basis":"paraphrase"},{"source_id":"forum","post":20,"author":"leif","basis":"related"},{"source_id":"forum","post":26,"author":"leif","basis":"related"},{"source_id":"analysis-v2","locator":"p. 7, C14–C17; p. 8, U03","basis":"inference"}]}],"backlog":[{"ref":"g2-c-k1-rel-concentrate","work":"examine_assumption","label":"Can coordination and expertise be had without concentrating authority?","note":"The analysis names conflict guidance, local AI, federation and accountable governance as candidate ways through. Leif hopes widely available conflict competence could reduce reliance on hierarchical intervention; none of these routes has been tested. In post 38 Leif describes such routes as ways for decentralised institutions to acquire the capabilities they need to survive, and places Gandhi 2.0's deeper hypothesis in changing the selection pressures themselves; see the conflict between success and integrity.","source_refs":[{"source_id":"forum","post":29,"author":"leif","basis":"related"},{"source_id":"analysis-v2","locator":"p. 14, K1, candidate injections I02, I03, I06 and I10","basis":"reconstruction"},{"source_id":"forum","post":38,"author":"leif","basis":"related"}]},{"ref":"g2-c-rel-depend","work":"examine_assumption","label":"Does this function actually require AI to remain viable?","note":"Leif argues that communities may have no viable alternative to building AI in; Robert holds that relying on AI as a core social technology is asking for trouble, and Leif has asked him to say where he places that limit. Keep non-AI and optional-AI comparators. Neither has reviewed this wording.","source_refs":[{"source_id":"forum","post":33,"author":"leif","basis":"related"},{"source_id":"forum","post":30,"author":"robert","basis":"related"},{"source_id":"forum","post":34,"author":"robert","basis":"related"},{"source_id":"forum","post":36,"author":"leif","basis":"related"}]},{"ref":"g2-c-rel-conflict","work":"examine_assumption","label":"Test an exit and a fallback before treating AI dependence as unavoidable."},{"ref":"g2-c-k3-rel-conflict","work":"examine_assumption","label":"Can reciprocal limits be enforced against powerful defectors?","note":"Leif asks why the League of Nations and the United Nations failed to prevent major wars, and what would make rules hold when powerful actors find them inconvenient. Robert expects the arms race may worsen before it improves, and looks to a coalition of middle powers for leverage.","source_refs":[{"source_id":"forum","post":26,"author":"leif","basis":"related"},{"source_id":"forum","post":25,"author":"robert","basis":"related"},{"source_id":"analysis-v2","locator":"p. 16, K3","basis":"reconstruction"}]},{"ref":"g2-c-k4-rel-throughput","work":"examine_assumption","label":"Can essential services be kept without growing material throughput?","note":"Leif hopes AI can speed up the development of alternative energy and materials. Robert prefers Nate Hagens’s Great Simplification and hedging against bets on AI. Both are candidate ways through; neither has been tested.","source_refs":[{"source_id":"forum","post":33,"author":"leif","basis":"related"},{"source_id":"forum","post":34,"author":"robert","basis":"related"},{"source_id":"analysis-v2","locator":"p. 17, K4","basis":"reconstruction"}]},{"ref":"g2-c-k5-rel-engineer","work":"examine_assumption","label":"Can a service be funded without engineering attachment?","note":"Leif’s essay contrasts institutions that earn trust with those that depend on manipulation. Robert accepts AI only if people stay free to take it or leave it.","source_refs":[{"source_id":"last-first","locator":"sections 3–6","basis":"cited"},{"source_id":"forum","post":19,"author":"robert","basis":"related"},{"source_id":"analysis-v2","locator":"p. 18, K5","basis":"reconstruction"}]},{"ref":"g2-c-k6-objective","work":"connect_or_explain","label":"Check whether the authority, AI, throughput and attachment conflicts are cases of this one.","note":"If they are, this is the core conflict behind four of the five others. Ask Leif whether it captures the countercurrent's paradox of success before treating it as the core.","source_refs":[{"source_id":"forum","post":38,"author":"leif","basis":"related"}]},{"ref":"g2-c-k6-rel-conflict","work":"examine_assumption","label":"Can the selection pressures themselves change, rather than only the institutions?","note":"Leif's deeper hypothesis, in posts 20, 26 and 38, is that human–AI collaboration and institutional design might change what lets institutions survive and spread. The change that would test it is the one about changing the selection pressures.","source_refs":[{"source_id":"forum","post":20,"author":"leif","basis":"related"},{"source_id":"forum","post":26,"author":"leif","basis":"related"},{"source_id":"forum","post":38,"author":"leif","basis":"related"}]}]},"future_reality":{"nodes":[{"id":"g2-f-i01","status":"proposed","accepted_by":[],"contributors":[{"name":"AI assistant","role":"assistant"}],"kind":"injection","text":"Sustained, critically examined human–AI inquiry, adult learning and the four questions.","label":"Sustained, critically examined human–AI inquiry, adult learning and the four quest :"paraphrase"},{"source_id":"analysis-v2","locator":"p. 20, A05","basis":"reconstruction"}]},{"id":"g2-f-rel-a06-e07","status":"proposed","accepted_by":[],"contributors":[{"name":"AI assistant","role":"assistant"}],"from":["g2-f-a06"],"to":"g2-f-e07","relation":"contributes_to","assumptions":[{"text":"An enabling route only where the corresponding obstacle is real; supporting policy must also address actual harms and capture risks.","by":"AI assistant"}],"source_refs":[{"source_id":"analysis-v2","locator":"p. 20, A06","basis":"reconstruction"}]}],"backlog":[{"ref":"g2-f-guidance","work":"test_causality","label":"Compare AI guidance with optional-AI and human approaches.","note":"Check useful output, total cost, energy, member control, fallback and competence without the tool. Participants have not committed to running this comparison."},{"ref":"g2-f-rel-f05","work":"test_causality","label":"Decide in advance what evidence would change the hypothesis.","note":"Lower satisfaction scores or fewer complaints alone do not establish benefit. The first analysis asks whether small democratic groups gain more than hierarchies; the second distinguishes local improvements from the still-unclosed institutional-selection claim F17. One successful pilot cannot establish the larger claim."},{"ref":"g2-f-rel-harm","work":"examine_assumption","label":"Assess suppressed grievances separately from satisfaction.","note":"Retain independent human support and a way to report costs, unfairness, dependency and increased concentration of authority."},{"ref":"g2-f-rel-f02","work":"test_causality","label":"Test 1: does reflection become transferable judgment, not just agreeable dialogue?","note":"Prediction: against a suitable comparison, participants identify and revise consequential assumptions, consider contrary perspectives and act differently on later tasks. Defeated if benefits vanish outside the dialogue, depend on agreeing with the facilitator, or weaken independent judgment. Protect voluntary participation, correction and human support; no ontology score as the outcome.","source_refs":[{"source_id":"forum","post":20,"author":"leif","basis":"related"},{"source_id":"forum","post":23,"author":"leif","basis":"related"},{"source_id":"analysis-v2","locator":"p. 42, T1","basis":"reconstruction"}]},{"ref":"g2-f-rel-f05","work":"test_causality","label":"Test 2: does conflict guidance reduce destructive costs and the pressure to centralise?","note":"Prediction: over a defined period and comparison, destructive conflict costs and unnecessary hierarchical intervention fall while fair treatment, independent competence and member influence hold or improve. Defeated if only satisfaction or complaint counts improve, costs move elsewhere, structural grievances are hidden or authority concentrates. Protect confidentiality, voluntariness and independent human help, and measure justice, capability and control separately.","source_refs":[{"source_id":"forum","post":29,"author":"leif","basis":"related"},{"source_id":"paradox","locator":"section 9","basis":"cited"},{"source_id":"analysis-v2","locator":"p. 42, T2","basis":"reconstruction"}]},{"ref":"g2-f-rel-f06","work":"test_causality","label":"Test 3: does community-controlled AI give useful capability with practical autonomy?","note":"Prediction: the same useful service meets agreed quality and whole-cost limits, and migration or disruption tests show acceptable continuity without depending on a provider’s discretion. Defeated if quality or cost is unacceptable, one specialist stays indispensable, or exit and continuity fail in practice. Stage investment, keep the baseline service and test a feasible fallback.","source_refs":[{"source_id":"forum","post":28,"author":"robert","basis":"related"},{"source_id":"forum","post":30,"author":"robert","basis":"related"},{"source_id":"forum","post":33,"author":"leif","basis":"related"},{"source_id":"forum","post":34,"author":"robert","basis":"related"},{"source_id":"analysis-v2","locator":"p. 42, T3","basis":"reconstruction"}]},{"ref":"g2-f-rel-f07","work":"test_causality","label":"Test 4: does the Forge produce stable benefits and its claimed resource advantage?","note":"Prediction: a reproducible adaptation beats controls on held-out useful tasks and critical reflection without relevant regressions, and any energy claim is measured for comparable output. Defeated if only philosophical self-reports change, gains reflect selected prompts, other capabilities regress or resource costs do not improve. Keep functional performance, consciousness claims, model preferences and energy separate, and retain rollback.","source_refs":[{"source_id":"bindings","locator":"sections 11.4 and 13.2.1–13.5","basis":"cited"},{"source_id":"analysis-v2","locator":"p. 43, T4","basis":"reconstruction"}]},{"ref":"g2-f-rel-f09","work":"test_causality","label":"Test 5: does federation supply coordination without a new centre of domination?","note":"Prediction: the joint service improves coordination at acceptable cost while decision rights, exit and continuity survive disputed decisions and the loss of a participant. Defeated if coordination costs exceed gains, a gatekeeper gains unilateral control, or nominal decentralisation hides dependence. Keep authority traceable, updates bounded and reversible, exit meaningful and evaluation independent.","source_refs":[{"source_id":"paradox","locator":"section 7","basis":"cited"},{"source_id":"bindings","locator":"section 13.2.4","basis":"cited"},{"source_id":"analysis-v2","locator":"p. 43, T5","basis":"reconstruction"}]},{"ref":"g2-f-rel-f19","work":"test_causality","label":"Test 6: do AI-assisted innovation and distributed provision improve services within limits?","note":"Prediction: a physically verified, deployed option meets the service requirements, whole costs, ownership conditions and total ecological limits within the transition window. Defeated if results stay at prediction or laboratory stage, essential inputs are unavailable, deployment comes too late, or total demand offsets efficiency. Keep readiness stages separate and preserve essential provision if the transition is delayed or fails.","source_refs":[{"source_id":"forum","post":33,"author":"leif","basis":"related"},{"source_id":"forum","post":34,"author":"robert","basis":"related"},{"source_id":"carbon-pulse","locator":"maturity stages","basis":"cited"},{"source_id":"analysis-v2","locator":"p. 43, T6","basis":"reconstruction"}]},{"ref":"g2-f-rel-f13","work":"test_causality","label":"Test 7: do constructive practices reproduce and keep their mission under growth?","note":"Prediction: independent sites enact the practice and keep useful performance, justified trust and member control through an agreed period and changes in scale. Defeated if originators stay essential, adoption is symbolic, costs are hidden, or market success comes with democratic erosion. Measure selection within institutions separately from survival and adoption between them.","source_refs":[{"source_id":"forum","post":29,"author":"leif","basis":"related"},{"source_id":"last-first","locator":"sections 4 and 8","basis":"cited"},{"source_id":"paradox","locator":"sections 6 and 10","basis":"cited"},{"source_id":"analysis-v2","locator":"p. 43, T7","basis":"reconstruction"}]},{"ref":"g2-f-rel-f22","work":"test_causality","label":"Test 8: can security inquiry contribute to less escalatory institutions?","note":"Prediction: a proposal survives critical review, is implemented by empowered actors and produces observable reciprocal compliance and less escalatory conduct without sacrificing protected rights. Defeated if only the discussion improves, powerful actors ignore the rules, or a coalition increases threats and armament. Require verification, accountability, rights protection and explicit review of escalatory effects.","source_refs":[{"source_id":"forum","post":23,"author":"leif","basis":"related"},{"source_id":"forum","post":26,"author":"leif","basis":"related"},{"source_id":"analysis-v2","locator":"p. 44, T8","basis":"reconstruction"}]},{"ref":"g2-f-rel-f08","work":"test_causality","label":"Test 9: do voice participation and the field-learning loop improve real deliberation?","note":"Prediction: against a conversational baseline, the group handles important assumptions and decisions better without reduced participation or unapproved collection, and approved learning material leads to a separately tested improvement. Defeated if latency or interruption reduces participation, the AI becomes an authority, or no benefit outlasts conversational appeal. Keep human interruption and correction, voluntary participation, confidentiality and separate permission for any training use.","source_refs":[{"source_id":"forum","post":13,"author":"leif","basis":"related"},{"source_id":"forum","post":23,"author":"leif","basis":"related"},{"source_id":"bindings","locator":"section 13.2.2","basis":"cited"},{"source_id":"analysis-v2","locator":"p. 44, T9","basis":"reconstruction"}]},{"ref":"g2-f-rel-f14","work":"test_causality","label":"Test 10: does justified trust become a practical institutional advantage?","note":"Prediction: where people have feasible alternatives and comparable service, trustworthy conduct supports voluntary participation, sustained cooperation and useful contributions while member agency stays intact. Defeated if reported confidence rises without warranted conduct, people cannot really choose, or resources and authority concentrate despite adoption. Record conduct, confidence, freedom to choose, cooperation and decision rights separately, and do not infer justice from market success.","source_refs":[{"source_id":"forum","post":13,"author":"leif","basis":"related"},{"source_id":"last-first","locator":"sections 3–4 and 9","basis":"cited"},{"source_id":"paradox","locator":"section 6","basis":"cited"},{"source_id":"analysis-v2","locator":"p. 44, T10","basis":"reconstruction"}]},{"ref":"g2-f-rel-f17","work":"examine_assumption","label":"Is changing which institutions get selected the deepest leverage available?","note":"Show whether a capability, governance or material change improves durable humane outcomes more than a human-development, institutional or non-AI comparator. Leif argues AI may be the deepest leverage point; Robert locates it in the power to transcend paradigms, and Leif has asked him to confirm or correct that reading.","source_refs":[{"source_id":"forum","post":33,"author":"leif","basis":"related"},{"source_id":"forum","post":35,"author":"robert","basis":"related"},{"source_id":"forum","post":36,"author":"leif","basis":"related"},{"source_id":"analysis-v2","locator":"p. 46, open claims","basis":"reconstruction"}]},{"ref":"g2-f-i03","work":"examine_assumption","label":"Is engagement with AI necessary for lasting emancipation?","note":"Identify the particular function and competitive threat, and compare adequate non-AI and optional-AI arrangements. Historical recurrence alone does not establish future necessity.","source_refs":[{"source_id":"forum","post":20,"author":"leif","basis":"related"},{"source_id":"forum","post":30,"author":"robert","basis":"related"},{"source_id":"forum","post":33,"author":"leif","basis":"related"},{"source_id":"analysis-v2","locator":"p. 46, open claims","basis":"reconstruction"}]},{"ref":"g2-f-i04","work":"examine_assumption","label":"Does philosophical coherence give a computational or energy advantage?","note":"This needs matched useful-task and resource measurements on reproducible variants, with performance, inference effort, hardware and total costs kept distinct.","source_refs":[{"source_id":"bindings","locator":"sections 11.4 and 13","basis":"cited"},{"source_id":"analysis-v2","locator":"p. 46, open claims","basis":"reconstruction"}]},{"ref":"g2-f-i06","work":"examine_assumption","label":"Does a distributed architecture resist all three structural fates?","note":"Exercise actual dependencies, control rights, update integrity, loss of participants and credible capture routes; replace claims of immunity with bounded, demonstrated resilience.","source_refs":[{"source_id":"bindings","locator":"chapter 4 and section 13.2.4","basis":"cited"},{"source_id":"analysis-v2","locator":"p. 46, open claims","basis":"reconstruction"}]},{"ref":"g2-f-i08","work":"examine_assumption","label":"Can AI research change the energy transition in time?","note":"Track readiness and deployment at service scale, with financing, manufacturing, materials, ownership and continuing provision.","source_refs":[{"source_id":"forum","post":33,"author":"leif","basis":"related"},{"source_id":"forum","post":34,"author":"robert","basis":"related"},{"source_id":"analysis-v2","locator":"p. 47, open claims","basis":"reconstruction"}]},{"ref":"g2-f-a01","work":"examine_assumption","label":"Does reflective or spiritual maturity cause enduring institutional change?","note":"Observe actual behaviour and power over time, keeping inner experience, reported development, governance changes and survival apart.","source_refs":[{"source_id":"forum","post":19,"author":"robert","basis":"related"},{"source_id":"forum","post":35,"author":"robert","basis":"related"},{"source_id":"forum","post":36,"author":"leif","basis":"related"},{"source_id":"analysis-v2","locator":"p. 47, open claims","basis":"reconstruction"}]},{"ref":"g2-f-i11","work":"examine_assumption","label":"Is this a change of its own, or the combined effect of the other ten?","note":"In post 26 Leif expects these developments, taken together, to begin changing the selection pressures; in post 38 he names AI, human–AI collaboration and institutional design. If it is their combined effect, it belongs among the effects rather than the changes.","source_refs":[{"source_id":"forum","post":26,"author":"leif","basis":"related"},{"source_id":"forum","post":38,"author":"leif","basis":"related"}]}]},"prerequisite":{"nodes":[{"id":"g2-p-case","status":"proposed","accepted_by":[],"contributors":[{"name":"AI assistant","role":"assistant"}],"kind":"intermediate_objective","text":"A bounded host, problem, affected people, intended outcome and protected conditions are agreed.","label":"A bounded host, problem, affected people, intended outcome and protected conditions are agreed.","implements":["g2-f-i01","g2-f-guidance","g2-f-i03","g2-f-i06","g2-f-i08","g2-f-i09"],"source_refs":[{"source_id":"forum","post":17,"author":"leif","basis":"related"},{"source_id":"forum","post":23,"author":"leif","basis":"related"},{"source_id":"analysis-v2","locator":"p. 35, P01","basis":"reconstruction"}]},{"id":"g2-p-gap","status":"proposed","accepted_by":[],"contributors":[{"name":"AI assistant","role":"assistant"}],"kind":"obstacle","text":"No host, problem, affected group or intended outcome has yet been jointly chosen for the proposed collaboration.","label":"No host, problem or affected group has yet been jointly chosen for the collaboration.","source_refs":[{"source_id":"forum","post":17,"author":"leif","basis":"related"},{"source_id":"analysis-v2","locator":"p. 35, P01, obstacle (D)","basis":"reconstruction"}]},{"id":"g2-p-p02","status":"proposed","accepted_by":[],"contributors":[{"name":"AI assistant","role":"assistant"}],"kind":"intermediate_objective","text":"Existing assets, workflow, available capabilities, dependencies and costs for that case are known.","label":"Existing assets, workflow, available capabilities, dependencies and costs for that case are known.","implements":["g2-f-guidance","g2-f-i03","g2-f-i05","g2-f-i08","g2-f-n05-remedy"],"source_refs":[{"source_id":"forum","post":13,"author":"leif","basis":"related"},{"source_id":"forum","post":29,"author":"leif","basis":"related"},{"source_id":"paradox","locator":"section 9","basis":"cited"},{"source_id":"analysis-v2","locator":"p. 35, P02","basis":"reconstruction"}]},{"id":"g2-p-p02-obstacle","status":"proposed","accepted_by":[],"contributors":[{"name":"AI assistant","role":"assistant"}],"kind":"obstacle","text":"The selected host’s actual workflow, assets, dependencies and costs are not yet inventoried.","label":"The selected host’s actual workflow, assets, dependencies and costs are not yet inventoried.","source_refs":[{"source_id":"analysis-v2","locator":"p. 35, P02, obstacle (D)","basis":"reconstruction"}]},{"id":"g2-p-protocol","status":"proposed","accepted_by":[],"contributors":[{"name":"AI assistant","role":"assistant"}],"kind":"intermediate_objective","text":"Baseline, relevant comparison, outcome measures, harm limits and review conditions are agreed.","label":"Baseline, relevant comparison, outcome measures, harm limits and review conditions are agreed.","implements":["g2-f-i01","g2-f-guidance","g2-f-i04","g2-f-i05","g2-f-i06","g2-f-i07","g2-f-i08","g2-f-i09","g2-f-i10","g2-f-n01-remedy","g2-f-protections","g2-f-n06-remedy","g2-f-n07-remedy"],"source_refs":[{"source_id":"forum","post":20,"author":"leif","basis":"related"},{"source_id":"forum","post":23,"author":"leif","basis":"related"},{"source_id":"paradox","locator":"section 9","basis":"cited"},{"source_id":"analysis-v2","locator":"p. 35, P03","basis":"reconstruction"}]},{"id":"g2-p-p03-obstacle","status":"proposed","accepted_by":[],"contributors":[{"name":"AI assistant","role":"assistant"}],"kind":"obstacle","text":"The proposed comparative economic, relational and institutional effects have not yet been measured.","label":"The proposed comparative economic, relational and institutional effects have not yet been measured.","source_refs":[{"source_id":"analysis-v2","locator":"p. 35, P03, obstacle (D)","basis":"reconstruction"}]},{"id":"g2-p-p04","status":"proposed","accepted_by":[],"contributors":[{"name":"AI assistant","role":"assistant"}],"kind":"intermediate_objective","text":"The decision rights, participation, correction and accountability arrangements relevant to the chosen practice are workable and accepted; confidentiality, human support and learning-data permissions are established wherever those activities occur.","label":"Decision rights, accountability, confidentiality, human support and data permissions are settled.","implements":["g2-f-i01","g2-f-guidance","g2-f-i03","g2-f-i04","g2-f-i05","g2-f-i06","g2-f-i09","g2-f-i10","g2-f-n02-remedy","g2-f-protections","g2-f-n04-remedy","g2-f-n07-remedy","g2-f-n08-remedy","g2-f-n11-remedy","g2-f-n14-remedy"],"source_refs":[{"source_id":"paradox","locator":"section 9","basis":"cited"},{"source_id":"last-first","locator":"sections 3–6","basis":"cited"},{"source_id":"analysis-v2","locator":"p. 36, P04","basis":"reconstruction"}]},{"id":"g2-p-p04-obstacle","status":"proposed","accepted_by":[],"contributors":[{"name":"AI assistant","role":"assistant"}],"kind":"obstacle","text":"Where a sponsor or operator can impose participation, inspect private disputes or use outputs as unchallengeable authority, the proposed practice would reproduce domination.","label":"If a sponsor can impose participation or read private disputes, the practice reproduces domination.","source_refs":[{"source_id":"paradox","locator":"section 9","basis":"cited"},{"source_id":"analysis-v2","locator":"p. 36, P04, obstacle (S)","basis":"reconstruction"}]},{"id":"g2-p-p05","status":"proposed","accepted_by":[],"contributors":[{"name":"AI assistant","role":"assistant"}],"kind":"intermediate_objective","text":"The relevant host has committed accountable people, authority, time, skills and a bounded budget.","label":"The relevant host has committed accountable people, authority, time, skills and a bounded budget.","implements":["g2-f-i01","g2-f-guidance","g2-f-i03","g2-f-i05","g2-f-i06","g2-f-i08","g2-f-i09"],"source_refs":[{"source_id":"forum","post":17,"author":"leif","basis":"related"},{"source_id":"bindings","locator":"section 17.4","basis":"cited"},{"source_id":"analysis-v2","locator":"p. 36, P05","basis":"reconstruction"}]},{"id":"g2-p-p05-obstacle","status":"proposed","accepted_by":[],"contributors":[{"name":"AI assistant","role":"assistant"}],"kind":"obstacle","text":"Where no authorised participant has allocated the required time, competence or resources, the selected trial cannot occur.","label":"If no authorised participant commits time, competence or resources, the trial cannot happen.","source_refs":[{"source_id":"analysis-v2","locator":"p. 36, P05, obstacle (X)","basis":"reconstruction"}]},{"id":"g2-p-p06","status":"proposed","accepted_by":[],"contributors":[{"name":"AI assistant","role":"assistant"}],"kind":"intermediate_objective","text":"A repeatable reflective-inquiry procedure is ready and can challenge the preferred interpretation.","label":"A repeatable reflective-inquiry procedure is ready and can challenge the preferred interpretation.","implements":["g2-f-i01","g2-f-i04","g2-f-n01-remedy","g2-f-n04-remedy"],"source_refs":[{"source_id":"forum","post":20,"author":"leif","basis":"related"},{"source_id":"forum","post":23,"author":"leif","basis":"related"},{"source_id":"forum","post":36,"author":"leif","basis":"related"},{"source_id":"last-first","locator":"section 5","basis":"cited"},{"source_id":"analysis-v2","locator":"p. 36, P06","basis":"reconstruction"}]},{"id":"g2-p-p06-obstacle","status":"proposed","accepted_by":[],"contributors":[{"name":"AI assistant","role":"assistant"}],"kind":"obstacle","text":"Unstructured or leading dialogue cannot distinguish transferable judgment from agreement with the facilitator or a preferred ontology.","label":"Leading dialogue cannot tell transferable judgment from agreement with the facilitator.","source_refs":[{"source_id":"forum","post":20,"author":"leif","basis":"related"},{"source_id":"analysis-v2","locator":"p. 36, P06, obstacle (R)","basis":"reconstruction"}]},{"id":"g2-p-p07","status":"proposed","accepted_by":[],"contributors":[{"name":"AI assistant","role":"assistant"}],"kind":"intermediate_objective","text":"The existing conflict-guidance application fits the selected workflow, with trained human responsibility and an appropriate fallback.","label":"The existing conflict-guidance app fits the workflow, with trained human support and a fallback.","implements":["g2-f-guidance","g2-f-n02-remedy","g2-f-protections"],"source_refs":[{"source_id":"forum","post":29,"author":"leif","basis":"related"},{"source_id":"paradox","locator":"section 9","basis":"cited"},{"source_id":"analysis-v2","locator":"p. 36, P07","basis":"reconstruction"}]},{"id":"g2-p-p07-obstacle","status":"proposed","accepted_by":[],"contributors":[{"name":"AI assistant","role":"assistant"}],"kind":"obstacle","text":"Where the application does not fit access, language, competence, confidentiality or difficult-case requirements, availability of the prototype does not make guidance usable.","label":"If the app does not fit access, language, confidentiality or hard cases, having it does not help.","source_refs":[{"source_id":"analysis-v2","locator":"p. 36, P07, obstacle (X)","basis":"reconstruction"}]},{"id":"g2-p-trial","status":"proposed","accepted_by":[],"contributors":[{"name":"AI assistant","role":"assistant"}],"kind":"intermediate_objective","text":"An authorised bounded trial has produced traceable observations under a credible comparison.","label":"An authorised bounded trial has produced traceable observations under a credible comparison.","implements":["g2-f-i01","g2-f-guidance"],"source_refs":[{"source_id":"forum","post":9,"author":"robert","basis":"related"},{"source_id":"forum","post":18,"author":"robert","basis":"related"},{"source_id":"forum","post":20,"author":"leif","basis":"related"},{"source_id":"analysis-v2","locator":"p. 36, P08","basis":"reconstruction"}]},{"id":"g2-p-p08-obstacle","status":"proposed","accepted_by":[],"contributors":[{"name":"AI assistant","role":"assistant"}],"kind":"obstacle","text":"No observations yet compare actual behaviour, conflict costs and institutional effects.","label":"No observations yet compare actual behaviour, conflict costs and institutional effects.","source_refs":[{"source_id":"analysis-v2","locator":"p. 36, P08, obstacle (D)","basis":"reconstruction"}]},{"id":"g2-p-p09","status":"proposed","accepted_by":[],"contributors":[{"name":"AI assistant","role":"assistant"}],"kind":"intermediate_objective","text":"Independent review supports a bounded continuation decision under the agreed benefit and harm criteria.","label":"Independent review supports a bounded continuation under the agreed benefit and harm criteria.","implements":["g2-f-i01","g2-f-guidance","g2-f-i10","g2-f-protections","g2-f-n04-remedy"],"source_refs":[{"source_id":"forum","post":20,"author":"leif","basis":"related"},{"source_id":"paradox","locator":"section 9","basis":"cited"},{"source_id":"analysis-v2","locator":"p. 37, P09","basis":"reconstruction"}]},{"id":"g2-p-p09-obstacle","status":"proposed","accepted_by":[],"contributors":[{"name":"AI assistant","role":"assistant"}],"kind":"obstacle","text":"Without review that can reject the favoured interpretation, appealing conversations or selected cases cannot justify institutional adoption.","label":"Without a review able to reject it, appealing conversations cannot justify institutional adoption.","source_refs":[{"source_id":"forum","post":20,"author":"leif","basis":"related"},{"source_id":"analysis-v2","locator":"p. 37, P09, obstacle (R)","basis":"reconstruction"}]},{"id":"g2-p-p10","status":"proposed","accepted_by":[],"contributors":[{"name":"AI assistant","role":"assistant"}],"kind":"objective","text":"Ordinary operation sustains the benefit, member control, ownership of support and acceptable continuing cost.","label":"Ordinary operation sustains the benefit, member control and an acceptable continuing cost.","implements":["g2-f-i01","g2-f-guidance","g2-f-i10","g2-f-n11-remedy"],"source_refs":[{"source_id":"last-first","locator":"section 8","basis":"cited"},{"source_id":"paradox","locator":"sections 9–10","basis":"cited"},{"source_id":"analysis-v2","locator":"p. 37, P10","basis":"reconstruction"}]},{"id":"g2-p-p10-obstacle","status":"proposed","accepted_by":[],"contributors":[{"name":"AI assistant","role":"assistant"}],"kind":"obstacle","text":"Where operation depends on an unfunded founder, temporary research facilitation or an unaccountable operator, a useful pilot cannot become a durable democratic practice.","label":"A pilot reliant on an unfunded founder or unaccountable operator cannot become a durable practice.","source_refs":[{"source_id":"analysis-v2","locator":"p. 37, P10, obstacle (X)","basis":"reconstruction"}]},{"id":"g2-p-p11","status":"proposed","accepted_by":[],"contributors":[{"name":"AI assistant","role":"assistant"}],"kind":"intermediate_objective","text":"Essential AI-assisted functions have explicit quality, cost, energy, availability, data-control and exit requirements.","label":"AI-assisted functions have explicit quality, cost, energy, data-control and exit requirements.","implements":["g2-f-i03","g2-f-i08","g2-f-n05-remedy","g2-f-n06-remedy","g2-f-n15-remedy"],"source_refs":[{"source_id":"forum","post":28,"author":"robert","basis":"related"},{"source_id":"forum","post":30,"author":"robert","basis":"related"},{"source_id":"forum","post":34,"author":"robert","basis":"related"},{"source_id":"paradox","locator":"section 7","basis":"cited"},{"source_id":"analysis-v2","locator":"p. 37, P11","basis":"reconstruction"}]},{"id":"g2-p-p11-obstacle","status":"proposed","accepted_by":[],"contributors":[{"name":"AI assistant","role":"assistant"}],"kind":"obstacle","text":"Local, cloud or non-AI alternatives cannot be compared meaningfully while the essential service and acceptable dependencies remain unspecified.","label":"Local, cloud and non-AI options cannot be compared until the essential service is specified.","source_refs":[{"source_id":"analysis-v2","locator":"p. 37, P11, obstacle (R)","basis":"reconstruction"}]},{"id":"g2-p-p12","status":"proposed","accepted_by":[],"contributors":[{"name":"AI assistant","role":"assistant"}],"kind":"intermediate_objective","text":"An appropriate accessible model, usable hardware, operating energy, rights of adaptation and a capable maintainer are secured.","label":"An accessible model, hardware, energy, adaptation rights and a capable maintainer are secured.","implements":["g2-f-i03","g2-f-i04","g2-f-n05-remedy"],"source_refs":[{"source_id":"forum","post":28,"author":"robert","basis":"related"},{"source_id":"paradox","locator":"section 7","basis":"cited"},{"source_id":"bindings","locator":"sections 13.2.1 and 17.3–17.4","basis":"cited"},{"source_id":"analysis-v2","locator":"p. 37, P12","basis":"reconstruction"}]},{"id":"g2-p-p12-obstacle","status":"proposed","accepted_by":[],"contributors":[{"name":"AI assistant","role":"assistant"}],"kind":"obstacle","text":"Where a required capability, permission, device, energy supply or maintainer is inaccessible, the proposed local operation is not feasible.","label":"Local operation fails while a needed model, permission, device, energy or maintainer is missing.","source_refs":[{"source_id":"analysis-v2","locator":"p. 37, P12, obstacle (S)","basis":"reconstruction"}]},{"id":"g2-p-p13","status":"proposed","accepted_by":[],"contributors":[{"name":"AI assistant","role":"assistant"}],"kind":"intermediate_objective","text":"A local or community-controlled service demonstrably meets the requirements at measured whole cost.","label":"A local or community-controlled service demonstrably meets the requirements at measured whole cost.","implements":["g2-f-i03","g2-f-n05-remedy","g2-f-n06-remedy","g2-f-n15-remedy"],"source_refs":[{"source_id":"forum","post":28,"author":"robert","basis":"related"},{"source_id":"paradox","locator":"section 7","basis":"cited"},{"source_id":"analysis-v2","locator":"p. 37, P13","basis":"reconstruction"}]},{"id":"g2-p-p13-obstacle","status":"proposed","accepted_by":[],"contributors":[{"name":"AI assistant","role":"assistant"}],"kind":"obstacle","text":"Where accessible local capability fails the task or consumes unaffordable operating resources, ownership alone doe operation.","implements":["g2-f-i03","g2-f-i10","g2-f-n05-remedy","g2-f-n15-remedy"],"source_refs":[{"source_id":"paradox","locator":"section 7","basis":"cited"},{"source_id":"analysis-v2","locator":"p. 38, P15","basis":"reconstruction"}]},{"id":"g2-p-p15-obstacle","status":"proposed","accepted_by":[],"contributors":[{"name":"AI assistant","role":"assistant"}],"kind":"obstacle","text":"Short demonstrations do not establish continuing autonomy when maintenance, costs, essential inputs or decision rights deteriorate.","label":"Short demonstrations do not show lasting autonomy as maintenance, costs or decision rights erode.","source_refs":[{"source_id":"analysis-v2","locator":"p. 38, P15, obstacle (X)","basis":"reconstruction"}]},{"id":"g2-p-p16","status":"proposed","accepted_by":[],"contributors":[{"name":"AI assistant","role":"assistant"}],"kind":"intermediate_objective","text":"A consented, varied and inspectable learning dataset and held-out evaluation set exist.","label":"A consented, varied and inspectable learning dataset and held-out evaluation set exist.","implements":["g2-f-i04","g2-f-i05","g2-f-n01-remedy","g2-f-n02-remedy","g2-f-n09-remedy"],"source_refs":[{"source_id":"bindings","locator":"section 13.2.1","basis":"cited"},{"source_id":"paradox","locator":"section 9","basis":"cited"},{"source_id":"analysis-v2","locator":"p. 38, P16","basis":"reconstruction"}]},{"id":"g2-p-p16-obstacle","status":"proposed","accepted_by":[],"contributors":[{"name":"AI assistant","role":"assistant"}],"kind":"obstacle","text":"Selected breakthrough traces can encode a facilitator’s assumptions, and private field discussions may not be available for training.","label":"Selected traces can encode a facilitator’s assumptions, and private discussions may be off limits.","source_refs":[{"source_id":"analysis-v2","locator":"p. 38, P16, obstacle (R)","basis":"reconstruction"}]},{"id":"g2-p-p17","status":"proposed","accepted_by":[],"contributors":[{"name":"AI assistant","role":"assistant"}],"kind":"intermediate_objective","text":"An adapted model can be reproduced, compared and rolled back without losing the baseline.","label":"An adapted model can be reproduced, compared and rolled back without losing the baseline.","implements":["g2-f-i04","g2-f-n09-remedy"],"source_refs":[{"source_id":"bindings","locator":"section 13.2.1","basis":"cited"},{"source_id":"analysis-v2","locator":"p. 38, P17","basis":"reconstruction"}]},{"id":"g2-p-p17-obstacle","status":"proposed","accepted_by":[],"contributors":[{"name":"AI assistant","role":"assistant"}],"kind":"obstacle","text":"A changed response style alone does not show what was changed or whether useful capabilities regressed.","label":"A changed response style does not show what changed or whether useful capabilities regressed.","source_refs":[{"source_id":"analysis-v2","locator":"p. 38, P17, obstacle (R)","basis":"reconstruction"}]},{"id":"g2-p-p18","status":"proposed","accepted_by":[],"contributors":[{"name":"AI assistant","role":"assistant"}],"kind":"objective","text":"Independent tests establish which adaptation benefits, regressions and resource effects actually occur.","label":"Independent tests show which adaptation benefits, regressions and resource effects actually occur.","implements":["g2-f-i04","g2-f-n01-remedy","g2-f-n09-remedy","g2-f-n14-remedy"],"source_refs":[{"source_id":"bindings","locator":"sections 11.4, 13.1, 13.5 and 17.1","basis":"cited"},{"source_id":"analysis-v2","locator":"p. 38, P18","basis":"reconstruction"}]},{"id":"g2-p-p18-obstacle","status":"proposed","accepted_by":[],"contributors":[{"name":"AI assistant","role":"assistant"}],"kind":"obstacle","text":"Claims that philosophical coherence lowers computation or energy and yields reliable benevolence have not been demonstrated under controlled tests.","label":"Claims that coherence lowers energy use and yields reliable benevolence are untested under controls.","source_refs":[{"source_id":"analysis-v2","locator":"p. 38, P18, obstacle (D)","basis":"reconstruction"}]},{"id":"g2-p-p19","status":"proposed","accepted_by":[],"contributors":[{"name":"AI assistant","role":"assistant"}],"kind":"intermediate_objective","text":"AI voice participation is workable, interruptible and acceptable in the selected real conversation.","label":"AI voice participation is workable, interruptible and acceptable in the selected real conversation.","implements":["g2-f-i05","g2-f-n02-remedy"],"source_refs":[{"source_id":"forum","post":13,"author":"leif","basis":"related"},{"source_id":"bindings","locator":"section 13.2.2","basis":"cited"},{"source_id":"analysis-v2","locator":"p. 38, P19","basis":"reconstruction"}]},{"id":"g2-p-p19-obstacle","status":"proposed","accepted_by":[],"contributors":[{"name":"AI assistant","role":"assistant"}],"kind":"obstacle","text":"Where turn-taking, latency, access or private-data handling disrupt participation, a speech pipeline does not yet provide constructive group involvement.","label":"Where latency, turn-taking or data handling disrupt the talk, a voice pipeline does not yet help.","source_refs":[{"source_id":"forum","post":13,"author":"leif","basis":"related"},{"source_id":"analysis-v2","locator":"p. 38, P19, obstacle (X)","basis":"reconstruction"}]},{"id":"g2-p-p20","status":"proposed","accepted_by":[],"contributors":[{"name":"AI assistant","role":"assistant"}],"kind":"objective","text":"Comparative observations establish the effect of voice participation and identify consented improvements for the next cycle.","label":"Comparative observations show the effect of voice participation and consented improvements.","implements":["g2-f-i05"],"source_refs":[{"source_id":"forum","post":23,"author":"leif","basis":"related"},{"source_id":"bindings","locator":"section 13.2.2","basis":"cited"},{"source_id":"analysis-v2","locator":"p. 38, P20","basis":"reconstruction"}]},{"id":"g2-p-p20-obstacle","status":"proposed","accepted_by":[],"contributors":[{"name":"AI assistant","role":"assistant"}],"kind":"obstacle","text":"It has not yet been shown that voice participation improves group judgment, or that material captured from it can be reused with permission.","label":"It is not yet shown that voice participation improves judgment or that its material can be reused.","source_refs":[{"source_id":"analysis-v2","locator":"p. 38, P20, obstacle (D)","basis":"reconstruction"}]},{"id":"g2-p-p21","status":"proposed","accepted_by":[],"contributors":[{"name":"AI assistant","role":"assistant"}],"kind":"intermediate_objective","text":"At least two autonomous participants have agreed a specific shared task, authority boundaries, contribution rules and exit rights.","label":"Two or more autonomous participants agree a shared task, authority limits, contributions and exit.","implements":["g2-f-i06","g2-f-n08-remedy"],"source_refs":[{"source_id":"forum","post":28,"author":"robert","basis":"related"},{"source_id":"paradox","locator":"section 7","basis":"cited"},{"source_id":"bindings","locator":"section 13.2.4","basis":"cited"},{"source_id":"analysis-v2","locator":"p. 39, P21","basis":"reconstruction"}]},{"id":"g2-p-p21-obstacle","status":"proposed","accepted_by":[],"contributors":[{"name":"AI assistant","role":"assistant"}],"kind":"obstacle","text":"A desire for federation does not establish whose resource is shared or who may decide, pay, change or leave.","label":"Wanting federation does not settle whose resource is shared or who may decide, pay or leave.","source_refs":[{"source_id":"analysis-v2","locator":"p. 39, P21, obstacle (X)","basis":"reconstruction"}]},{"id":"g2-p-p22","status":"proposed","accepted_by":[],"contributors":[{"name":"AI assistant","role":"assistant"}],"kind":"intermediate_objective","text":"A bounded shared service works across the participating nodes with compatible interfaces and restricted data exchange.","label":"A bounded shared service works across nodes with compatible interfaces and restricted data exchange.","implements":["g2-f-i06","g2-f-n09-remedy"],"source_refs":[{"source_id":"paradox","locator":"section 7","basis":"cited"},{"source_id":"bindings","locator":"section 13.2.4","basis":"cited"},{"source_id":"analysis-v2","locator":"p. 39, P22","basis":"reconstruction"}]},{"id":"g2-p-p22-obstacle","status":"proposed","accepted_by":[],"contributors":[{"name":"AI assistant","role":"assistant"}],"kind":"obstacle","text":"Incompatible workflows or data and update rules can force coordination back through a central operator.","label":"Incompatible workflows or update rules can force coordination back through a central operator.","source_refs":[{"source_id":"analysis-v2","locator":"p. 39, P22, obstacle (X)","basis":"reconstruction"}]},{"id":"g2-p-p23","status":"proposed","accepted_by":[],"contributors":[{"name":"AI assistant","role":"assistant"}],"kind":"intermediate_objective","text":"Failure, capture, exclusion and update tests show that no single operator can silently take over the shared function.","label":"Failure and capture tests show no single operator can silently take over the shared function.","implements":["g2-f-i06","g2-f-i10","g2-f-n08-remedy","g2-f-n09-remedy","g2-f-n14-remedy"],"source_refs":[{"source_id":"bindings","locator":"sections 13.2.4–13.6","basis":"cited"},{"source_id":"paradox","locator":"section 7","basis":"cited"},{"source_id":"analysis-v2","locator":"p. 39, P23","basis":"reconstruction"}]},{"id":"g2-p-p23-obstacle","status":"proposed","accepted_by":[],"contributors":[{"name":"AI assistant","role":"assistant"}],"kind":"obstacle","text":"A distributed topology or reputation label alone does not demonstrate resistance to concentrated influence, bad updates or hidden control.","label":"A distributed topology or reputation label alone does not show resistance to capture or bad updates.","source_refs":[{"source_id":"analysis-v2","locator":"p. 39, P23, obstacle (R)","basis":"reconstruction"}]},{"id":"g2-p-p24","status":"proposed","accepted_by":[],"contributors":[{"name":"AI assistant","role":"assistant"}],"kind":"objective","text":"The shared arrangement provides a measurable coordination benefit while preserving substantive member autonomy.","label":"The shared arrangement gives a measurable coordination benefit while preserving member autonomy.","implements":["g2-f-i06","g2-f-i10","g2-f-n08-remedy","g2-f-n11-remedy"],"source_refs":[{"source_id":"paradox","locator":"section 7","basis":"cited"},{"source_id":"last-first","locator":"section 4","basis":"cited"},{"source_id":"analysis-v2","locator":"p. 39, P24","basis":"reconstruction"}]},{"id":"g2-p-p24-obstacle","status":"proposed","accepted_by":[],"contributors":[{"name":"AI assistant","role":"assistant"}],"kind":"obstacle","text":"A working network may add overhead or centralise authority without closing a real coordination gap.","label":"A working network may add overhead or centralise authority without closing a real coordination gap.","source_refs":[{"source_id":"analysis-v2","locator":"p. 39, P24, obstacle (X)","basis":"reconstruction"}]},{"id":"g2-p-p25","status":"proposed","accepted_by":[],"contributors":[{"name":"AI assistant","role":"assistant"}],"kind":"intermediate_objective","text":"The essential energy and material services, seasonal requirements, risks, ownership and ecological limits are specified.","label":"Essential energy and material services, seasonal needs, risks, ownership and limits are specified.","implements":["g2-f-i08","g2-f-n06-remedy","g2-f-n07-remedy","g2-f-n12-remedy"],"source_refs":[{"source_id":"forum","post":34,"author":"robert","basis":"related"},{"source_id":"forum","post":30,"author":"robert","basis":"related"},{"source_id":"carbon-pulse","locator":"useful energy services","basis":"cited"},{"source_id":"analysis-v2","locator":"p. 39, P25","basis":"reconstruction"}]},{"id":"g2-p-p25-obstacle","status":"proposed","accepted_by":[],"contributors":[{"name":"AI assistant","role":"assistant"}],"kind":"obstacle","text":"No essential energy or material service requirement has yet been selected, so discovery claims cannot show the actual remaining limitation.","label":"No essential energy service is selected yet, so discovery claims cannot show the real limitation.","source_refs":[{"source_id":"analysis-v2","locator":"p. 39, P25, obstacle (D)","basis":"reconstruction"}]},{"id":"g2-p-p26","status":"proposed","accepted_by":[],"contributors":[{"name":"AI assistant","role":"assistant"}],"kind":"intermediate_objective","text":"The selected material or energy solution has physical evidence at the maturity needed for the proposed service.","label":"The selected energy or material solution has physical evidence at the maturity the service needs.","implements":["g2-f-i08","g2-f-n12-remedy"],"source_refs":[{"source_id":"carbon-pulse","locator":"maturity stages","basis":"cited"},{"source_id":"analysis-v2","locator":"p. 40, P26","basis":"reconstruction"}]},{"id":"g2-p-p26-obstacle","status":"proposed","accepted_by":[],"contributors":[{"name":"AI assistant","role":"assistant"}],"kind":"obstacle","text":"An AI prediction or laboratory result cannot establish a deployable energy or material service.","label":"An AI prediction or laboratory result cannot establish a deployable energy or material service.","source_refs":[{"source_id":"analysis-v2","locator":"p. 40, P26, obstacle (S)","basis":"reconstruction"}]},{"id":"g2-p-p27","status":"proposed","accepted_by":[],"contributors":[{"name":"AI assistant","role":"assistant"}],"kind":"intermediate_objective","text":"Engineering, manufacturing, finance, supply, installation, maintenance and accountable ownership are feasible for the selected solution.","label":"Engineering, manufacturing, finance, supply, maintenance and accountable ownership are feasible.","implements":["g2-f-i08","g2-f-n12-remedy"],"source_refs":[{"source_id":"carbon-pulse","locator":"deployment","basis":"cited"},{"source_id":"analysis-v2","locator":"p. 40, P27","basis":"reconstruction"}]},{"id":"g2-p-p27-obstacle","status":"propos
