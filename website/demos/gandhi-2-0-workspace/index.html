onnection."},{"type":"revised","refs":["g2-p-rel-trial"],"note":"Now follows the analysis’s structure for this connection."},{"type":"revised","refs":["g2-t-rel-case"],"note":"Now follows the analysis’s structure for this connection."},{"type":"credited","refs":["g2-t-case","g2-r-rel-centralisation","g2-p-rel-case"],"note":"Credits and page references updated."},{"type":"removed","refs":["g2-f-rel-benefit"],"note":"Replaced by the analysis’s chain of effects from guidance to coordination."}]},{"release_id":"2026-10-23.2","date":"2026-10-23","title":"The countercurrent’s paradox","summary":"A response to Leif Eriksson’s post 38. The goal’s six items become success factors, with selection between institutions and selection within them as conditions under the fifth. A sixth conflict sets surviving in the existing order against keeping its pressures from reshaping the institution, and a new change proposes altering the selection pressures themselves. All proposed.","changes":[{"type":"added","refs":["g2-g-g5-between","g2-g-g5-within","g2-g-rel-g5-between","g2-g-rel-g5-within","g2-c-k6-objective","g2-c-k6-between","g2-c-k6-within","g2-c-k6-adapt","g2-c-k6-own","g2-c-k6-rel-between","g2-c-k6-rel-within","g2-c-k6-rel-adapt","g2-c-k6-rel-own","g2-c-k6-rel-conflict","g2-f-i11","g2-f-rel-i11-e14"],"note":"The countercurrent’s paradox and the change Leif proposes for it, from post 38."},{"type":"revised","refs":["g2-g-future","g2-g-g2","g2-g-capability","g2-g-control","g2-g-g5","g2-g-g6"],"note":"Now a success factor; the analysis calls these conditions."}]}],"publication_kind":"source_reconstruction","authors":{"leif":{"name":"Leif Eriksson","role":"Opened the thread and shared the five essays it discusses"},"robert":{"name":"Robert Bunge","role":"Took part in the thread"},"justin":{"name":"Justin","role":"Took part in the thread"},"rufus":{"name":"Rufus Pollock","role":"Took part in the thread"}},"sources":[{"id":"forum","title":"What Would Make a Second Renaissance Possible? · Second Renaissance Forum · posts 1–36 and 38, 16–22 October 2026","description":"The public forum thread this map draws on, opened by Leif Eriksson. Its first 36 posts were checked against the public topic on 22 October 2026, and post 38, Leif Eriksson’s response to an earlier version of this map, against a print of the topic on 23 October 2026. Each credit links to the post it names. The paraphrases are the AI’s; a credit says where an idea comes from, not that its author agrees with the wording, and none of the people credited has reviewed it.","url":"https://forum.secondrenaissance.net/t/what-would-make-a-second-renaissance-possible/909","posts":{"1":{"author":"leif","date":"2026-10-16"},"2":{"author":"robert","date":"2026-10-16"},"3":{"author":"leif","date":"2026-10-16"},"4":{"author":"leif","date":"2026-10-16"},"5":{"author":"robert","date":"2026-10-16"},"6":{"author":"robert","date":"2026-10-17"},"7":{"author":"leif","date":"2026-10-17"},"8":{"author":"robert","date":"2026-10-17"},"9":{"author":"robert","date":"2026-10-17"},"10":{"author":"rufus","date":"2026-10-17"},"11":{"author":"leif","date":"2026-10-17"},"12":{"author":"robert","date":"2026-10-17"},"13":{"author":"leif","date":"2026-10-18"},"14":{"author":"robert","date":"2026-10-18"},"15":{"author":"leif","date":"2026-10-18"},"16":{"author":"robert","date":"2026-10-18"},"17":{"author":"leif","date":"2026-10-19"},"18":{"author":"robert","date":"2026-10-19"},"19":{"author":"robert","date":"2026-10-19"},"20":{"author":"leif","date":"2026-10-20"},"21":{"author":"robert","date":"2026-10-20"},"22":{"author":"robert","date":"2026-10-20"},"23":{"author":"leif","date":"2026-10-20"},"24":{"author":"robert","date":"2026-10-21"},"25":{"author":"robert","date":"2026-10-21"},"26":{"author":"leif","date":"2026-10-21"},"27":{"author":"robert","date":"2026-10-21"},"28":{"author":"robert","date":"2026-10-21"},"29":{"author":"leif","date":"2026-10-21"},"30":{"author":"robert","date":"2026-10-21"},"31":{"author":"justin","date":"2026-10-21"},"32":{"author":"leif","date":"2026-10-21"},"33":{"author":"leif","date":"2026-10-22"},"34":{"author":"robert","date":"2026-10-22"},"35":{"author":"robert","date":"2026-10-22"},"36":{"author":"leif","date":"2026-10-22"},"38":{"author":"leif","date":"2026-10-22"}}},{"id":"bindings","title":"Bindings and the Captive Mind: From the Hand Axe to the Awakening of AI · manuscript draft","description":"Leif Eriksson’s book manuscript, shared as a draft in the thread. It was not read here: credits to it rest on the chapter and section references in the supplied analysis.","author":"leif","shared_in_post":11},{"id":"last-first","title":"The Last Shall Be First? Artificial Intelligence, the Selection of Trustworthy Institutions, and the Possibility of a New Civilizational Path · essay","description":"An essay by Leif Eriksson, shared in the thread. It was not read here: credits to it rest on the section references in the supplied analysis.","author":"leif","shared_in_post":13},{"id":"paradox","title":"The Countercurrent’s Paradox of Success · essay","description":"An essay by Leif Eriksson comparing Swedish, Finnish and British consumer cooperatives, shared in the thread. It was not read here: credits to it rest on the section references in the supplied analysis.","author":"leif","shared_in_post":29},{"id":"leverage","title":"Where Is the Deepest Leverage Point? · essay","description":"An essay by Leif Eriksson, shared in the thread. It was not read here: credits to it rest on the section references in the supplied analysis.","author":"leif","shared_in_post":33},{"id":"carbon-pulse","title":"The Carbon Pulse · essay","description":"An essay by Leif Eriksson, shared in the thread. It was not read here: credits to it rest on the topics the supplied analysis cites.","author":"leif","shared_in_post":33},{"id":"analysis-v2","title":"Second Renaissance Causal and Prerequisite Trees · version 2 · 22 October 2026","description":"Supplied 48-page analysis of the thread and the five essays. Page numbers and identifiers on each item refer to this document. Its reconstructions and inferences are labelled as such; it does not establish the participants’ agreement or verify the essays’ historical claims."},{"id":"analysis-v1","title":"Second Renaissance thread: thinking-process trees · supplied text · 22 October 2026","description":"Supplied earlier analysis and presentation notes, based on a reported 32-post version of the thread. Its throughput and governance-capacity proposals are hypotheses for a bounded case. The later analysis broadens the programme and distinguishes local improvements from a durable change in institutional selection. The draft introductory forum post it contains was not sent."}],"views":{"current_reality":[{"id":"capability-selection","title":"Capability and coercive selection","summary":"Capability advantages under competition create pressure to adopt and reorganise; where concentration pays, power and dependence concentrate, and incumbents keep them.","nodes":["g2-r-c03","g2-r-c04","g2-r-c05","g2-r-c06","g2-r-c07","g2-r-c25","g2-r-c08","g2-r-c09","g2-r-c12","g2-r-c13","g2-r-c26","g2-r-c14","g2-r-u01","g2-r-u02","g2-r-u04"]},{"id":"identification","title":"Identification and institutional reproduction","summary":"A proposed spiritual root and the institutions people grow up in reinforce the motives and assumptions that make the present order seem inevitable.","nodes":["g2-r-h0","g2-r-c02","g2-r-c09","g2-r-c10","g2-r-c11","g2-r-c12","g2-r-u05"]},{"id":"paradox-of-success","title":"The paradox of success","summary":"Alternatives that grow meet demands that shift authority to management; members become customers, and the drift comes to seem realistic.","nodes":["g2-r-c14","g2-r-c06","g2-r-c07","g2-r-coordination","g2-r-c03","g2-r-c25","g2-r-centralisation","g2-r-load","g2-r-c09","g2-r-c17","g2-r-c11","g2-r-u03"]},{"id":"material-security","title":"Material disruption and security escalation","summary":"Material limits and growth incentives strain the ecology; scarcity sharpens competition, and threats and countermeasures feed each other.","nodes":["g2-r-c01","g2-r-c09","g2-r-c19","g2-r-c20","g2-r-c03","g2-r-c05","g2-r-c21","g2-r-c22","g2-r-u06","g2-r-u07","g2-r-u08"]},{"id":"ai-in-incentives","title":"AI inside the existing incentive system","summary":"Deployed by institutions that optimise for accumulation and control, AI can manipulate trust, expand extraction and compound catastrophic risk.","nodes":["g2-r-c23","g2-r-c24","g2-r-c19","g2-r-c22","g2-r-u06","g2-r-u08","g2-r-u09","g2-r-u10"]},{"id":"effects-and-goal","title":"Why these effects matter for the goal","summary":"Each problem can independently keep ethical insight from becoming a durable basis for collective life.","nodes":["g2-r-u11"]}],"conflict":[{"id":"k1","title":"Institutional strength and democratic integrity","summary":"A cooperative needs enough capacity to survive, but concentrating authority to get it erodes the member control that made it worth building.","nodes":["g2-c-k1-objective","g2-c-k1-viability","g2-c-k1-control","g2-c-k1-concentrate","g2-c-k1-distribute"]},{"id":"k2","title":"AI capability and resilient autonomy","summary":"A community may need AI to keep up with rivals who use it, yet its essential functions must keep working when AI, power or a provider fails.","nodes":["g2-c-objective","g2-c-capability","g2-c-continuity","g2-c-depend","g2-c-optional"]},{"id":"k3","title":"Unilateral protection and common security","summary":"Deterrence seems to demand more of a contested capability, while shared survival demands reciprocal limits on that same capability.","nodes":["g2-c-k3-objective","g2-c-k3-deterrence","g2-c-k3-deescalation","g2-c-k3-expand","g2-c-k3-restrain"]},{"id":"k4","title":"Present provision and ecological viability","summary":"Essential services seem to depend on growing material throughput, while ecological limits require constraining it.","nodes":["g2-c-k4-objective","g2-c-k4-provision","g2-c-k4-limits","g2-c-k4-throughput","g2-c-k4-constrain"]},{"id":"k5","title":"Controlled engagement and trustworthy relationships","summary":"A service needs funding to last, but engineering people’s attachment to secure it undermines the free choice that trust depends on.","nodes":["g2-c-k5-objective","g2-c-k5-continuity","g2-c-k5-care","g2-c-k5-engineer","g2-c-k5-free"]},{"id":"k6","title":"Success between institutions and integrity within","summary":"Surviving and gaining influence means building what the existing order rewards, but letting its pressures shape the institution erodes the values and relationships it exists for. Leif’s countercurrent’s paradox of success; it may lie behind four of the other five.","nodes":["g2-c-k6-objective","g2-c-k6-between","g2-c-k6-within","g2-c-k6-adapt","g2-c-k6-own"]}],"future_reality":[{"id":"reflection-to-coordination","title":"From reflection to democratic coordination","summary":"Critical inquiry and accessible conflict guidance, under trustworthy governance, build independent competence and lower the cost of conflict, so less authority has to move upward.","nodes":["g2-f-i01","g2-f-guidance","g2-f-i10","g2-f-e01","g2-f-e02","g2-f-e03","g2-f-benefit","g2-f-e05"]},{"id":"trust-capacity-selection","title":"Trust, useful capacity and institutional selection","summary":"Effective cooperation, trustworthy conduct and controllable capability let an institution keep its mission, be enacted elsewhere and be freely chosen.","nodes":["g2-f-i03","g2-f-i06","g2-f-i07","g2-f-i11","g2-f-e06","g2-f-e07","g2-f-e09","g2-f-e10","g2-f-e11","g2-f-e12","g2-f-e13","g2-f-e14"]},{"id":"energy-materials","title":"Energy and material capability","summary":"AI-assisted research helps only if results survive physical tests and deployment; planned simplification is the alternative route, and rebound and delay are the risks.","nodes":["g2-f-i08","g2-f-e15","g2-f-e16","g2-f-a02","g2-f-n07","g2-f-n12","g2-f-n07-remedy","g2-f-n12-remedy"]},{"id":"adaptation-field-learning","title":"Optional model adaptation and field learning","summary":"Adapting models and bringing an AI voice into real discussions are optional branches with their own tests, and their own risk of a new orthodoxy.","nodes":["g2-f-i04","g2-f-i05","g2-f-e08","g2-f-n09","g2-f-n09-remedy"]},{"id":"common-security","title":"Common security requires implementation","summary":"A better discussion cannot by itself change weapons or state behaviour; empowered actors must implement and verify reciprocal limits.","nodes":["g2-f-i09","g2-f-e17","g2-f-e18","g2-f-a03","g2-f-a04","g2-f-a04-effect","g2-f-n13","g2-f-n13-remedy"]},{"id":"risks-inquiry-guidance","title":"Risks around inquiry and conflict guidance","summary":"Each risk is paired with the remedy that must work in practice before relying on the change.","nodes":["g2-f-n01","g2-f-n02","g2-f-harm","g2-f-n04","g2-f-n01-remedy","g2-f-n02-remedy","g2-f-protections","g2-f-n04-remedy"]},{"id":"risks-dependency-capture-cost","title":"Risks of dependency, capture and cost","summary":"Local capability can hide dependency, crowd out essentials, empower new gatekeepers or arrive too early or without governance.","nodes":["g2-f-n05","g2-f-n06","g2-f-n08","g2-f-n14","g2-f-n15","g2-f-n05-remedy","g2-f-n06-remedy","g2-f-n08-remedy","g2-f-n14-remedy","g2-f-n15-remedy"]},{"id":"risks-growth-replication","title":"Risks of growth and replication","summary":"Copying without people fails, and growth can repeat the old pattern of assimilation.","nodes":["g2-f-n10","g2-f-n11","g2-f-n10-remedy","g2-f-n11-remedy"]},{"id":"alternatives","title":"Alternative and contested proposals","summary":"Proposals in the thread that are not agreed changes: some are alternative routes, one is a precaution and one is a contested precondition.","nodes":["g2-f-a01","g2-f-a02","g2-f-a03","g2-f-a04","g2-f-a04-effect","g2-f-a05","g2-f-a05-counter","g2-f-a06"]},{"id":"reaching-the-goal","title":"How the changes reach the goal","summary":"Four lines of change must hold together, at the relevant scale, for the goal to be reached; global sufficiency is not established.","nodes":["g2-f-goal"]}],"prerequisite":[{"id":"shared-foundations","title":"Shared foundations","summary":"Choose the case first; then inventory assets, agree measures, settle rights and commit resources, which can proceed in parallel.","nodes":["g2-p-case","g2-p-gap","g2-p-p02","g2-p-p02-obstacle","g2-p-protocol","g2-p-p03-obstacle","g2-p-p04","g2-p-p04-obstacle","g2-p-p05","g2-p-p05-obstacle","g2-p-p06","g2-p-p06-obstacle","g2-p-p11","g2-p-p11-obstacle"]},{"id":"field-practice","title":"Field practice and continuing operation","summary":"Whichever practice is chosen must be ready and authorised before a bounded comparison; only a review that could reject it supports continuing.","nodes":["g2-p-p06","g2-p-p06-obstacle","g2-p-p07","g2-p-p07-obstacle","g2-p-p19","g2-p-p19-obstacle","g2-p-trial","g2-p-p08-obstacle","g2-p-p09","g2-p-p09-obstacle","g2-p-p10","g2-p-p10-obstacle"]},{"id":"local-capability","title":"Local capability and practical autonomy","summary":"Autonomy means a useful service at whole cost with tested fallback, not owning hardware.","nodes":["g2-p-p11","g2-p-p11-obstacle","g2-p-p12","g2-p-p12-obstacle","g2-p-p13","g2-p-p13-obstacle","g2-p-p14","g2-p-p14-obstacle","g2-p-p15","g2-p-p15-obstacle"]},{"id":"adaptation-voice","title":"Model adaptation and voice learning","summary":"Adapting a model and adding an AI voice have separate prerequisites; neither is required for the other.","nodes":["g2-p-p16","g2-p-p16-obstacle","g2-p-p17","g2-p-p17-obstacle","g2-p-p18","g2-p-p18-obstacle","g2-p-p19","g2-p-p19-obstacle","g2-p-p20","g2-p-p20-obstacle"]},{"id":"federation","title":"Federation with member control","summary":"A network that runs is not yet a network that adds value or disperses power.","nodes":["g2-p-p21","g2-p-p21-obstacle","g2-p-p22","g2-p-p22-obstacle","g2-p-p23","g2-p-p23-obstacle","g2-p-p24","g2-p-p24-obstacle"]},{"id":"energy-services","title":"Useful energy and material services","summary":"Physical evidence, then production and ownership, then a reliable service within limits; a mature existing option can satisfy the first step.","nodes":["g2-p-p25","g2-p-p25-obstacle","g2-p-p26","g2-p-p26-obstacle","g2-p-p27","g2-p-p27-obstacle","g2-p-p28","g2-p-p28-obstacle"]},{"id":"replication","title":"Independent replication without mission loss","summary":"Another community needs more than a document: people, resources, governance and an honest account of failures.","nodes":["g2-p-p29","g2-p-p29-obstacle","g2-p-p30","g2-p-p30-obstacle","g2-p-p31","g2-p-p31-obstacle","g2-p-p32","g2-p-p32-obstacle"]},{"id":"security","title":"Security proposals and actual institutional effects","summary":"Dialogue quality and security outcomes are separate endpoints; only empowered actors can implement reciprocal limits.","nodes":["g2-p-p33","g2-p-p33-obstacle","g2-p-p34","g2-p-p34-obstacle","g2-p-p35","g2-p-p35-obstacle","g2-p-p36","g2-p-p36-obstacle"]}],"transition":[{"id":"step-1","title":"Choose a host and one function","summary":"Proposed role: Proposed host and research lead. Nobody is assigned.","nodes":["g2-t-a1-condition","g2-t-select","g2-t-case"]},{"id":"step-2","title":"Check each obstacle at the host","summary":"Proposed role: Host representatives and operators. Nobody is assigned.","nodes":["g2-t-a2-condition","g2-t-a2-action","g2-t-a2-effect"]},{"id":"step-3","title":"Agree measures, protections and authority","summary":"Proposed role: Participants, facilitator and an independent reviewer. Nobody is assigned.","nodes":["g2-t-a3-condition","g2-t-a3-action","g2-t-a3-effect"]},{"id":"step-4","title":"Commit resources and check the tool","summary":"Proposed role: Host sponsor, facilitator and technical maintainer. Nobody is assigned.","nodes":["g2-t-a4-condition","g2-t-a4-action","g2-t-a4-effect"]},{"id":"step-5","title":"Run the bounded comparison","summary":"Proposed role: Trial operators and an independent reviewer. Nobody is assigned.","nodes":["g2-t-a5-condition","g2-t-a5-action","g2-t-a5-effect"]},{"id":"step-6","title":"Establish continuing operation","summary":"Proposed role: Host and service maintainer. Nobody is assigned.","nodes":["g2-t-a6-condition","g2-t-a6-action","g2-t-a6-effect"]},{"id":"step-7","title":"Support an independent site","summary":"Proposed role: Originating and receiving groups. Nobody is assigned.","nodes":["g2-t-a7-condition","g2-t-a7-action","g2-t-a7-effect"]},{"id":"step-8","title":"Review success and power separately","summary":"Proposed role: Member representatives and independent evaluators. Nobody is assigned.","nodes":["g2-t-a8-condition","g2-t-a8-action","g2-t-a8-effect"]}]},"overview":[{"type":"cards","eyebrow":"A place to begin","title":"What has to be true","text":"The analysis names six success factors for the goal: a liveable future, reflective agency, useful capabilities, trustworthy institutions, keeping the mission while spreading, and learning without a metaphysical test. These are candidate starting points for review.","ids":["g2-g-future","g2-g-g2","g2-g-capability","g2-g-control","g2-g-g5","g2-g-g6"],"link":["goal.html","The goal and its six success factors →"]},{"type":"spine","eyebrow":"One path through the reasoning","title":"From a problem to a first action","text":"Each row is a published connection, or a reference from one question to another: a problem, the conflict behind it, a change meant to address both, the effects it should have on the way to the goal, and the step and action that would put it into practice.","hops":[{"from":"g2-f-guidance","to":"g2-r-u03","via":"addresses"},{"from":"g2-f-guidance","to":"g2-c-k1-concentrate","via":"derived_from"},{"from":"g2-f-guidance","to":"g2-f-e05","via":"path"},{"from":"g2-f-e05","to":"g2-f-e14","via":"path"},{"from":"g2-f-e14","to":"g2-f-goal","via":"path"},{"from":"g2-f-goal","to":"g2-g-goal","via":"implements"},{"from":"g2-p-p07","to":"g2-f-guidance","via":"implements"},{"from":"g2-t-a4-action","to":"g2-p-p07","via":"implements"}]},{"type":"clouds","eyebrow":"Pulling apart · 6 conflicts","title":"Where needs pull two ways","text":"The analysis finds five conflicts in the discussion, and Leif’s countercurrent’s paradox of success adds a sixth that may lie behind four of them. The first sits behind the problem of central intervention: a cooperative needs enough capacity to survive, but concentrating authority to get it erodes the member control that made it worth building.","featured":"k1"},{"type":"cards","eyebrow":"A possible change","title":"Try conflict guidance that members can question and leave","text":"The proposal is to test useful guidance while members retain control, access to human help and competence without the tool. It is one candidate way through the first conflict: if members can work through disagreements themselves, less authority needs to move upward. Each of the analysis’s fifteen risks comes with a remedy like the one beside it.","ids":["g2-f-guidance","g2-f-protections"],"link":["change.html#view-reflection-to-coordination","The changes, their effects and their risks →"]},{"type":"cards","eyebrow":"The question to test","title":"What would change our minds?","text":"Do destructive conflict costs and unnecessary escalation fall, while fair treatment, independent competence and member influence remain? Fewer complaints or higher satisfaction would not settle it: costs may have moved elsewhere, or justified grievances may have been suppressed. A local success would still leave open whether small democratic groups gain enough to change which institutions survive.","ids":["g2-f-benefit","g2-f-harm"],"link":["items.html#g2-f-rel-f05","Inspect the test and what remains open →"]},{"type":"cards","eyebrow":"First step · Unassigned","title":"Choose one willing host and one function","text":"No trial is recorded here. The first task is to establish a bounded case and check what already operates; measures, protections, responsibilities and resources follow, agreed with the people affected. A missing detail in an analysis does not prove that a host lacks it.","ids":["g2-t-select","g2-p-case"],"link":["actions.html","All eight proposed actions →"]},{"type":"wider","eyebrow":"The wider picture","title":"One entry point into a broader programme","text":"The map also covers reflective development, trustworthy governance, model adaptation, voice participation, federation, material and energy services, and common security, each with its own risks, first steps and tests. Conflict guidance is one possible starting point; no single global constraint has been established."},{"type":"credits","eyebrow":"People","title":"Whose ideas these are","text":"Each statement and connection credits the forum posts or essays it draws on. Open any statement to follow the links to the posts themselves."}],"retired":[{"id":"g2-f-rel-benefit","release_id":"2026-10-23.1","text":"Conflict guidance and its protections together contribute to lower conflict costs and less needless hierarchy.","note":"Replaced by the analysis’s chain of effects from guidance to coordination."}]}</script>

<script>

      D.people.map(function (x) { return '<div><dt>' + esc(x.name) + '</dt><dd>' + esc(x.role) + '.</dd></div>'; }).join('') +

        h += '<p class="sub-note">The shortest chain of recorded connections. Every effect on it is a prediction.</p><ol class="route">' + route.map(function (lid) {
          var l = M.links[lid], others;
          var prev = route.indexOf(lid) === 0 ? p.change : M.links[route[route.indexOf(lid) - 1]].to;
          others = l.from.filter(function (f) { return f !== prev; });
          return '<li>' + (others.length ? '<div class="with"><span class="with-h">Together with</span>' + others.map(function (o) { return card(o, { small: true }); }).join('') + '</div>' : '') + relButton(lid) + card(l.to, { small: true }) + '</li>';
        }).join('') + '</ol>';
        var anchor = route.length ? M.links[route[route.length - 1]].to : null;
        if (anchor) h += '<p class="sub-note">The last effect ' + RC.XREF.implements.fwd + ' the goal at stop 1.</p>';
      }
      h += '</details>';
      var risks = RC.risksOf(M, p.change);
      h += '<details class="sub-block"' + (st.expand.risks ? ' open' : '') + ' data-keep="risks"><summary class="sub-h">' + (risks.length ? plural(risks.length, 'predicted risk') + ' of this change' : 'No risk is recorded for this change') + '</summary>' +
        (risks.length ? '<ul class="risks">' + risks.map(function (r) {
          return '<li>' + relButton(r.link) + card(r.risk, { small: true }) + (r.remedies.length ? r.remedies.map(function (rl) { return '<div class="remedy">' + M.links[rl].from.map(function (f) { return card(f, { small: true }); }).join('') + relButton(rl) + '</div>'; }).join('') : '<p class="sub-note">No remedy is recorded for this risk.</p>') + '</li>';
        }).join('') + '</ul>' : '') + '</details>';
    } else h += '<p class="empty">No change is recorded as meant to address this problem.</p>';
    h += '</li>';

    // join change - step
    h += '<li class="join"><span class="join-line" aria-hidden="true"></span><p><span class="join-arrow" aria-hidden="true">↑</span> The step below <strong>' + RC.XREF.implements.fwd + '</strong> this change. <span class="join-kind">A reference between two questions, recorded on the step.</span></p></li>';

    // 4 step
    h += '<li class="stop"><p class="stop-q"><span class="num">4</span>What has to happen first?</p>';
    if (p.step) {
      h += card(p.step, { full: true, big: true });
      h += swap('step', RC.stepsFor(M, p.change), p.step, 'step', function (n) { return plural(n, 'first step') + ' ' + (n === 1 ? 'puts' : 'put') + ' this change into practice.'; });
      var over = M.out[p.step].filter(function (i) { return M.links[i].relation === 'overcomes'; });
      h += '<div class="sub-block"><p class="sub-h">' + (over.length ? 'The obstacle it gets past' : 'No obstacle is recorded for this step') + '</p>' + over.map(function (i) { return relButton(i) + card(M.links[i].to, { small: true }); }).join('') + '</div>';
      var needs = M.inc[p.step].filter(function (i) { return M.links[i].relation === 'necessary_for'; });
      h += '<div class="sub-block"><p class="sub-h">' + (needs.length ? 'What it needs first' : 'Nothing is recorded as needed before this step') + '</p>' + needs.map(function (i) {
        var l = M.links[i];
        return '<div class="grp' + (RC.isJoint(l) ? ' grp-joint' : '') + '">' + jointNote(l) + '<div class="grp-nodes">' + l.from.map(function (f) { return card(f, { small: true }); }).join('') + '</div>' + relButton(i) + '</div>';
      }).join('') + '</div>';
      var chk = M.backlog[p.step] || [];
      if (chk.length) h += '<div class="sub-block"><p class="sub-h">Open on this step</p><ul class="oq-mini">' + chk.map(function (b) { return '<li><span class="oq-w">' + esc(RC.WORK[b.work] || b.work) + '</span>' + esc(b.label) + '</li>'; }).join('') + '</ul></div>';
    } else h += '<p class="empty">No first step is recorded for this change. That gap is part of the record.</p>';
    h += '</li>';

    // join step - action
    h += '<li class="join"><span class="join-line" aria-hidden="true"></span><p><span class="join-arrow" aria-hidden="true">↑</span> The action below <strong>' + RC.XREF.implements.fwd + '</strong> this step. <span class="join-kind">A reference between two questions, recorded on the action.</span></p></li>';

    // 5 action
    h += '<li class="stop"><p class="stop-q"><span class="num">5</span>Who does what?</p>';
    if (p.action) {
      var a = M.nodes[p.action];
      h += card(p.action, { full: true, big: true });
      h += swap('action', RC.actionsFor(M, p.step), p.action, 'action', function (n) { return plural(n, 'action') + ' ' + (n === 1 ? 'puts' : 'put') + ' this step into practice.'; });
      h += '<div class="who"><p class="who-h">Who</p><p class="who-v">Unassigned</p><p class="who-n">' + (a.proposed_role ? 'The record suggests a role: <strong>' + esc(a.proposed_role) + '</strong>. That is a suggestion, not a commitment by anyone.' : 'No role is suggested.') + ' No owner, date or resource is recorded.</p></div>';
      M.out[p.action].forEach(function (i) {
        var l = M.links[i], others = l.from.filter(function (f) { return f !== p.action; });
        h += '<div class="sub-block"><p class="sub-h">What it starts from, and what it is meant to produce</p>' + (others.length ? '<div class="with"><span class="with-h">Together with</span>' + others.map(function (o) { return card(o, { small: true }); }).join('') + '</div>' : '') + relButton(i) + card(l.to, { small: true }) + '</div>';
      });
    } else h += '<p class="empty">No action is recorded for this step. Nobody is assigned, and nothing here says who should be.</p>' + (p.step ? '' : '');
    h += '</li></ol>';
    h += '<aside class="next"><h2>Where next</h2><ul><li><a href="#open">See the ' + S.open + ' open questions</a> and pick one to check.</li><li><a href="' + hashFor('focus', p.change || p.problem) + '">Trace this change</a> to everything it is connected to.</li><li>Select a card, then draft a note on it. Notes stay in this browser.</li></ul></aside>';
    return h;
  }

  // Incoming connections of a statement, each as one group so joint sources stay one connection.
  function incoming(id, seen, depth) {
    var links = M.inc[id];
    if (!links.length) return '<p class="empty">Nothing is recorded as leading to this. It is a starting point of this part of the map.</p>';
    return '<ul class="grps">' + links.map(function (lid) {
      var l = M.links[lid];
      return '<li class="grp' + (RC.isJoint(l) ? ' grp-joint' : '') + '">' + jointNote(l) + '<div class="grp-nodes">' + l.from.map(function (f) {
        var key = 'why-' + seen.concat([id, f]).join('>'), looped = seen.indexOf(f) >= 0 || f === id, has = M.inc[f].length;
        var open = !!st.expand[key];
        return '<div class="src-node">' + card(f, { focus: true, small: depth > 0 }) +
          (looped ? '<p class="loop-note"><span aria-hidden="true">↺</span> This is already on the chain above: a loop in the record.</p>' :
            has ? '<button type="button" class="why" aria-expanded="' + open + '" data-toggle="' + esc(key) + '">' + (open ? 'Hide' : 'Why?') + ' <span class="why-n">' + plural(has, 'connection') + ' lead' + (has === 1 ? 's' : '') + ' here</span></button>' + (open ? '<div class="nest">' + incoming(f, seen.concat([id]), depth + 1) + '</div>' : '') :
              '<p class="root-note">Nothing is recorded behind this.</p>') + '</div>';
      }).join('') + '</div>' + relButton(lid) + '</li>';
    }).join('') + '</ul>';
  }

  function viewFocus() {
    var id = st.arg, n = M.nodes[id];
    if (!n) return '<header class="vh"><h1 tabindex="-1">That statement is not in this release</h1><p class="lede">The link may come from an earlier release. <a href="#start">Go to the start</a>.</p></header>';
    var T = RC.tree(n.tree);
    var h = '<header class="vh"><p class="eyebrow"><a href="' + hashFor('q', T.slug) + '">' + esc(T.q) + '</a></p><h1 tabindex="-1" class="h-quiet">Tracing one statement</h1>';
    if (st.trail.length > 1) h += '<nav class="trail" aria-label="Statements you came through"><span>You came through</span><ol>' + st.trail.slice(-5, -1).map(function (t) { return '<li><a href="' + hashFor('focus', t) + '">' + esc(M.nodes[t].label) + '</a></li>'; }).join('') + '</ol></nav>';
    h += '</header>';
    h += '<section class="dir" aria-labelledby="in-h"><h2 id="in-h">What leads to this</h2><p class="sub">Each group is one connection. Arrows always point from what comes first to what follows.</p>' + incoming(id, [], 0) + '</section>';
    h += '<section class="focus-card" aria-label="The statement in focus">' + card(id, { full: true, big: true }) + '<p class="claim-type">' + esc(RC.claimType(n)) + ' · ' + esc(standingWord(n)) + ' · accepted by ' + ((n.accepted_by || []).length ? esc(n.accepted_by.join(', ')) : 'nobody yet') + '</p></section>';
    var outs = M.out[id];
    h += '<section class="dir" aria-labelledby="out-h"><h2 id="out-h">What this leads to</h2>' + (outs.length ? '<ul class="grps">' + outs.map(function (lid) {
      var l = M.links[lid], others = l.from.filter(function (f) { return f !== id; });
      return '<li class="grp' + (RC.isJoint(l) ? ' grp-joint' : '') + '">' + (others.length ? jointNote(l) + '<div class="with"><span class="with-h">Together with</span>' + others.map(function (o) { return card(o, { focus: true, small: true }); }).join('') + '</div>' : '') + relButton(lid) + card(l.to, { focus: true }) + '</li>';
    }).join('') + '</ul>' : '<p class="empty">Nothing is recorded as following from this within this question.</p>') + '</section>';

    var xo = M.xout[id], xi = M.xin[id];
    if (xo.length || xi.length) {
      h += '<section class="dir" aria-labelledby="x-h"><h2 id="x-h">Across the six questions</h2><p class="sub">References from a statement under one question to a statement under another.</p>';
      Object.keys(RC.XREF).forEach(function (via) {
        var o = xo.filter(function (x) { return x.via === via; }), i = xi.filter(function (x) { return x.via === via; });
        function xg(head, ids, key) {
          var cards = '<div class="minis">' + ids.map(function (c) { return card(c, { focus: true, small: true }); }).join('') + '</div>';
          return ids.length > 4 ? '<details class="xgroup"' + (st.expand[key] ? ' open' : '') + ' data-keep="' + key + '"><summary class="sub-h">' + head + ' · ' + plural(ids.length, 'statement') + '</summary>' + cards + '</details>' : '<div class="xgroup"><p class="sub-h">' + head + '</p>' + cards + '</div>';
        }
        if (o.length) h += xg(RC.XREF[via].head, o.map(function (x) { return x.to; }), 'xo-' + via);
        if (i.length) h += xg(RC.XREF[via].back, i.map(function (x) { return x.from; }), 'xi-' + via);
      });
      h += '</section>';
    }
    return h;
  }

  function cloud(v) {
    var ids = v.nodes, links = D.trees.conflict.links.filter(function (l) { return ids.indexOf(l.to) >= 0 && l.from.every(function (f) { return ids.indexOf(f) >= 0; }); });
    var obj = ids.filter(function (i) { return M.nodes[i].kind === 'objective'; })[0];
    var clash = links.filter(function (l) { return l.relation === 'conflicts_with'; })[0];
    var needs = links.filter(function (l) { return l.relation === 'necessary_for' && l.to === obj; });
    var h = '<div class="cloud">' + (obj ? '<div class="cloud-obj"><p class="sub-h">Both sides want</p>' + card(obj) + '</div>' : '') + '<div class="cloud-sides">';
    needs.forEach(function (nl, k) {
      var need = nl.from[0], pos = links.filter(function (l) { return l.relation === 'necessary_for' && l.to === need; });
      h += '<div class="cloud-side"><p class="sub-h">Side ' + 'AB'.charAt(k) + '</p>' + pos.map(function (pl) { return card(pl.from[0]) + relButton(pl.id); }).join('') + card(need) + relButton(nl.id) + '</div>';
    });
    h += '</div>' + (clash ? '<div class="cloud-clash"><span aria-hidden="true">⇄</span> The two positions are recorded as conflicting. ' + '<button type="button" class="linklike" data-sel="' + clash.id + '">Inspect the conflict</button></div>' : '') + '</div>';
    return h;
  }

  function viewQuestion() {
    var T = RC.tree(st.arg) || RC.TREES[0], t = D.trees[T.key], parts = (D.views || {})[T.key] || [];
    var kinds = {};
    t.nodes.forEach(function (n) { var k = RC.kindLabel(M.nodes[n.id]); kinds[k] = (kinds[k] || 0) + 1; });
    var h = '<header class="vh"><p class="eyebrow">Question ' + (RC.TREES.indexOf(T) + 1) + ' of 6 · ' + esc(T.formal) + '</p><h1 tabindex="-1">' + esc(T.q) + '</h1>' +
      '<p class="lede">' + Object.keys(kinds).map(function (k) { return k === 'Already true' ? kinds[k] + ' already true' : plural(kinds[k], k.toLowerCase()); }).join(', ') + '. ' + plural(t.links.length, 'connection') + '. Select a statement to inspect it, then trace it.</p></header>';
    if (T.key === 'goal') {
      var gn = RC.goalNode(M);
      h += '<section class="part">' + card(gn.id, { full: true, big: true }) + '<p class="sub-h">Needed for it</p><ul class="outline">' + M.inc[gn.id].map(function (lid) {
        return M.links[lid].from.map(function (f) {
          return '<li>' + card(f) + (M.inc[f].length ? '<ul class="outline">' + M.inc[f].map(function (l2) { return M.links[l2].from.map(function (g2) { return '<li>' + card(g2, { small: true }) + '</li>'; }).join(''); }).join('') + '</ul>' : '') + '</li>';
        }).join('');
      }).join('') + '</ul></section>';
    } else if (T.key === 'conflict') {
      parts.forEach(function (v) { h += '<section class="part"><h2>' + esc(v.title) + '</h2><p class="sub">' + esc(v.summary) + '</p>' + cloud(v) + '</section>'; });
    } else {
      parts.forEach(function (v, i) {
        h += '<section class="part"><p class="eyebrow">Part ' + (i + 1) + ' of ' + parts.length + '</p><h2>' + esc(v.title) + '</h2><p class="sub">' + esc(v.summary) + '</p><div class="list">' + v.nodes.map(function (id) { return card(id); }).join('') + '</div></section>';
      });
      var placed = {}; parts.forEach(function (v) { v.nodes.forEach(function (i) { placed[i] = 1; }); });
      var loose = t.nodes.filter(function (n) { return !placed[n.id]; });
      if (loose.length) h += '<section class="part"><h2>Not placed in a part</h2><div class="list">' + loose.map(function (n) { return card(n.id); }).join('') + '</div></section>';
    }
    return h;
  }

  function refLine(id) {
    var x = RC.item(M, id);
    if (!x) return esc(id);
    if (!x.isLink) return '“' + esc(x.label) + '”';
    return x.from.map(function (f) { return '“' + esc(M.nodes[f].label) + '”'; }).join(' + ') + ' <em>' + esc(RC.relPhrase(x)) + '</em> “' + esc(M.nodes[x.to].label) + '”';
  }

  function viewOpen() {
    var all = [];
    Object.keys(M.backlog).forEach(function (r) { M.backlog[r].forEach(function (b) { all.push(b); }); });
    var works = {}; all.forEach(function (b) { var w = RC.WORK[b.work] || b.work; works[w] = (works[w] || 0) + 1; });
    var list = all.filter(function (b) { return (st.openWork === 'all' || (RC.WORK[b.work] || b.work) === st.openWork) && (st.openTree === 'all' || b.tree === st.openTree); });
    var h = '<header class="vh"><p class="eyebrow">Unsettled, by the record’s own account</p><h1 tabindex="-1">Open questions</h1><p class="lede">' + all.length + ' questions, each tied to one statement or one connection. They are the most useful places to add something.</p></header>';
    h += '<div class="filters" role="group" aria-label="Kind of work"><button type="button" class="chip' + (st.openWork === 'all' ? ' on' : '') + '" aria-pressed="' + (st.openWork === 'all') + '" data-ow="all">All ' + all.length + '</button>' + Object.keys(works).map(function (w) { return '<button type="button" class="chip' + (st.openWork === w ? ' on' : '') + '" aria-pressed="' + (st.openWork === w) + '" data-ow="' + esc(w) + '">' + esc(w) + ' ' + works[w] + '</button>'; }).join('') + '</div>';
    h += '<div class="filters" role="group" aria-label="Question"><button type="button" class="chip' + (st.openTree === 'all' ? ' on' : '') + '" aria-pressed="' + (st.openTree === 'all') + '" data-ot="all">Any question</button>' + RC.TREES.map(function (T) { return '<button type="button" class="chip' + (st.openTree === T.key ? ' on' : '') + '" aria-pressed="' + (st.openTree === T.key) + '" data-ot="' + T.key + '">' + esc(T.short) + ' ' + D.trees[T.key].backlog.length + '</button>'; }).join('') + '</div>';
    h += list.length ? '<ul class="oq">' + list.map(function (b) {
      var x = RC.item(M, b.ref);
      return '<li><p class="oq-w">' + esc(RC.WORK[b.work] || b.work) + ' · ' + esc(RC.tree(b.tree).short) + '</p><p class="oq-l">' + esc(b.label) + '</p>' + (b.note ? '<p class="oq-n">' + esc(b.note) + '</p>' : '') +
        '<p class="oq-on">About the ' + (x && x.isLink ? 'connection' : 'statement') + ': ' + refLine(b.ref) + '</p><p class="oq-a"><button type="button" class="btn" data-sel="' + b.ref + '" data-id="' + b.ref + '">Inspect it</button> <button type="button" class="btn" data-sel="' + b.ref + '" data-note="1">Draft a note on it</button></p></li>';
    }).join('') + '</ul>' : '<p class="empty">No open question matches these filters.</p>';
    return h;
  }

  function noteText(n) {
    var x = RC.item(M, n.ref);
    return 'Draft contribution (not submitted)\nRecord: ' + D.title + ', release ' + D.release_id + '\nAbout the ' + (x && x.isLink ? 'connection' : 'statement') + ' ' + n.ref + ': ' + (x ? (x.isLink ? x.from.join(' + ') + ' ' + x.relation + ' ' + x.to : '"' + x.text + '"') : '(not in this release)') + '\nType: ' + n.type + '\n\n' + n.text;
  }
  function noteItem(n) {
    return '<li class="note"><p class="oq-w">' + esc(n.type) + ' · local draft · ' + esc(n.at) + '</p><p class="note-t">' + esc(n.text) + '</p><p class="oq-on">About: ' + refLine(n.ref) + '</p>' +
      '<p class="oq-a"><button type="button" class="btn" data-copy="' + n.id + '">Copy with its reference</button> <button type="button" class="btn" data-sel="' + n.ref + '">Inspect what it is about</button> <button type="button" class="btn btn-quiet" data-del="' + n.id + '">Delete</button></p></li>';
  }
  function viewNotes() {
    return '<header class="vh"><p class="eyebrow">Only in this browser</p><h1 tabindex="-1">Your draft notes</h1><p class="lede">This release is read-only. Notes you draft here are stored in this browser and nowhere else. Nothing has been submitted, reviewed or accepted. Copy a note to take it to the group.</p></header>' +
      (st.notes.length ? '<ul class="oq">' + st.notes.map(noteItem).join('') + '</ul>' : '<p class="empty">No notes yet. Select any statement or connection and choose “Draft a note”.</p>');
  }

  // ---------- inspector
  function sourceList(refs) {
    if (!refs || !refs.length) return '<p class="empty">No source is recorded.</p>';
    var forum = D.sources.filter(function (s) { return s.posts; })[0];
    return '<ul class="refs">' + refs.map(function (r) {
      var s = D.sources.filter(function (x) { return x.id === r.source_id; })[0] || { title: r.source_id }, where;
      if (r.post != null) {
        var post = forum && forum.posts[String(r.post)], who = r.author && D.authors[r.author] ? D.authors[r.author].name : 'Unknown author';
        where = '<a href="' + esc(s.url + '/' + r.post) + '" target="_blank" rel="noopener">' + esc(who) + ', post ' + r.post + '</a>' + (post && post.date ? ' · ' + day(post.date) : '');
      } else where = esc(s.title.split(' · ')[0]) + (r.locator ? ', ' + esc(r.locator) : '');
      return '<li class="ref ref-' + esc(r.basis) + '"><span class="ref-w">' + where + '</span><span class="ref-b">' + esc(RC.BASIS[r.basis] || r.basis) + '</span></li>';
    }).join('') + '</ul>';
  }
  function inspector() {
    var x = st.sel && RC.item(M, st.sel);
    if (!x) {
      return '<div class="insp-empty"><h2>Inspect</h2><p>Select any statement or connection to see its exact wording, who proposed it, who has accepted it, where it comes from and what is still open.</p>' +
        '<dl class="key"><dt><span class="sw sw-proposed"></span>Dashed edge</dt><dd>Proposed. In this release, everything.</dd><dt><span class="sw sw-accepted"></span>Solid edge</dt><dd>Accepted for now by a named person. None yet.</dd><dt><span class="sw sw-disputed"></span>Double edge</dt><dd>Disputed. None yet.</dd></dl>' +
        '<dl class="key">' + [['aim', 'An aim'], ['problem', 'A claim about what is wrong now'], ['change', 'A proposed change'], ['predict', 'A prediction, not observed'], ['risk', 'A predicted risk'], ['step', 'A condition to reach first'], ['action', 'A proposed action'], ['need', 'A need or position in a conflict'], ['now', 'Claimed to hold now']].map(function (k) { return '<dt><span class="gl gl-' + k[0] + '" aria-hidden="true">' + GLYPH[k[0]] + '</span></dt><dd>' + k[1] + '</dd>'; }).join('') + '</dl></div>';
    }
    var T = RC.tree(x.tree), h = '<div class="insp-head"><p class="eyebrow">' + (x.isLink ? 'Connection' : esc(RC.kindLabel(x))) + ' · ' + esc(T.q) + '</p><button type="button" class="close" data-close="1" aria-label="Close details">Close</button></div>';
    if (x.isLink) {
      h += '<div class="link-sent">' + x.from.map(function (f) { return card(f, { small: true }); }).join('') + '<p class="link-rel"><span aria-hidden="true">' + (x.relation === 'feeds_back_to' ? '↺' : '↓') + '</span> ' + esc(RC.relPhrase(x)) + '</p>' + card(x.to, { small: true }) + '</div>';
      h += jointNote(x);
      if (x.relation === 'feeds_back_to') h += '<p class="joint-note"><span aria-hidden="true">↺</span> This connection closes a loop: the effect feeds an earlier cause.</p>';
      h += '<p class="raw">Recorded as <span class="mono">' + esc(x.relation) + '</span>, from ' + plural(x.from.length, 'statement') + ' to 1.</p>';
    } else {
      h += '<blockquote class="canon"><p>' + esc(x.text) + '</p></blockquote>';
      if (x.label !== x.text) h += '<p class="raw">Above is the full wording in the record. Short form used on cards: “' + esc(x.label) + '”</p>';
      h += '<p class="claim-type">' + esc(RC.claimType(x)) + '</p>';
    }
    h += '<dl class="facts facts-tight"><div><dt>Standing</dt><dd><span class="standing standing-' + esc(x.status) + '">' + esc(RC.STANDING[x.status] || x.status) + '</span></dd></div>' +
      '<div><dt>Proposed by</dt><dd>' + esc((x.contributors || []).map(function (c) { return c.name + (c.role === 'assistant' ? ' (AI)' : ''); }).join(', ') || 'Not recorded') + '</dd></div>' +
      '<div><dt>Accepted by</dt><dd>' + ((x.accepted_by || []).length ? esc(x.accepted_by.map(function (a) { return a.name || a; }).join(', ')) : 'Nobody yet') + '</dd></div>' +
      (x.proposed_role ? '<div><dt>Who</dt><dd>Unassigned. Suggested role: ' + esc(x.proposed_role) + '</dd></div>' : '') + '</dl>';

    if (!x.isLink) {
      var onPath = RC.pathThrough(M, st.path, x.id);
      h += '<div class="asks"><a class="btn btn-primary" href="' + hashFor('focus', x.id) + '">Why? Trace it</a>' + (onPath ? '<button type="button" class="btn" data-onpath="' + x.id + '">Put it on the path</button>' : '') + '<button type="button" class="btn" data-note="1">Draft a note</button></div>';
    } else h += '<div class="asks"><a class="btn btn-primary" href="' + hashFor('focus', x.to, x.id) + '">Show it in context</a><button type="button" class="btn" data-note="1">Draft a note</button></div>';

    if (x.isLink) {
      h += '<section><h3>What it assumes</h3>' + ((x.assumptions || []).length ? '<ul class="assume">' + x.assumptions.map(function (a) { return '<li><p>' + esc(a.text) + '</p><p class="by">Recorded by ' + esc(a.by || 'unknown') + '</p></li>'; }).join('') + '</ul>' : '<p class="empty">No assumption is recorded for this connection.</p>') + '</section>';
    }
    var oq = M.backlog[x.id] || [];
    h += '<section><h3>What is open here</h3>' + (oq.length ? '<ul class="oq-mini">' + oq.map(function (b) { return '<li><span class="oq-w">' + esc(RC.WORK[b.work] || b.work) + '</span><strong>' + esc(b.label) + '</strong>' + (b.note ? '<span class="oq-n">' + esc(b.note) + '</span>' : '') + '</li>'; }).join('') + '</ul>' : '<p class="empty">No open question is recorded on this ' + (x.isLink ? 'connection' : 'statement') + '. That is not the same as it being settled.</p>') + '</section>';
    h += '<section><h3>Where it comes from</h3>' + sourceList(x.source_refs) + '<p class="by">A credit says where an idea comes from, not that its author agrees with this wording.</p></section>';

    if (!x.isLink) {
      var inc = M.inc[x.id], out = M.out[x.id];
      h += '<section><h3>Connections</h3>' + (inc.length + out.length ? '<ul class="conn">' + inc.map(function (i) { return '<li><button type="button" class="linklike" data-sel="' + i + '">' + refLine(i) + '</button></li>'; }).join('') + out.map(function (i) { return '<li><button type="button" class="linklike" data-sel="' + i + '">' + refLine(i) + '</button></li>'; }).join('') + '</ul>' : '<p class="empty">No connection is recorded.</p>') + '</section>';
      var parts = M.part[x.id] || [];
      if (parts.length) h += '<section><h3>Appears in</h3><p class="by">' + parts.map(function (p) { return '<a href="' + hashFor('q', RC.tree(p.tree).slug) + '">' + esc(p.title) + '</a>'; }).join(' · ') + '</p></section>';
    }
    var hist = M.history[x.id] || [];
    h += '<section><h3>History</h3>' + (hist.length ? '<ul class="hist-mini">' + hist.map(function (r) { return '<li><span class="mono">' + esc(r.release) + '</span> ' + esc(r.type) + (r.note ? ': ' + esc(r.note) : '') + '</li>'; }).join('') + '</ul>' : '<p class="empty">No change to this item is recorded in the release history.</p>') + '</section>';

    var mine = st.notes.filter(function (n) { return n.ref === x.id; });
    h += '<section id="note-sec"><h3>Your draft notes</h3><p class="by">Stored only in this browser. Not submitted to anyone.</p>' + (mine.length ? '<ul class="oq oq-tight">' + mine.map(noteItem).join('') + '</ul>' : '') +
      '<form id="note-form" class="note-form"><label for="note-type">Kind of note</label><select id="note-type">' + NOTE_TYPES.map(function (t) { return '<option>' + t + '</option>'; }).join('') + '</select>' +
      '<label for="note-text">Your note on this ' + (x.isLink ? 'connection' : 'statement') + '</label><textarea id="note-text" rows="4" placeholder="What did you see, doubt or want checked?"></textarea><button type="submit" class="btn">Save draft in this browser</button><p id="note-msg" class="by" role="status"></p></form></section>';
    h += '<p class="idline"><span class="mono">' + esc(x.id) + '</span> · release ' + esc(D.release_id) + '</p>';
    return h;
  }

  // ---------- rendering and routing
  function renderRail() {
    var cur = st.view === 'q' ? st.arg : null;
    function a(hash, label, on, n) { return '<li><a href="' + hash + '"' + (on ? ' aria-current="page"' : '') + '><span>' + label + '</span>' + (n != null ? '<span class="n">' + n + '</span>' : '') + '</a></li>'; }
    rail.innerHTML = '<ul>' + a('#start', 'Start', st.view === 'start') + a(pathHash(st.path), 'Follow the path', st.view === 'path') + '</ul><p class="rail-h">Six questions</p><ol>' +
      RC.TREES.map(function (T) { return a(hashFor('q', T.slug), esc(T.q), cur === T.slug, D.trees[T.key].nodes.length); }).join('') + '</ol><p class="rail-h">Work on it</p><ul>' +
      a('#open', 'Open questions', st.view === 'open', S.open) + a('#notes', 'Your draft notes', st.view === 'notes', st.notes.length) + '</ul>';
  }
  function renderMain(keepScroll) {
    var v = { start: viewStart, path: viewPath, focus: viewFocus, q: viewQuestion, open: viewOpen, notes: viewNotes }[st.view] || viewStart;
    main.innerHTML = v();
    renderRail();
    if (!keepScroll) { window.scrollTo(0, 0); var h1 = $('h1', main); if (h1 && st.ready) h1.focus({ preventScroll: true }); }
  }
  function renderInsp(openSheet) {
    insp.innerHTML = inspector();
    document.body.classList.toggle('insp-open', !!openSheet && !!st.sel);
    [].forEach.call(document.querySelectorAll('[data-id]'), function (el) { el.classList.toggle('sel', el.getAttribute('data-id') === st.sel); });
  }
  function select(id, opts) {
    st.sel = id; renderInsp(true);
    insp.scrollTop = 0;
    if (opts && opts.note) { var t = $('#note-text'); if (t) { t.scrollIntoView({ block: 'center' }); t.focus(); } }
    else if (window.matchMedia('(max-width: 1040px)').matches) { var c = $('.close', insp); if (c) c.focus(); }
  }
  function route(keep) {
    var parts = (location.hash || '#start').slice(1).split('--');
    var view = parts[0];
    if (view === 'path') {
      st.path = RC.normalizePath(M, { problem: parts[1], change: parts[2], step: parts[3], action: parts[4] });
      store.path = st.path; save();
    } else if (view === 'focus') {
      st.arg = parts[1];
      if (M.nodes[st.arg]) { if (st.trail[st.trail.length - 1] !== st.arg) st.trail.push(st.arg); st.sel = M.links[parts[2]] ? parts[2] : st.arg; }
    } else if (view === 'q') st.arg = parts[1];
    else if (['start', 'open', 'notes'].indexOf(view) < 0) view = 'start';
    st.view = view;
    document.body.classList.remove('insp-open');
    renderMain(!!keep); renderInsp(false);
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-go],[data-sel],[data-pick],[data-toggle],[data-ow],[data-ot],[data-close],[data-onpath],[data-note],[data-copy],[data-del]');
    if (!t) return;
    if (t.hasAttribute('data-go')) { location.hash = t.getAttribute('data-go'); return; }
    if (t.hasAttribute('data-pick')) {
      var p = Object.assign({}, st.path); p[t.getAttribute('data-pick')] = t.getAttribute('data-id');
      st.path = RC.normalizePath(M, p); st.expand['swap-' + t.getAttribute('data-pick')] = false;
      var hsh = pathHash(st.path);
      if (location.hash === hsh) renderMain(true); else { st.keep = true; location.hash = hsh; }
      return;
    }
    if (t.hasAttribute('data-toggle')) { var k = t.getAttribute('data-toggle'); st.expand[k] = !st.expand[k]; renderMain(true); var again = main.querySelector('[data-toggle="' + k.replace(/"/g, '') + '"]'); if (again) again.focus(); return; }
    if (t.hasAttribute('data-ow')) { st.openWork = t.getAttribute('data-ow'); renderMain(true); return; }
    if (t.hasAttribute('data-ot')) { st.openTree = t.getAttribute('data-ot'); renderMain(true); return; }
    if (t.hasAttribute('data-close')) { document.body.classList.remove('insp-open'); var back = st.sel && main.querySelector('[data-id="' + st.sel + '"]'); if (back) back.focus(); return; }
    if (t.hasAttribute('data-onpath')) { var np = RC.pathThrough(M, st.path, t.getAttribute('data-onpath')); if (np) location.hash = pathHash(np); return; }
    if (t.hasAttribute('data-copy')) {
      var n = st.notes.filter(function (x) { return x.id === t.getAttribute('data-copy'); })[0]; if (!n) return;
      var txt = noteText(n), done = function (ok) { t.textContent = ok ? 'Copied' : 'Copy failed. Select the text instead.'; };
      try { navigator.clipboard.writeText(txt).then(function () { done(true); }, function () { done(false); }); } catch (err) { done(false); }
      return;
    }
    if (t.hasAttribute('data-del')) { st.notes = st.notes.filter(function (x) { return x.id !== t.getAttribute('data-del'); }); store.notes = st.notes; save(); renderMain(true); renderInsp(document.body.classList.contains('insp-open')); return; }
    if (t.hasAttribute('data-sel')) { select(t.getAttribute('data-sel'), { note: t.hasAttribute('data-note') }); return; }
    if (t.hasAttribute('data-note')) { var ta = $('#note-text'); if (ta) { ta.scrollIntoView({ block: 'center' }); ta.focus(); } }
  });
  document.addEventListener('toggle', function (e) { var k = e.target.getAttribute && e.target.getAttribute('data-keep'); if (k) st.expand[k] = e.target.open; }, true);
  document.addEventListener('submit', function (e) {
    if (e.target.id !== 'note-form') return;
    e.preventDefault();
    var text = $('#note-text').value.trim(), msg = $('#note-msg');
    if (!text) { msg.textContent = 'Write the note first.'; return; }
    st.notes.unshift({ id: 'n' + Date.now().toString(36), ref: st.sel, type: $('#note-type').value, text: text, at: new Date().toISOString().slice(0, 10) });
    store.notes = st.notes; save(); renderInsp(document.body.classList.contains('insp-open')); renderRail();
    if (st.view === 'notes') renderMain(true);
    var m = $('#note-msg'); if (m) m.textContent = 'Saved as a local draft. It has not been sent to anyone.';
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && document.body.classList.contains('insp-open')) { var c = $('.close', insp); if (c) c.click(); } });

  // search
  var q = $('#q'), res = $('#q-res');
  function showResults() {
    var ids = RC.search(M, q.value, 10);
    if (q.value.trim().length < 2) { res.hidden = true; res.innerHTML = ''; return; }
    res.hidden = false;
    res.innerHTML = ids.length ? ids.map(function (id) { var n = M.nodes[id]; return '<li><a href="' + hashFor('focus', id) + '"><span class="st-kind"><span class="gl gl-' + RC.role(n) + '" aria-hidden="true">' + GLYPH[RC.role(n)] + '</span>' + esc(RC.kindLabel(n)) + ' · ' + esc(RC.tree(n.tree).short) + '</span>' + esc(n.label) + '</a></li>'; }).join('') : '<li class="empty">No statement matches. Try a word from the claim, a person’s name or a kind such as “obstacle”.</li>';
  }
  q.addEventListener('input', showResults);
  q.addEventListener('focus', showResults);
  document.addEventListener('click', function (e) { if (!e.target.closest('.search')) res.hidden = true; else if (e.target.closest('#q-res a')) { res.hidden = true; q.value = ''; } });

  // header standing line
  $('#standing').innerHTML = (S.proposed === S.total ? '<strong>Everything here is proposed.</strong> ' : '') + S.statements + ' statements and ' + S.connections + ' connections, written by an AI from the sources. ' + (S.acceptedByAnyone ? S.acceptedByAnyone + ' accepted by a named person.' : 'Nobody has accepted any of it.') + ' Read-only release ' + esc(D.release_id) + '.';

  window.addEventListener('hashchange', function () { var keep = st.keep; st.keep = false; route(keep); });
  route(); st.ready = true;
  window.RCApp = { M: M, st: st };
})();

</script>
</body>
</html>
