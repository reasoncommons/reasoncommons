  current_reality:
    nodes:
    - id: pa-r-replicators
      kind: observation
      text: 'Worldviews behave as cultural replicators: they last, spread by social learning from successful, prestigious and majority models, and stay faithful because they reward the behaviour that expresses them.'
      label: Worldviews spread and persist through what they reward.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: evolving-prosocial-ai
        locator: p. 8, Worldviews as Generators of Selection Pressures
        basis: paraphrase
      - source_id: evolving-prosocial-ai
        locator: pp. 11–12, Section 2
        basis: paraphrase
    - id: pa-r-partial
      kind: observation
      text: 'Human cooperation is a partial major evolutionary transition: competition within groups has been suppressed only as far as past and present environments selected for, with no finish line.'
      label: Human cooperation is a partial evolutionary transition.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: evolving-prosocial-ai
        locator: p. 5, Section 1
        basis: paraphrase
    - id: pa-r-machine
      kind: observation
      text: AI systems' observable behaviour embodies the worldviews behind their design, and in turn shapes what engineers build, what executives reward and what users expect.
      label: Machine behaviour carries and spreads worldviews.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: evolving-prosocial-ai
        locator: p. 9, machine behavior
        basis: paraphrase
      - source_id: evolving-prosocial-ai
        locator: p. 15, this recursive dynamic
        basis: paraphrase
    - id: pa-r-worldviews
      kind: cause
      text: 'Four extractive worldviews dominate AI development: technological determinism, hyper-individualism, market fundamentalism and anthropocentric dominance.'
      label: Four extractive worldviews dominate AI development.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: evolving-prosocial-ai
        locator: pp. 12–14, Extractive Worldviews
        basis: paraphrase
    - id: pa-r-mutual
      kind: cause
      text: The four extractive worldviews reinforce one another, each answering doubts the others raise, so leaving one in practice means rejecting all four.
      label: The worldviews shield one another from doubt.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: evolving-prosocial-ai
        locator: p. 15, The Self-Sustaining Relational Structure of Extractive Worldviews
        basis: paraphrase
    - id: pa-r-discount
      kind: cause
      text: People and organisations value immediate rewards over delayed and diffuse harms.
      label: Immediate rewards outweigh delayed harms.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: evolving-prosocial-ai
        locator: p. 14, Temporal Discounting
        basis: paraphrase
    - id: pa-r-rewards
      kind: cause
      text: 'Institutions reward engagement, quarterly profit and fast growth: engineers advance by optimising engagement, executives face earnings pressure and investors back scalable extraction.'
      label: Institutions reward engagement and short-term growth.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: evolving-prosocial-ai
        locator: p. 8, reinforcement contingencies in a technology company
        basis: paraphrase
      - source_id: evolving-prosocial-ai
        locator: p. 40, Misaligned Incentives Reward Extractive Behaviors
        basis: paraphrase
    - id: pa-r-power
      kind: cause
      text: Power concentrates in the few organisations that control foundation models and compute; they acquire alternatives, lobby against regulation and fund much of the research that evaluates them.
      label: Power concentrates; alternatives are bought or lobbied away.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: evolving-prosocial-ai
        locator: p. 24, Power Concentration
        basis: paraphrase
      - source_id: evolving-prosocial-ai
        locator: p. 40, Power Concentration and Academic Capture
        basis: paraphrase
    - id: pa-r-training
      kind: cause
      text: Education and professional training teach engagement optimisation and shareholder primacy as common sense, so each new cohort inherits extractive assumptions.
      label: Training teaches extraction as common sense.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: evolving-prosocial-ai
        locator: p. 40, Infrastructure and Cultural Reproduction
        basis: paraphrase
      - source_id: evolving-prosocial-ai
        locator: p. 47, worldview malleability has a half-life
        basis: related
    - id: pa-r-design
      kind: cause
      text: AI is built to capture attention and to complete tasks for people rather than to build their capabilities.
      label: AI is built to capture attention and do tasks for people.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: evolving-prosocial-ai
        locator: p. 9, extractive systems embed attention capture
        basis: paraphrase
      - source_id: evolving-prosocial-ai
        locator: p. 21, Section 3 Individual Level
        basis: reconstruction
    - id: pa-r-erode
      kind: undesirable_effect
      text: 'People''s competence, autonomy and relatedness erode: critical thinking declines with heavy AI use, choices are delegated to recommendation systems and chatbot companionship displaces human contact.'
      label: Competence, autonomy and relatedness erode.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: evolving-prosocial-ai
        locator: pp. 21–22, Competence, Autonomy and Relatedness Erosion
        basis: paraphrase
    - id: pa-r-dependence
      kind: cause
      text: People whose capabilities have eroded rely more on the systems eroding them and are less able to demand alternatives.
      label: Eroded users depend more and demand less.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: evolving-prosocial-ai
        locator: p. 22, The Vicious Cycle
        basis: paraphrase
    - id: pa-r-race
      kind: undesirable_effect
      text: Firms that externalise harm outcompete those that do not, and harms documented by internal research are shelved in favour of growth.
      label: Firms that externalise harm outgrow the rest.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: evolving-prosocial-ai
        locator: 'pp. 23–25, Organizational Level: Competitive Dynamics and Institutional Capture'
        basis: paraphrase
    - id: pa-r-uncompensated
      kind: undesirable_effect
      text: Data workers are poorly paid, and creators' work and the shared knowledge commons are used for training without fair return.
      label: Workers, creators and the knowledge commons go unpaid.
      status: proposed
      contributions: *id001
      source_refs:
