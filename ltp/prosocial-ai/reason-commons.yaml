schema_version: 1
project: Evolving Prosocial AI
driver: david
participants:
  david: David Joseph
active_tree: future_reality
import_context:
  recorded_on: '2026-10-26'
  basis: 'One supplied document: Paul Atkins and David Sloan Wilson, Evolving Prosocial AI: How We Shape the Systems that Shape AI - and Us, version of 28 June 2026, accepted for Cambridge Elements in Applied Evolutionary Science. An earlier draft of 6 March 2026, circulated on Substack, was also supplied; it is superseded and not cited.'
  standing: Every statement and connection is a proposed AI reconstruction. Approval to implement it (pai-commons revision 1) is not endorsement of the wording, topology or predictions by David or by the authors.
  scope: 'The book''s argument across six perspectives: AI that strengthens cooperation at four scales, with institutions that make cooperation pay; extractive worldviews, temporal discounting and the social trap as candidate causes; two dilemmas; the authors'' proposed changes with their own cautions as risks; prerequisites from the authors'' limits; and four illustrative steps.'
  attribution: Paul Atkins and David Sloan Wilson are the authors. The AI selected, paraphrased and connected the material and is responsible for this reconstruction. Findings the authors cite from other studies are kept as attributed observations, not checked here. Source credit is not contribution to or endorsement of the commons.
  limits: No group, trial, owner or observed outcome is established. Existing conditions in the action sequence are illustrative. The authors say integration across all levels awaits rigorous testing and that their examples skew Western and democratic.
trees:
  goal:
    nodes:
    - id: pa-g-goal
      kind: goal
      text: AI is designed, governed and used so that it strengthens cooperation and flourishing at the individual, organisational, societal and planetary scales, rather than extracting from them.
      label: AI strengthens cooperation and flourishing at every scale.
      status: proposed
      contributions: &id001
      - by: assistant
        attribution: assistant
        mode: text
      source_refs:
      - source_id: evolving-prosocial-ai
        locator: p. 9, Defining Prosocial AI
        basis: paraphrase
      - source_id: evolving-prosocial-ai
        locator: pp. 35–36, Alignment Across Scales
        basis: reconstruction
    - id: pa-g-people
      kind: critical_success_factor
      text: People's competence, autonomy and relatedness grow through their use of AI rather than wearing away.
      label: People's competence, autonomy and relatedness grow.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: evolving-prosocial-ai
        locator: 'p. 28, Individual Level: Capability Enhancement and Agency Preservation'
        basis: paraphrase
    - id: pa-g-commons
      kind: critical_success_factor
      text: 'Organisations that build AI treat it as a commons: those who contribute data, labour and creative work share in its benefits and have a real say in how it is run.'
      label: Those who build AI share its benefits and a say.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: evolving-prosocial-ai
        locator: 'pp. 30–32, Organizational Level: Commons Governance and Cooperative Ownership'
        basis: paraphrase
      - source_id: evolving-prosocial-ai
        locator: p. 17, Interdependence and Commons Thinking
        basis: related
    - id: pa-g-society
      kind: critical_success_factor
      text: AI strengthens democratic participation, shared facts and the capacity of institutions, and widens real opportunity for marginalised groups.
      label: Democracy, shared facts and institutions get stronger.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: evolving-prosocial-ai
        locator: 'pp. 32–33, Societal Level: Democratic Strengthening and Institutional Enhancement'
        basis: paraphrase
    - id: pa-g-planet
      kind: critical_success_factor
      text: AI's full lifecycle costs in energy, water and materials are accounted for, and it is designed to work within planetary boundaries and with ecological knowledge.
      label: AI works within planetary limits.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: evolving-prosocial-ai
        locator: 'p. 34, Planetary Level: Regenerative Design and Ecological Integration'
        basis: paraphrase
    - id: pa-g-rewarding
      kind: critical_success_factor
      text: Institutional arrangements make cooperation more rewarding than extraction, so prosocial AI does not depend on self-sacrifice against competitive pressure.
      label: Cooperation pays better than extraction.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: evolving-prosocial-ai
        locator: p. 28, Section 4 opening
        basis: paraphrase
      - source_id: evolving-prosocial-ai
        locator: p. 37, the principles transform reinforcement contingencies
        basis: paraphrase
    - id: pa-g-worldviews
      kind: critical_success_factor
      text: Those who design, govern and use AI hold worldviews that value capability, interdependence and effects across scales, and treat AI's direction as a collective choice rather than an inevitability.
      label: Those shaping AI hold prosocial worldviews.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: evolving-prosocial-ai
        locator: p. 11, Values in, Values out
        basis: paraphrase
      - source_id: evolving-prosocial-ai
        locator: pp. 16–20, Prosocial Worldviews
        basis: reconstruction
    - id: pa-g-purpose
      kind: necessary_condition
      text: Affected communities, not only shareholders and executives, agree what an AI system is for and whose interests it serves.
      label: Affected communities agree what AI is for.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: evolving-prosocial-ai
        locator: p. 36, CDP1 Shared Identity and Purpose
        basis: paraphrase
    - id: pa-g-equity
      kind: necessary_condition
      text: Those who contribute data, labour, creativity and resources receive proportional benefits, and costs are not pushed onto vulnerable people.
      label: Contributors share benefits; costs aren't pushed onto others.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: evolving-prosocial-ai
        locator: p. 36, CDP2 Equitable Distribution
        basis: paraphrase
    - id: pa-g-choice
      kind: necessary_condition
      text: Those affected by AI rules take part in making them, including the choice not to build or deploy a system at all.
      label: Those affected help make the rules, including not to build.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: evolving-prosocial-ai
        locator: p. 36, CDP3 Collective Choice Arrangements
        basis: paraphrase
      - source_id: evolving-prosocial-ai
        locator: p. 8, the prosocial choice may be not to build or deploy
        basis: paraphrase
    - id: pa-g-monitor
      kind: necessary_condition
      text: Algorithmic systems are publicly audited and their effects on capability are reported, with escalating consequences for violations.
      label: AI is audited, and violations meet escalating consequences.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: evolving-prosocial-ai
        locator: p. 36, CDP4–5 Monitoring and Graduated Responses
        basis: paraphrase
    - id: pa-g-resolve
      kind: necessary_condition
      text: Affected people have accessible channels to challenge harmful deployments, with transparent adjudication and real remedies.
      label: People can challenge harmful deployments and get remedies.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: evolving-prosocial-ai
        locator: p. 36, CDP6 Conflict Resolution Mechanisms
        basis: paraphrase
    - id: pa-g-authority
      kind: necessary_condition
      text: Stakeholder bodies hold real decision-making power over AI deployment, not consultation rights alone.
      label: Stakeholder bodies have real power, not just a say.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: evolving-prosocial-ai
        locator: pp. 36–37, CDP7 Authority to Self-Govern
        basis: paraphrase
    - id: pa-g-polycentric
      kind: necessary_condition
      text: 'Governance is nested across scales: groups coordinate purpose, equity and monitoring between them, while lower levels keep authority within their own domains.'
      label: Nested governance coordinates across scales.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: evolving-prosocial-ai
        locator: p. 37, CDP8 Polycentric Governance
        basis: paraphrase
    - id: pa-g-measure
      kind: necessary_condition
      text: AI's effects on human capability can be measured, so enhancement and extraction can be told apart.
      label: Capability impacts can be measured.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: evolving-prosocial-ai
        locator: p. 46, Create Feedback Loops Through Measurement
        basis: paraphrase
      - source_id: evolving-prosocial-ai
        locator: p. 48, measurement frameworks require further development
        basis: related
    - id: pa-g-scaffold
      kind: necessary_condition
      text: AI tools scaffold people's thinking, with questions and reflection points, rather than completing the work for them.
      label: AI scaffolds thinking rather than doing the work.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: evolving-prosocial-ai
        locator: p. 28, Competence Support
        basis: paraphrase
    - id: pa-g-control
      kind: necessary_condition
      text: Users can state their preferences, systems respect them even when engagement patterns point elsewhere, and users can override recommendations.
      label: Users' stated preferences are respected and can override.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: evolving-prosocial-ai
        locator: p. 29, Autonomy Support
        basis: paraphrase
      - source_id: evolving-prosocial-ai
        locator: p. 22, retain override capacity
        basis: paraphrase
    - id: pa-g-connect
      kind: necessary_condition
      text: AI supports in-person connection and relational skills rather than substituting for human relationships.
      label: AI supports human connection rather than replacing it.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: evolving-prosocial-ai
        locator: pp. 29–30, Relatedness Support
        basis: paraphrase
    - id: pa-g-conversion
      kind: necessary_condition
      text: People have the personal, social and environmental conditions they need to turn access to AI into capabilities they value.
      label: People have the conditions to turn access into capability.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: evolving-prosocial-ai
        locator: p. 18, conversion factors
        basis: paraphrase
      - source_id: evolving-prosocial-ai
        locator: p. 29, conversion factors
        basis: paraphrase
    - id: pa-g-bridging
      kind: necessary_condition
      text: Information is stewarded as a commons, with systems designed to surface agreement across differences rather than to maximise engagement.
      label: Information systems favour agreement over engagement.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: evolving-prosocial-ai
        locator: 'pp. 32–33, Restoring Shared Facts: Information as Commons'
        basis: paraphrase
    - id: pa-g-deliberate
      kind: necessary_condition
      text: AI helps citizens deliberate and map common ground, amplifying rather than replacing their judgment.
      label: AI helps citizens deliberate rather than deciding for them.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: evolving-prosocial-ai
        locator: p. 32, Democratic Participation Enhancement
        basis: paraphrase
    - id: pa-g-inclusion
      kind: necessary_condition
      text: AI is deliberately designed to widen marginalised groups' real opportunities rather than to replicate existing disadvantage.
      label: AI is designed to widen opportunity for the marginalised.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: evolving-prosocial-ai
        locator: p. 33, Equity Acceleration
        basis: paraphrase
    - id: pa-g-costs
      kind: necessary_condition
      text: AI's energy, water and lifecycle costs are made visible and weighed against broader aims.
      label: AI's energy and material costs are visible and weighed.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: evolving-prosocial-ai
        locator: p. 34, Energy and Resource Accountability
        basis: paraphrase
    - id: pa-g-ecology
      kind: necessary_condition
      text: Communities with long ecological knowledge keep decision-making authority, and their knowledge is treated as an equal partner in design.
      label: Communities with ecological knowledge keep authority.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: evolving-prosocial-ai
        locator: p. 34, Ecological Integration and Indigenous Knowledge
        basis: paraphrase
