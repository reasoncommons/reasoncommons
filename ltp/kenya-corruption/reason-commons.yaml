  current_reality:
    nodes:
    - id: ke-r-indices
      kind: observation
      text: As of 2013, Kenya ranked 136th of 177 countries on Transparency International's Corruption Perceptions Index and had sat between the 10th and 20th percentile for control of corruption in the World Bank's governance indicators since 1996.
      label: Kenya ranks near the bottom on corruption indices.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ti-kenya-2014
        locator: pp. 2–3, Extent of corruption
        basis: paraphrase
    - id: ke-r-history
      kind: observation
      text: Corruption and looting of state assets were widespread under one-party rule after independence; a government elected in 2002 on an anti-corruption platform was itself caught up in major scandals within two years.
      label: An anti-corruption government soon faced its own scandals.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ti-kenya-2014
        locator: p. 2, Background
        basis: paraphrase
      - source_id: ti-kenya-2014
        locator: p. 4, Grand forms of corruption
        basis: paraphrase
    - id: ke-r-bribery
      kind: undesirable_effect
      text: 'As of 2013, petty bribery was pervasive: 70% of Global Corruption Barometer respondents said they had paid a bribe to at least one of eight public services in the past year.'
      label: Most people paid a bribe for a public service.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ti-kenya-2014
        locator: p. 3, Petty and bureaucratic corruption
        basis: paraphrase
    - id: ke-r-police
      kind: undesirable_effect
      text: 'As of 2013, the police were the institution most affected: 95% of respondents saw them as corrupt and 77% said they had paid them a bribe.'
      label: Police are the most bribed institution.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ti-kenya-2014
        locator: p. 5, Sectors affected by corruption
        basis: paraphrase
      - source_id: ti-kenya-2014
        locator: p. 7, Police and security
        basis: paraphrase
    - id: ke-r-business
      kind: undesirable_effect
      text: As of 2013, firms were expected to give gifts to win government contracts (about 28%) and construction permits (about 33%), above the continental averages.
      label: Firms pay for contracts and permits.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ti-kenya-2014
        locator: 'p. 3, Petty and bureaucratic corruption: Enterprise Survey'
        basis: paraphrase
    - id: ke-r-misspent
      kind: undesirable_effect
      text: 'Budget money was misappropriated: a 2011 audit found KSh 4.2 billion meant for free primary education lost between 2005 and 2009, and several donors withdrew their support.'
      label: School funds were lost and donors pulled out.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ti-kenya-2014
        locator: pp. 5–6, Public financial management
        basis: paraphrase
    - id: ke-r-unsupported
      kind: undesirable_effect
      text: The 2012–13 audit of government ministries found nearly KSh 34 billion of public money spent without records, and experts consulted for the brief said officials had not been held accountable.
      label: KSh 34bn was spent without records.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ti-kenya-2014
        locator: 'p. 8, Constitution: unsupported public expenditure'
        basis: paraphrase
    - id: ke-r-impunity
      kind: undesirable_effect
      text: As of 2014, senior officials implicated in corruption were rarely prosecuted or convicted; the few convictions were for petty cases with lenient sentences.
      label: Senior officials are rarely convicted.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ti-kenya-2014
        locator: p. 7, Overview of anti-corruption efforts
        basis: paraphrase
      - source_id: ti-kenya-2014
        locator: p. 11, Judiciary
        basis: paraphrase
    - id: ke-r-trust
      kind: undesirable_effect
      text: 'Confidence in the government''s fight against corruption fell: 70% of respondents rated it effective in 2011, 34% in 2013.'
      label: Trust in the fight fell from 70% to 34%.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ti-kenya-2014
        locator: p. 7, Overview of anti-corruption efforts
        basis: paraphrase
    - id: ke-r-elections
      kind: undesirable_effect
      text: 'Elections were marked by irregularities: the disputed 2007 result led to violence that killed more than 1,000 people, and the 2013 election saw vote-buying and corruption charges over the procurement of voter identification devices.'
      label: Elections are marred by fraud and vote-buying.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ti-kenya-2014
        locator: p. 2, Background
        basis: paraphrase
      - source_id: ti-kenya-2014
        locator: p. 5, Political corruption
        basis: paraphrase
    - id: ke-r-diluted
      kind: cause
      text: As of 2014, laws meant to put the 2010 constitution into effect had been diluted, and many anti-corruption laws were not implemented.
      label: Laws are diluted or not implemented.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ti-kenya-2014
        locator: p. 2, Background
        basis: paraphrase
      - source_id: ti-kenya-2014
        locator: pp. 7–8, Legal framework
        basis: paraphrase
    - id: ke-r-will
      kind: cause
      text: 'Political will to tackle corruption was lacking: reform met political resistance, and decision makers did not seek dialogue and mostly ignored civil society recommendations.'
      label: Political will is lacking.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ti-kenya-2014
        locator: p. 1, Summary
        basis: paraphrase
      - source_id: ti-kenya-2014
        locator: p. 13, Civil society
        basis: paraphrase
    - id: ke-r-noprosec
      kind: cause
      text: The Ethics and Anti-Corruption Commission could investigate and recover assets but could not prosecute; it forwarded cases for others to prosecute.
      label: The commission can't prosecute.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ti-kenya-2014
        locator: pp. 10–11, Ethics and Anti-Corruption Commission
        basis: paraphrase
    - id: ke-r-commission
      kind: cause
      text: The commission took two years to be fully constituted after 2011, and court disputes over its leadership undermined its ability to pursue its mandate.
      label: The commission was slow to start and contested.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ti-kenya-2014
        locator: p. 11, Ethics and Anti-Corruption Commission
        basis: paraphrase
    - id: ke-r-courts
      kind: cause
      text: 'Courts were understaffed, underfinanced and backlogged, and corruption within the judiciary persisted: 58% of respondents reported paying it a bribe.'
      label: Courts are overloaded and themselves corrupt.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ti-kenya-2014
        locator: p. 11, Judiciary
        basis: paraphrase
    - id: ke-r-reinstated
      kind: cause
      text: Officials charged or convicted of corruption were not consistently suspended or barred, and some were reinstated or appointed to new posts while cases were pending.
      label: Accused officials stay in or return to office.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ti-kenya-2014
        locator: p. 6, Public administration
        basis: paraphrase
    - id: ke-r-declarations
      kind: cause
      text: Asset declarations were not audited or acted on, and asset declaration and vetting were removed from the Leadership and Integrity Act at cabinet level.
      label: Asset declarations go unchecked.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ti-kenya-2014
        locator: p. 8, Public Officers Ethics Act
        basis: paraphrase
      - source_id: ti-kenya-2014
        locator: p. 9, Leadership and Integrity Act
        basis: paraphrase
    - id: ke-r-patronage
      kind: cause
      text: Political parties were institutionally weak and organised around ethnic loyalty and patronage rather than ideas.
      label: Parties run on ethnic patronage.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ti-kenya-2014
        locator: p. 4, Political corruption
        basis: paraphrase
    - id: ke-r-party-money
      kind: cause
      text: 'Party and campaign finance was opaque: analysts allege that major procurement scandals raised campaign money, and no campaign finance law applied in the 2013 elections.'
      label: Party and campaign money is opaque.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ti-kenya-2014
        locator: pp. 4–5, Political corruption
        basis: paraphrase
      - source_id: ti-kenya-2014
        locator: p. 9, Political finance measures
        basis: paraphrase
    - id: ke-r-procurement
      kind: cause
      text: Public procurement favoured well-connected firms and individuals, and security procurement escaped the normal rules and oversight.
      label: Procurement favours the well-connected.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ti-kenya-2014
        locator: 'p. 6, Public financial management: procurement'
        basis: paraphrase
      - source_id: ti-kenya-2014
        locator: p. 9, Public Procurement and Disposal Act
        basis: paraphrase
    - id: ke-r-oversight-gaps
      kind: cause
      text: 'Budget oversight was thin: parliament and the Auditor General lacked resources and time, and audit reports left out extra-budgetary funds.'
      label: Budget oversight is thin.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ti-kenya-2014
        locator: p. 5, Public financial management
        basis: paraphrase
      - source_id: ti-kenya-2014
        locator: p. 12, Auditor General
        basis: paraphrase
    - id: ke-r-police-oversight
      kind: cause
      text: Police oversight was weak and political interference high; by 2014 about 60% of proposed police reforms had been implemented and 15% of those showed significant impact in communities.
      label: Police oversight and reform lag.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ti-kenya-2014
        locator: p. 6, Police and security
        basis: paraphrase
      - source_id: ti-kenya-2014
        locator: pp. 12–13, Police oversight bodies
        basis: paraphrase
