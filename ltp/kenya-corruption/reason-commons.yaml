schema_version: 1
project: Corruption in Kenya, 2014
driver: david
participants:
  david: David Joseph
active_tree: future_reality
import_context:
  recorded_on: '2026-10-28'
  basis: 'One public document: Transparency International Anti-Corruption Helpdesk, Overview of corruption and anti-corruption in Kenya, by Samira Lindner, dated 15 October 2014 (16-page PDF), answering a European Commission query with a focus on public financial management.'
  standing: Every statement and connection is a proposed AI reconstruction. Approval to implement it (kenya-commons revision 1) is not endorsement of the wording, topology or predictions by David or by Transparency International.
  scope: 'Kenya as the brief describes it in October 2014, across six perspectives: a goal of open public money and accountable office inferred from the brief''s focus; bribery, misspent funds and impunity with their candidate causes; two dilemmas the brief records; changes inferred from the gaps it identifies, with risks; obstacles to reform; and three illustrative steps.'
  attribution: Samira Lindner of Transparency International wrote the brief, reviewed by Marie Chêne, Casey Kelso and Samuel Kimeu. The AI selected, paraphrased and connected the material and is responsible for this reconstruction. Figures the brief cites from other indices and surveys are attributed observations, not checked here. People the brief names in connection with allegations are not named. Source credit is not contribution to or endorsement of the commons.
  limits: Everything describes Kenya as of 2014; nothing since is covered. The brief describes more than it recommends, so the goal and most changes are the AI's inferences from the gaps it identifies. No group, trial, owner or observed outcome is established; existing conditions in the action sequence are illustrative.
trees:
  goal:
    nodes:
