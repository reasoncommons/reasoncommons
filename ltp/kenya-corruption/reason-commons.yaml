  future_reality:
    nodes:
    - id: ke-f-prosecute
      kind: injection
      text: Give the Ethics and Anti-Corruption Commission power to prosecute the cases it investigates, which the brief notes parliament could do.
      label: Give the commission power to prosecute.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ti-kenya-2014
        locator: pp. 10–11, could be given prosecutorial powers by parliament
        basis: inference
      addresses:
      - ke-r-noprosec
    - id: ke-f-courts
      kind: injection
      text: Fund and staff the courts, including the special magistrates for corruption and economic crimes, to clear corruption cases.
      label: Resource the courts for corruption cases.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ti-kenya-2014
        locator: 'p. 11, Judiciary: special magistrates; understaffed, underfinanced'
        basis: inference
      addresses:
      - ke-r-courts
    - id: ke-f-integrity
      kind: injection
      text: Restore asset declaration and vetting to the Leadership and Integrity Act, check declarations, and keep people charged with or convicted of corruption out of office.
      label: Restore vetting and check asset declarations.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ti-kenya-2014
        locator: p. 6, Public administration
        basis: inference
      - source_id: ti-kenya-2014
        locator: pp. 8–9, Public Officers Ethics Act; Leadership and Integrity Act
        basis: inference
      addresses:
      - ke-r-declarations
      - ke-r-reinstated
    - id: ke-f-whistle
      kind: injection
      text: Pass the whistle-blower protection bill a task force was drafting in 2014.
      label: Protect whistle-blowers in law.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ti-kenya-2014
        locator: p. 8, a whistle-blower protection bill at its formative stages
        basis: related
    - id: ke-f-info
      kind: injection
      text: Pass the law the constitution's right of access to information still lacked in 2014.
      label: Give the right to information a law.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ti-kenya-2014
        locator: p. 8, no legal framework yet enacted
        basis: inference
    - id: ke-f-campaign
      kind: injection
      text: Restore spending limits to the Election Campaign Financing Act, and have the electoral commission enforce them and verify donations.
      label: Limit and verify campaign money.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ti-kenya-2014
        locator: pp. 9–10, Election Campaign Financing Act
        basis: inference
      addresses:
      - ke-r-party-money
    - id: ke-f-pfm
      kind: injection
      text: Put every regulation of the 2012 Public Financial Management Act into effect, including citizen participation and in-year reports on actual spending.
      label: Put the public finance law fully into effect.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ti-kenya-2014
        locator: p. 9, Public Financial Management Act; the IMF on implementation
        basis: paraphrase
      addresses:
      - ke-r-oversight-gaps
    - id: ke-f-audit
      kind: injection
      text: Extend audits to extra-budgetary funds and give the Auditor General the funding and channels to report to the public.
      label: Audit all funds and report to the public.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ti-kenya-2014
        locator: p. 12, Auditor General
        basis: inference
      addresses:
      - ke-r-oversight-gaps
    - id: ke-f-police
      kind: injection
      text: Complete the police reforms and give the Independent Policing Oversight Authority the resources to act on complaints.
      label: Finish police reform and fund its oversight.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ti-kenya-2014
        locator: pp. 12–13, Police oversight bodies
        basis: inference
      addresses:
      - ke-r-police-oversight
    - id: ke-f-settle
      kind: injection
      text: Use out-of-court settlements to recover assets only alongside criminal prosecution, so that returning assets never buys a pardon.
      label: Recover assets without buying pardons.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ti-kenya-2014
        locator: p. 8, out-of-court settlements
        basis: inference
      addresses:
      - ke-c2-settle
      - ke-c2-pursue
    - id: ke-f-recover
      kind: injection
      text: Refund donors where needed to keep programmes running, while pursuing the people responsible and publishing what is recovered.
      label: Refund now, and recover from the culprits.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ti-kenya-2014
        locator: pp. 5–6, Public financial management
        basis: inference
      addresses:
      - ke-c1-refund
      - ke-c1-recover
    - id: ke-f-press
