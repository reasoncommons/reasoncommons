      - source_id: ap-summary
        locator: p. 7, access their inner thoughts and feelings
        basis: reconstruction
    - id: ps-cl2-guarded
      from:
      - ps-c2-guarded
      to: ps-c2-standing
      relation: necessary_for
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: p. 7, maintain our guard
