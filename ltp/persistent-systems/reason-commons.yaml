schema_version: 1
project: Why Things Last
driver: david
participants:
  david: David Joseph
active_tree: future_reality
import_context:
  recorded_on: '2026-10-26'
  basis: 'Three supplied documents: Why Things Last, an introduction to Stephen Le''s Persistent Systems Theory, and Stephen Le''s Adaptive Persistence overview (30 September 2026) and summary for Analogue Group (11 October 2026).'
  standing: Every statement and connection is a proposed AI reconstruction. Approval to implement it (pst-commons revision 1) is not endorsement of the wording, topology or predictions by David or by Stephen Le.
  scope: 'The practical protocol for human groups, framed by the theory''s claims. Six perspectives: a group that lasts and does well through cooperation, adaptation, robustness and fit to its environment; quick fixes, fear and sensible-looking cuts as candidate causes; two dilemmas; the Adaptive Persistence cycle with a filing-cabinet risk; readiness conditions; and the five steps as an illustrative sequence.'
  attribution: Stephen Le is the author of Persistent Systems Theory, Adaptive Persistence and both Adaptive Persistence documents. Why Things Last comes from the Thrival theory compendium and does not name its author. The AI selected, paraphrased and connected the material and is responsible for this reconstruction. Source credit is not contribution to or endorsement of the commons.
  limits: No group, trial, facilitator, owner or observed outcome is established. Existing conditions in the action sequence are illustrative. The four case studies are the author's own reports, not independent evidence. Nothing in the theory is yet measured, as its introduction says.
trees:
  goal:
    nodes:
    - id: ps-g-goal
      kind: goal
      text: 'A group persists through time and does well in the environment it actually faces: it meets its aims, keeps its members'' trust and well-being, and resolves its conflicts.'
      label: A group lasts and does well in its environment.
      status: proposed
      contributions: &id001
      - by: assistant
        attribution: assistant
        mode: text
      source_refs:
      - source_id: ap-overview
        locator: p. 1, What is Adaptive Persistence?
        basis: paraphrase
      - source_id: ap-summary
        locator: p. 2, The Challenge of Cooperation
        basis: reconstruction
      - source_id: essay
        locator: §1 Three survivors; §6 Three ways to die
        basis: inference
    - id: ps-g-cooperate
      kind: critical_success_factor
      text: 'Its members can cooperate: the parts keep pulling together instead of doing better for themselves at the whole''s expense.'
      label: Its members can cooperate.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-overview
        locator: p. 1, Can we cooperate?
        basis: paraphrase
      - source_id: essay
        locator: §6 Three ways to die; §7 Coordination
        basis: paraphrase
    - id: ps-g-adapt
      kind: critical_success_factor
      text: It can become something else in time when its existing solutions stop working.
      label: It adapts when its solutions stop working.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-overview
        locator: p. 1, Can we adapt?
        basis: paraphrase
      - source_id: essay
        locator: §6 Three ways to die; §9 Adaptation
        basis: paraphrase
    - id: ps-g-withstand
      kind: critical_success_factor
      text: It can take a severe shock from outside and keep working.
      label: It withstands severe shocks.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-overview
        locator: p. 1, Can we tolerate disruption?
        basis: paraphrase
      - source_id: essay
        locator: §6 Three ways to die; §8 Robustness
        basis: paraphrase
    - id: ps-g-fit
      kind: critical_success_factor
      text: Its mix of coordination, adaptation and robustness matches the environment it faces.
      label: Its capacities match its environment.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: 'p. 3, steps 3 and 4: Analyze and Adjust'
        basis: paraphrase
      - source_id: essay
        locator: §12 The budget; §13 Three dials in the world
        basis: paraphrase
    - id: ps-g-decide
      kind: necessary_condition
      text: Decisions are efficient and inclusive, and conflicts are resolved efficiently and effectively.
      label: Decisions are inclusive and conflicts get resolved.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: p. 5, collaboration principles c and d
        basis: paraphrase
    - id: ps-g-fair
      kind: necessary_condition
      text: Benefits and costs are fairly shared, and breaches of agreed norms are visible and met with proportionate sanctions.
      label: Costs and benefits are fair; norms are visibly upheld.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: pp. 4–5, collaboration principles b, e and g
        basis: paraphrase
      - source_id: essay
        locator: '§14 How a new floor gets built: police'
        basis: related
    - id: ps-g-sense
      kind: necessary_condition
      text: The group watches its environment continuously and combines scattered information into a picture that supports decisions.
      label: It watches its environment and makes sense of it.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: p. 5, adaptability principles a and e
        basis: paraphrase
    - id: ps-g-try
      kind: necessary_condition
      text: The group tests new ideas at limited scale, avoids depending on one solution too early and learns quickly from the consequences.
      label: It tries small bets and learns from them quickly.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: p. 5, adaptability principles b, g and h
        basis: paraphrase
      - source_id: essay
        locator: '§9 Adaptation: buying lottery tickets'
        basis: related
    - id: ps-g-reserve
      kind: necessary_condition
      text: The group keeps spare financial, material, human and operational capacity, and can restore essential operations after a disruption.
      label: It keeps spare capacity and can recover.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: p. 5, robustness principles b and c
        basis: paraphrase
      - source_id: essay
        locator: '§8 Robustness: the wall'
        basis: related
    - id: ps-g-uncouple
      kind: necessary_condition
      text: Local failures do not cascade through the whole group, and it is settled in advance who decides during a disruption.
      label: Failures stay local; crisis authority is clear.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: p. 5, robustness principles e, f and g
        basis: paraphrase
    - id: ps-g-read-env
      kind: necessary_condition
      text: The group knows how volatile, hazardous and varied its environment is.
      label: It knows how volatile, hazardous and varied its world is.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: 'p. 4, 2. Assess: Environment'
        basis: paraphrase
      - source_id: essay
        locator: §13 Three dials in the world
        basis: paraphrase
    - id: ps-g-allocate
      kind: necessary_condition
      text: The group divides its limited resources among the three capacities in proportions its environment rewards.
      label: It budgets across the three capacities to suit its world.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: essay
        locator: §12 The budget
        basis: paraphrase
    links:
    - id: ps-gl-cooperate
      from:
      - ps-g-cooperate
      to: ps-g-goal
      relation: necessary_for
      status: proposed
      contributions: *id001
      source_refs:
