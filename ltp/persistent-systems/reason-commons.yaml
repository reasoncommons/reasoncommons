      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: pp. 3 and 7, competitive environments discourage vulnerability
        basis: reconstruction
      assumptions:
      - text: Any expression of need will be read as weakness, whatever words it is put in.
        by: assistant
    backlog: []
  future_reality:
    nodes:
    - id: ps-f-cycle
      kind: injection
      text: 'The group runs the Adaptive Persistence cycle: orient on one agreed issue, assess its environment and core capacities, analyse the mismatch, adjust, and repeat.'
      label: Assess, close the biggest mismatch, and repeat.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: p. 3, The Adaptive Persistence meta-protocol
        basis: paraphrase
      - source_id: ap-overview
        locator: p. 2, process steps 1–6
        basis: paraphrase
      addresses:
      - ps-r-surface
      - ps-r-unassessed
    - id: ps-f-match
      kind: injection
      text: Emphasise adaptability where the environment is volatile, robustness where it is hazardous, and coordination where it is neither.
      label: Emphasise the capacity the environment calls for.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: p. 6, 3. Analyze
        basis: paraphrase
    - id: ps-f-act
      kind: injection
      text: 'Work through the ACT group matrix: the values behind the chosen capacity, how the group would act if it improved, the thoughts and feelings that get in the way, and how to move forward while acknowledging them.'
      label: Name what gets in the way, and move anyway.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: pp. 6–7, The ACT Group Matrix
        basis: paraphrase
      addresses:
      - ps-r-fear
    - id: ps-f-gentle
      kind: injection
      text: For groups wary of vulnerability, word the matrix in their own vocabulary and begin with a lighter first pass before a deeper one.
      label: Start lighter where vulnerability feels unsafe.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: pp. 7–8, one potential compromise
        basis: paraphrase
      addresses:
      - ps-c2-open
      - ps-c2-guarded
    - id: ps-f-criteria
      kind: injection
      text: Agree clear success criteria at the start, test each cycle against them, and stop once they are met.
      label: Agree success criteria and test against them.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: p. 4, 1. Orient; p. 8, 5. Repeat
        basis: paraphrase
    - id: ps-f-see
      kind: predicted_effect
      text: The group sees which capacity its environment most calls for and where it falls short.
      label: It sees which capacity it is short of.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: p. 6, 3. Analyze
        basis: reconstruction
    - id: ps-f-voiced
      kind: predicted_effect
      text: Members voice the thoughts, feelings and needs that a structural assessment misses.
      label: Hidden needs get voiced.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: p. 7, why bother with ACT
        basis: reconstruction
    - id: ps-f-willing
      kind: predicted_effect
      text: Members become willing to take an active part in finding the solution.
      label: Members take part in the fix.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: p. 7, obtain their willingness and active participation
        basis: paraphrase
    - id: ps-f-causes
      kind: predicted_effect
      text: Adjustments address structural causes rather than symptoms.
      label: Fixes reach causes, not symptoms.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: p. 7, the problem with quick solutions
        basis: inference
    - id: ps-f-cooperate
      kind: desirable_effect
      text: Members cooperate, and conflicts are resolved rather than recurring.
      label: Conflict gets resolved, not repeated.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: p. 2, greater trust, well-being and performance
        basis: inference
    - id: ps-f-fit
      kind: desirable_effect
      text: The group's capacities fit its environment better with each cycle.
      label: Capacities fit the environment better each cycle.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: p. 8, 5. Repeat
        basis: inference
    - id: ps-f-cases
      kind: observation
      text: Stephen Le reports four facilitation cases, using lighter variations of the method, in which groups in conflict reconciled or renewed their collaboration.
      label: Le reports four cases where groups reconciled.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: pp. 8–9, Case Studies
        basis: paraphrase
    links:
    - id: ps-fl-see
      from:
      - ps-f-cycle
      - ps-f-match
      to: ps-f-see
      relation: contributes_to
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: pp. 3 and 6, Assess and Analyze
        basis: reconstruction
    - id: ps-fl-voiced-act
      from:
      - ps-f-act
      to: ps-f-voiced
      relation: contributes_to
      status: proposed
      contributions: *id001
      source_refs:
