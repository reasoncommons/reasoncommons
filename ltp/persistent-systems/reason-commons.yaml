schema_version: 1
project: Persistent Systems Theory
driver: david
participants:
  david: David Joseph
active_tree: future_reality
import_context:
  recorded_on: '2026-10-26'
  basis: 'Two supplied documents by Stephen Le: his Adaptive Persistence overview (30 September 2026) and summary for Analogue Group (11 October 2026).'
  standing: Every statement and connection is a proposed AI reconstruction. Approval to implement it (pst-commons revisions 1 and 2) is not endorsement of the wording, topology or predictions by David or by Stephen Le.
  scope: 'The Adaptive Persistence protocol for human groups. Six perspectives: a group that lasts and does well through cooperation, adaptation, robustness and fit to its environment; quick fixes, fear and free riding as candidate causes; openness against guardedness; the Adaptive Persistence cycle; readiness conditions; and the five steps as an illustrative sequence.'
  attribution: Stephen Le is the author of Persistent Systems Theory, Adaptive Persistence and both credited documents. The AI selected, paraphrased and connected the material and is responsible for this reconstruction. Source credit is not contribution to or endorsement of the commons.
  limits: No group, trial, facilitator, owner or observed outcome is established. Existing conditions in the action sequence are illustrative. The four case studies are the author's own reports, not independent evidence. The assessments have no stated scoring method.
trees:
  goal:
    nodes:
    - id: ps-g-goal
      kind: goal
      text: 'A group persists through time and does well in the environment it actually faces: it meets its aims, keeps its members'' trust and well-being, and resolves its conflicts.'
      label: A group lasts and does well in its environment.
      status: proposed
      contributions: &id001
      - by: assistant
        attribution: assistant
        mode: text
      source_refs:
      - source_id: ap-overview
        locator: p. 1, What is Adaptive Persistence?
        basis: paraphrase
      - source_id: ap-summary
        locator: p. 2, The Challenge of Cooperation
        basis: reconstruction
    - id: ps-g-cooperate
      kind: critical_success_factor
      text: 'Members can cooperate: the group manages the dynamics among its members well.'
      label: Members manage the dynamics among them.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-overview
        locator: p. 1, Can we cooperate?
        basis: paraphrase
      - source_id: ap-summary
        locator: 'p. 4, 2. Assess: Core capacities, Coordination'
        basis: paraphrase
    - id: ps-g-adapt
      kind: critical_success_factor
      text: The group adapts well to changes in its external environment.
      label: It adapts to changes in its environment.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-overview
        locator: p. 1, Can we adapt?
        basis: paraphrase
      - source_id: ap-summary
        locator: 'p. 4, 2. Assess: Core capacities, Adaptability'
        basis: paraphrase
    - id: ps-g-withstand
      kind: critical_success_factor
      text: The group withstands severe shocks.
      label: It withstands severe shocks.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-overview
        locator: p. 1, Can we tolerate disruption?
        basis: paraphrase
      - source_id: ap-summary
        locator: 'p. 4, 2. Assess: Core capacities, Robustness'
        basis: paraphrase
    - id: ps-g-fit
      kind: critical_success_factor
      text: Its mix of coordination, adaptation and robustness matches the environment it faces.
      label: Its capacities match its environment.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: 'p. 3, steps 3 and 4: Analyze and Adjust'
        basis: paraphrase
    - id: ps-g-decide
      kind: necessary_condition
      text: Decisions are efficient and inclusive, and conflicts are resolved efficiently and effectively.
      label: Decisions are inclusive and conflicts get resolved.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: p. 5, collaboration principles c and d
        basis: paraphrase
    - id: ps-g-fair
      kind: necessary_condition
      text: Benefits and costs are fairly shared, and breaches of agreed norms are visible and met with proportionate sanctions.
      label: Costs and benefits are fair; norms are visibly upheld.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: pp. 4–5, collaboration principles b, e and g
        basis: paraphrase
    - id: ps-g-sense
      kind: necessary_condition
      text: The group watches its environment continuously and combines scattered information into a picture that supports decisions.
      label: It watches its environment and makes sense of it.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: p. 5, adaptability principles a and e
        basis: paraphrase
    - id: ps-g-try
      kind: necessary_condition
      text: The group tests new ideas at limited scale, avoids depending on one solution too early and learns quickly from the consequences.
      label: It tries small bets and learns from them quickly.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: p. 5, adaptability principles b, g and h
        basis: paraphrase
    - id: ps-g-reserve
      kind: necessary_condition
      text: The group keeps spare financial, material, human and operational capacity, and can restore essential operations after a disruption.
      label: It keeps spare capacity and can recover.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: p. 5, robustness principles b and c
        basis: paraphrase
    - id: ps-g-uncouple
      kind: necessary_condition
      text: Local failures do not cascade through the whole group, and it is settled in advance who decides during a disruption.
      label: Failures stay local; crisis authority is clear.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: p. 5, robustness principles e, f and g
        basis: paraphrase
    - id: ps-g-read-env
      kind: necessary_condition
      text: The group knows how volatile, hazardous and varied its environment is.
      label: It knows how volatile, hazardous and varied its world is.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: 'p. 4, 2. Assess: Environment'
        basis: paraphrase
      - source_id: ap-overview
        locator: 'p. 2, 2. Assess environment: volatility, hazardousness, heterogeneity'
        basis: paraphrase
