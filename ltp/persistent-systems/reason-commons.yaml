    - id: ps-cl2-standing
      from:
      - ps-c2-standing
      to: ps-c2-objective
      relation: necessary_for
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: p. 3, competitive environments
        basis: inference
    - id: ps-cl2-open
      from:
      - ps-c2-open
      to: ps-c2-trust
      relation: necessary_for
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
