        locator: §12 The budget
        basis: reconstruction
    backlog:
    - ref: ps-g-goal
      work: check_with_author
      label: Ask Stephen Le whether this goal states what Adaptive Persistence is for.
      note: The goal joins his stated aims (performance, well-being, trust, fewer conflicts) with the essay's question of why things last. He has not reviewed the wording.
  current_reality:
    nodes:
    - id: ps-r-three-threats
      kind: observation
      text: 'Anything that persists faces three distinct threats: its own parts turning on it, blows from outside, and an environment that changes and does not change back.'
      label: Things that last face three distinct threats.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: essay
        locator: §6 Three ways to die
        basis: paraphrase
    - id: ps-r-filter
      kind: observation
      text: 'Persistence is a filter, not a goal: the things still here are the ones whose properties happened to keep them here.'
      label: Persistence is a filter, not a goal.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: essay
        locator: '§15 How this could be wrong: purpose can sneak in'
        basis: paraphrase
    - id: ps-r-new-levels
      kind: observation
      text: New levels of organisation are built when defection is made unprofitable, not when cooperation simply breaks out.
      label: New levels form when defection stops paying.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: essay
        locator: §14 How a new floor gets built
        basis: paraphrase
    - id: ps-r-pressure
      kind: cause
      text: Leaders under pressure to show immediate, visible progress reach for quick fixes rather than probing the structural factors that undermine cooperation.
      label: Pressure for visible progress favours quick fixes.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: 'p. 2, The Challenge of Cooperation: myopia'
        basis: paraphrase
    - id: ps-r-competitive
      kind: cause
      text: Competitive fields such as business, sport, security and the military actively discourage people from being vulnerable and revealing their needs.
      label: Competitive settings discourage vulnerability.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: p. 3, The Persistence Framework; p. 7, ACT and EFT
        basis: paraphrase
    - id: ps-r-fear
      kind: cause
      text: Members feel too unsafe to be vulnerable and reveal their real needs, so assessments rarely reach what people actually think and feel.
      label: Fear keeps real needs hidden.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: p. 2, fear; p. 7, why bother with ACT
        basis: paraphrase
    - id: ps-r-unassessed
      kind: cause
      text: The group has not assessed how volatile and hazardous its environment is, so it cannot tell which capacity it is short of.
      label: It hasn't assessed its environment.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: p. 3, existing frameworks address specific aspects; p. 6, 3. Analyze
        basis: inference
    - id: ps-r-surface
      kind: cause
      text: Fixes address superficial concerns while the mismatch between the group's capacities and its environment remains.
      label: Fixes treat symptoms; the mismatch remains.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: p. 7, the problem with quick solutions
        basis: paraphrase
    - id: ps-r-growth
      kind: cause
      text: As a group grows past the point where everyone knows or is related to everyone, the cheap ways of keeping parts aligned stop working.
      label: Growth outruns the cheap ways of coordinating.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: essay
        locator: '§14 How a new floor gets built: start with relatives'
        basis: paraphrase
    - id: ps-r-free-riders
      kind: cause
      text: Free riders exploit other people's cooperation; parts can do better for themselves at the whole's expense.
      label: Parts can gain at the whole's expense.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: p. 2, free riders
        basis: paraphrase
      - source_id: essay
        locator: '§7 Coordination: the enemy is you'
        basis: paraphrase
    - id: ps-r-cut-reserves
      kind: cause
      text: Reserves, redundancy and margin look like waste in good weather, so they are the first thing cut.
      label: Reserves look wasteful and get cut first.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: essay
        locator: '§8 Robustness: the wall'
        basis: paraphrase
    - id: ps-r-cut-experiments
      kind: cause
      text: Cutting experiments makes a group look better for years, so a loss of adaptive capacity goes unnoticed.
      label: Cutting experiments looks good for years.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: essay
        locator: §11 Telling the three apart
        basis: paraphrase
    - id: ps-r-conflict
      kind: undesirable_effect
      text: Friction and conflict keep returning between members or units, and trust and morale fall.
      label: Conflict keeps returning; trust and morale fall.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: p. 7, fall into conflict and low morale again
        basis: paraphrase
    - id: ps-r-shock
      kind: undesirable_effect
      text: A shock the group could have absorbed proves crippling.
      label: A survivable shock proves crippling.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: essay
        locator: §8 Robustness; §11 Telling the three apart
        basis: paraphrase
    - id: ps-r-obsolete
      kind: undesirable_effect
      text: The group keeps doing well at something its environment no longer rewards, until it is suddenly wrong for where it is.
      label: It becomes quietly wrong for where it is.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: essay
        locator: §6 Three ways to die; §11 Telling the three apart
        basis: paraphrase
    links:
    - id: ps-rl-fear
      from:
      - ps-r-competitive
