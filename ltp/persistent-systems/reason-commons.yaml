      - ps-c1-reserve
      - ps-c1-experiment
    - id: ps-f-act
      kind: injection
      text: 'Work through the ACT group matrix: the values behind the chosen capacity, how the group would act if it improved, the thoughts and feelings that get in the way, and how to move forward while acknowledging them.'
