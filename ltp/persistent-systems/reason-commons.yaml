        basis: reconstruction
    backlog:
    - ref: ps-g-goal
      work: check_with_author
      label: Ask Stephen Le whether this goal states what Adaptive Persistence is for.
      note: The goal joins his stated aims (performance, well-being and trust, fewer conflicts) with lasting through time. He has not reviewed the wording.
  current_reality:
    nodes:
    - id: ps-r-pressure
      kind: cause
      text: Leaders under pressure to show immediate, visible progress reach for quick fixes rather than probing the structural factors that undermine cooperation.
      label: Pressure for visible progress favours quick fixes.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: 'p. 2, The Challenge of Cooperation: myopia'
        basis: paraphrase
    - id: ps-r-competitive
      kind: cause
      text: Competitive fields such as business, sport, security and the military actively discourage people from being vulnerable and revealing their needs.
      label: Competitive settings discourage vulnerability.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: p. 3, The Persistence Framework; p. 7, ACT and EFT
        basis: paraphrase
    - id: ps-r-fear
      kind: cause
      text: Members feel too unsafe to be vulnerable and reveal their real needs, so assessments rarely reach what people actually think and feel.
      label: Fear keeps real needs hidden.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: p. 2, fear; p. 7, why bother with ACT
        basis: paraphrase
    - id: ps-r-unassessed
      kind: cause
      text: The group has not assessed how volatile and hazardous its environment is, so it cannot tell which capacity it is short of.
      label: It hasn't assessed its environment.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: p. 3, existing frameworks address specific aspects; p. 6, 3. Analyze
        basis: inference
    - id: ps-r-surface
      kind: cause
      text: Fixes address superficial concerns while the mismatch between the group's capacities and its environment remains.
      label: Fixes treat symptoms; the mismatch remains.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: p. 7, the problem with quick solutions
        basis: paraphrase
    - id: ps-r-free-riders
      kind: cause
      text: Free riders take advantage of other people’s cooperation, making it hard to sustain in the long run.
      label: Free riders make cooperation hard to sustain.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: p. 2, free riders
        basis: paraphrase
    - id: ps-r-conflict
      kind: undesirable_effect
      text: Friction and conflict keep returning between members or units, and trust and morale fall.
      label: Conflict keeps returning; trust and morale fall.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: p. 7, fall into conflict and low morale again
        basis: paraphrase
    links:
    - id: ps-rl-fear
      from:
      - ps-r-competitive
      to: ps-r-fear
      relation: contributes_to
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: p. 7, competitive fields and vulnerability
        basis: reconstruction
    - id: ps-rl-surface
      from:
      - ps-r-pressure
      - ps-r-fear
      to: ps-r-surface
      relation: contributes_to
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: p. 2, myopia and fear; p. 7, quick solutions and fear
        basis: reconstruction
    - id: ps-rl-unassessed
      from:
      - ps-r-unassessed
      to: ps-r-surface
      relation: contributes_to
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: p. 6, 3. Analyze
        basis: inference
    - id: ps-rl-conflict
      from:
      - ps-r-surface
      to: ps-r-conflict
      relation: contributes_to
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: p. 7, the group will soon fall into conflict and low morale again
        basis: paraphrase
    - id: ps-rl-free-riders
      from:
      - ps-r-free-riders
      to: ps-r-conflict
      relation: contributes_to
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: p. 2, free riders
        basis: inference
    backlog:
    - ref: ps-rl-surface
      work: test_causality
      label: Check in one real group whether quick fixes leave the mismatch in place.
      note: The summary states this from its author's facilitation experience; alternative explanations for recurring conflict have not been examined.
  conflict:
    nodes:
    - id: ps-c2-objective
      kind: objective
      text: The group cooperates well enough to persist in a competitive field.
      label: It cooperates well enough to compete.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: p. 3, The Persistence Framework
        basis: inference
    - id: ps-c2-trust
      kind: need
      text: Members need to trust one another enough to say what really gets in the way.
      label: Members need to say what really gets in the way.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: p. 7, why bother with ACT
        basis: reconstruction
    - id: ps-c2-standing
      kind: need
      text: Members need to protect their standing in a field that punishes weakness.
      label: Members need to protect their standing.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: p. 7, competitive fields and vulnerability
        basis: reconstruction
    - id: ps-c2-open
      kind: prerequisite
      text: Members are open and vulnerable about their real thoughts, feelings and needs.
      label: Be open and vulnerable.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: p. 7, ACT and EFT help people become more open and vulnerable
        basis: paraphrase
    - id: ps-c2-guarded
      kind: prerequisite
      text: Members keep their guard up and avoid showing vulnerability.
      label: Keep your guard up.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: p. 7, our basic instinct in fearful situations is to maintain our guard
        basis: paraphrase
