    backlog: []
  prerequisite:
    nodes:
    - id: ps-p-objective
      kind: objective
      text: The group can run one full Adaptive Persistence cycle on an issue it cares about.
      label: The group can run one full cycle.
      status: proposed
      contributions: *id001
      source_refs:
