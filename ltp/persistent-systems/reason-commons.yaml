      source_refs:
      - source_id: essay
        locator: '§8 Robustness: the wall'
        basis: reconstruction
    - id: ps-rl-obsolete
      from:
      - ps-r-cut-experiments
      to: ps-r-obsolete
      relation: contributes_to
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: essay
        locator: §11 Telling the three apart
        basis: reconstruction
    backlog:
    - ref: ps-rl-surface
      work: test_causality
      label: Check in one real group whether quick fixes leave the mismatch in place.
      note: The summary states this from its author's facilitation experience; alternative explanations for recurring conflict have not been examined.
  conflict:
    nodes:
    - id: ps-c1-objective
      kind: objective
      text: The group persists through both shocks and lasting change.
      label: The group lasts through shocks and change.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: essay
        locator: §6 Three ways to die
        basis: reconstruction
    - id: ps-c1-absorb
      kind: need
      text: The group needs to absorb the shocks its environment delivers.
      label: It needs to absorb shocks.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: essay
        locator: '§8 Robustness: the wall'
        basis: reconstruction
    - id: ps-c1-renew
      kind: need
      text: The group needs to keep finding new ways to persist as its environment changes.
      label: It needs to keep finding new ways to persist.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: essay
        locator: '§9 Adaptation: buying lottery tickets'
        basis: reconstruction
    - id: ps-c1-reserve
      kind: prerequisite
      text: Hold resources back as stored surplus, redundancy and margin.
      label: Hold resources in reserve.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: essay
        locator: '§8 Robustness: stored surplus, redundancy, margin'
        basis: paraphrase
    - id: ps-c1-experiment
      kind: prerequisite
      text: Spend resources on experiments, most of which will fail.
      label: Spend resources on experiments.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: essay
        locator: §9 Adaptation is paid for in failure
        basis: paraphrase
    - id: ps-c2-objective
      kind: objective
      text: The group cooperates well enough to persist in a competitive field.
      label: It cooperates well enough to compete.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: p. 3, The Persistence Framework
        basis: inference
    - id: ps-c2-trust
      kind: need
      text: Members need to trust one another enough to say what really gets in the way.
      label: Members need to say what really gets in the way.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: p. 7, why bother with ACT
        basis: reconstruction
    - id: ps-c2-standing
      kind: need
      text: Members need to protect their standing in a field that punishes weakness.
      label: Members need to protect their standing.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: p. 7, competitive fields and vulnerability
        basis: reconstruction
    - id: ps-c2-open
      kind: prerequisite
      text: Members are open and vulnerable about their real thoughts, feelings and needs.
      label: Be open and vulnerable.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: p. 7, ACT and EFT help people become more open and vulnerable
        basis: paraphrase
    - id: ps-c2-guarded
      kind: prerequisite
      text: Members keep their guard up and avoid showing vulnerability.
      label: Keep your guard up.
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: p. 7, our basic instinct in fearful situations is to maintain our guard
        basis: paraphrase
    links:
    - id: ps-cl1-absorb
      from:
      - ps-c1-absorb
      to: ps-c1-objective
      relation: necessary_for
      status: proposed
      contributions: *id001
      source_refs:
