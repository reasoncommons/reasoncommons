      - source_id: ap-summary
        locator: p. 5, robustness principles
        basis: reconstruction
    - id: ps-gl-read-env
      from:
      - ps-g-read-env
      to: ps-g-fit
      relation: necessary_for
      status: proposed
      contributions: *id001
