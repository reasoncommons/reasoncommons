        basis: reconstruction
    - id: ps-gl-try
      from:
      - ps-g-try
      to: ps-g-adapt
      relation: necessary_for
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: p. 5, adaptability principles
