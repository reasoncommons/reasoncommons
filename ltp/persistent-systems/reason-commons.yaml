        locator: p. 7, ACT and EFT
        basis: reconstruction
    - id: ps-fl-voiced-gentle
      from:
      - ps-f-gentle
      to: ps-f-voiced
      relation: contributes_to
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: pp. 7–8, a deeper clean later
        basis: inference
    - id: ps-fl-willing
      from:
      - ps-f-voiced
      to: ps-f-willing
      relation: contributes_to
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: p. 7, access their inner thoughts and feelings and obtain their willingness
        basis: paraphrase
    - id: ps-fl-causes
      from:
      - ps-f-see
      - ps-f-voiced
      to: ps-f-causes
      relation: contributes_to
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: p. 7, Assess gathers structural problems; ACT reaches inner needs
        basis: inference
    - id: ps-fl-cooperate
      from:
      - ps-f-causes
      - ps-f-willing
      to: ps-f-cooperate
      relation: contributes_to
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: p. 3, changes implemented in-house are more sustainable
        basis: inference
    - id: ps-fl-fit
      from:
      - ps-f-causes
      to: ps-f-fit
      relation: contributes_to
      status: proposed
      contributions: *id001
      source_refs:
      - source_id: ap-summary
        locator: p. 6, 4. Adjust
